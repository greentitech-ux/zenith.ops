services:
  - type: web
    name: zenith-ops
    runtime: node
    plan: free
    rootDir: server
    # AUTO-DEPLOY DESLIGADO (23/08/2026). Todo push na master subia sozinho,
    # e todo boot custa ~5 mil leituras no Firestore - num dia de trabalho
    # foram 33 deploys. Agora a subida é um clique em "Manual Deploy" no
    # painel do Render, quando VOCÊ decidir: no horário combinado, ou na
    # hora, se a operação estiver parada. Ver server/DESENVOLVIMENTO.md.
    autoDeploy: false
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: ADYEN_HMAC_KEYS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
