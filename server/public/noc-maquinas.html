<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde das Máquinas — NOC Zenith</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#181d24; --line:#232a33;
    --text:#e7ecf1; --muted:#7d8896;
    --ok:#3ddc97; --warn:#f2b33d; --bad:#ff5c5c; --accent:#5cc8ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;min-width:0;}
  html{overflow-x:hidden;}
  /* mobile PRIMEIRO: o padding pequeno e a coluna unica sao o estado base,
     e o desktop e que ganha folga no @media de cima - o usuario usa muito
     mais o celular do que o computador nessa tela */
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    padding:16px 14px 48px;overflow-x:clip;-webkit-text-size-adjust:100%;}
  header{position:sticky;top:0;z-index:40;background:var(--bg);margin:-16px -14px 14px;
    padding:12px 14px;border-bottom:1px solid var(--line);}
  .header-top{display:flex;align-items:center;gap:10px;}
  h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;}
  .eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
  .hamburger-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;
    width:38px;height:38px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .header-nav{display:flex;align-items:center;gap:8px;margin-top:8px;}
  button.back{font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 12px;border-radius:16px;
    border:1px solid var(--line);background:none;cursor:pointer;white-space:nowrap;min-height:36px;}
  button.back:hover{color:var(--text);border-color:var(--accent);}
  #atualizado{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;text-align:right;}
  .hidden{display:none!important;}
  .vazio{font-size:12.5px;color:var(--muted);padding:18px 0;line-height:1.6;}

  /* ---- KPIs: cada um e um FILTRO. No celular a primeira coisa que a
     pessoa faz e tocar em "crítico" - entao o numero tem que ser o botao,
     nao um enfeite ao lado do botao ---- */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
    text-align:left;cursor:pointer;min-height:64px;font-family:inherit;color:inherit;
    transition:border-color .15s ease,background .15s ease;}
  .kpi:active{transform:scale(.985);}
  .kpi.sel{border-color:var(--accent);background:rgba(92,200,255,.10);}
  .kpi .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;}
  .kpi .r{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;}
  .kpi.critico .n{color:var(--bad);} .kpi.atencao .n{color:var(--warn);}
  .kpi.reiniciar .n{color:var(--accent);} .kpi.ok .n{color:var(--ok);}

  .busca{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:15px;padding:11px 13px;margin-bottom:12px;min-height:44px;}
  .busca::placeholder{color:var(--muted);}
  .busca:focus{outline:none;border-color:var(--accent);}

  /* ---- cards: um por computador, empilhados no celular ---- */
  .lista{display:grid;grid-template-columns:1fr;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:13px 14px;}
  .card.critico{border-left-color:var(--bad);} .card.atencao{border-left-color:var(--warn);}
  .card.ok{border-left-color:var(--ok);} .card.sem{border-left-color:var(--line);}
  .card-topo{display:flex;align-items:flex-start;gap:8px;}
  .card-nome{font-weight:700;font-size:14.5px;line-height:1.25;}
  .card-unidade{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--muted);}
  .dot.online{background:var(--ok);} .dot.offline{background:var(--bad);}
  .selo{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;border-radius:12px;margin-left:auto;white-space:nowrap;flex:none;}
  .selo.critico{background:rgba(255,92,92,.15);color:var(--bad);}
  .selo.atencao{background:rgba(242,179,61,.15);color:var(--warn);}
  .selo.ok{background:rgba(61,220,151,.13);color:var(--ok);}
  .selo.sem{background:var(--panel2);color:var(--muted);}

  /* barra de uso do disco: no celular a barra comunica em meio segundo o
     que "18 GB de 465" so comunica depois de fazer conta na cabeca */
  .barra-wrap{margin-top:11px;}
  .barra-topo{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;gap:8px;}
  .barra-topo b{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .barra{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;}
  .barra i{display:block;height:100%;border-radius:5px;background:var(--ok);}
  .barra i.atencao{background:var(--warn);} .barra i.critico{background:var(--bad);}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .chip{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:4px 9px;white-space:nowrap;}
  .chip b{color:var(--text);font-weight:600;}
  .chip.alerta{border-color:var(--warn);color:var(--warn);} .chip.alerta b{color:var(--warn);}
  .chip.ruim{border-color:var(--bad);color:var(--bad);} .chip.ruim b{color:var(--bad);}

  .motivos{margin-top:10px;font-size:12px;line-height:1.55;}
  .motivos div{margin-top:3px;}
  .motivos .m-critico{color:var(--bad);} .motivos .m-atencao{color:var(--warn);}

  .detalhe{margin-top:11px;border-top:1px solid var(--line);padding-top:9px;}
  .detalhe summary{font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;
    list-style:none;padding:4px 0;min-height:28px;}
  .detalhe summary::-webkit-details-marker{display:none;}
  .detalhe summary::before{content:'▸ ';}
  .detalhe[open] summary::before{content:'▾ ';}
  .linha-det{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px;}
  .linha-det b{color:var(--text);font-weight:600;}

  /* desktop: mais respiro e cards lado a lado - o layout de celular
     continua sendo a base, isto so aproveita a largura que sobra */
  @media(min-width:720px){
    body{padding:26px 30px 60px;}
    header{margin:-26px -30px 18px;padding:12px 30px;}
    h1{font-size:20px;}
    .kpis{grid-template-columns:repeat(4,1fr);}
    .lista{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));}
    .busca{max-width:420px;}
  }
</style>
<script src="/tema.js"></script>
</head>
<body>
<header>
  <div class="header-top">
    <button class="hamburger-btn" id="nav-toggle" aria-label="Menu">☰</button>
    <div style="flex:1;min-width:0;">
      <div class="eyebrow">Zenith Ops · Solutions TI Tech</div>
      <h1>💽 Saúde das Máquinas</h1>
    </div>
  </div>
  <div class="header-nav">
    <button class="back" onclick="carregar()">🔄 Atualizar</button>
    <span id="atualizado"></span>
  </div>
</header>

<div id="sem-acesso" class="hidden vazio">Você não tem acesso a esta página.</div>

<div id="raiz" class="hidden">
  <div class="kpis" id="kpis"></div>
  <input class="busca" id="busca" type="search" placeholder="Buscar loja ou computador..." autocomplete="off">
  <div class="lista" id="lista"><div class="vazio">carregando...</div></div>
</div>

<script>
// O token do login mora no localStorage e TEM que ir em toda chamada de
// /api/ - sem isso o servidor responde 401 e a pagina mostrava "Você não
// tem acesso a esta página" pra todo mundo, Master inclusive: nao era
// permissao faltando, era requisicao sem credencial. Mesmo bloco das
// outras paginas (ver loja-status.html).
let AUTH_TOKEN = localStorage.getItem('authToken') || null;
if(!AUTH_TOKEN){ location.href = '/'; }

const _rawFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/') && AUTH_TOKEN) {
    opts = { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + AUTH_TOKEN } };
  }
  return _rawFetch(url, opts).then((res) => { if (res.status === 401) logout(); return res; });
};
function logout(){ localStorage.removeItem('authToken'); location.href = '/'; }

let DADOS = null;
let FILTRO = 'todos';   // todos | critico | atencao | reiniciar | ok
let BUSCA = '';

const escapeHtml = (s) => String(s==null?'':s).replace(/[&<>"']/g, (c) => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tempoRelativo(quando){
  if(!quando) return 'nunca';
  const ms = typeof quando === 'number' ? quando : Date.parse(quando);
  if(!Number.isFinite(ms)) return '—';
  const s = Math.floor((Date.now()-ms)/1000);
  if(s < 60) return 'agora';
  if(s < 3600) return `há ${Math.floor(s/60)}min`;
  if(s < 86400) return `há ${Math.floor(s/3600)}h`;
  return `há ${Math.floor(s/86400)}d`;
}
// "38000h ligado" nao diz nada pra ninguem; "4,3 anos" diz
function anosLigado(horas){
  if(horas == null) return null;
  const anos = horas/8760;
  return anos >= 1 ? `${anos.toFixed(1)} anos` : `${Math.round(horas/730)} meses`;
}

async function carregar(){
  try{
    DADOS = await fetch('/api/loja-status/maquinas').then(r=>r.json());
    if(DADOS.error) throw new Error(DADOS.error);
  }catch(e){
    document.getElementById('lista').innerHTML = `<div class="vazio">erro ao carregar: ${escapeHtml(e.message)}</div>`;
    return;
  }
  document.getElementById('atualizado').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  render();
}

function contagens(){
  const cs = (DADOS && DADOS.computadores) || [];
  return {
    critico: cs.filter(c=>c.nivel==='critico').length,
    atencao: cs.filter(c=>c.nivel==='atencao').length,
    reiniciar: cs.filter(c=>c.precisaReiniciar).length,
    ok: cs.filter(c=>c.nivel==='ok' && c.temMedicao).length,
    semMedicao: cs.filter(c=>!c.temMedicao).length,
    total: cs.length,
  };
}

function renderKpis(){
  const n = contagens();
  const botao = (chave, classe, valor, rotulo) =>
    `<button type="button" class="kpi ${classe} ${FILTRO===chave?'sel':''}" onclick="filtrar('${chave}')">
      <div class="n">${valor}</div><div class="r">${rotulo}</div></button>`;
  document.getElementById('kpis').innerHTML =
    botao('critico','critico',n.critico,'crítico — age hoje')
    + botao('atencao','atencao',n.atencao,'atenção — agende')
    + botao('reiniciar','reiniciar',n.reiniciar,'reiniciar (7+ dias)')
    + botao('ok','ok',n.ok,`tudo certo${n.semMedicao?` · ${n.semMedicao} sem medir`:''}`);
}

function filtrar(chave){
  FILTRO = (FILTRO === chave) ? 'todos' : chave;   // tocar de novo limpa
  render();
}

function passaFiltro(c){
  if(FILTRO==='critico') return c.nivel==='critico';
  if(FILTRO==='atencao') return c.nivel==='atencao';
  if(FILTRO==='reiniciar') return c.precisaReiniciar;
  if(FILTRO==='ok') return c.nivel==='ok' && c.temMedicao;
  return true;
}
function passaBusca(c){
  if(!BUSCA) return true;
  const alvo = `${c.nome} ${c.unidadeNome||c.codigo} ${c.posto}`.toLowerCase();
  return alvo.includes(BUSCA);
}

function barraDisco(v){
  if(!v || v.livrePct == null) return '';
  const usadoPct = Math.max(0, Math.min(100, 100 - v.livrePct));
  const classe = v.livrePct < 5 ? 'critico' : (v.livrePct < 10 ? 'atencao' : '');
  // o "% em uso" ao lado da barra existe porque barra quase cheia + cor
  // verde se contradizem sem o número (75% em uso ainda é saudável)
  return `<div class="barra-wrap">
    <div class="barra-topo"><span><b>${escapeHtml(v.letra)}</b> <span style="color:var(--muted);">${usadoPct.toFixed(0)}% em uso</span></span>
      <b>${v.livreGb} GB livres de ${v.totalGb}</b></div>
    <div class="barra"><i class="${classe}" style="width:${usadoPct.toFixed(1)}%"></i></div>
  </div>`;
}

function cardHtml(c){
  const nivelCard = c.temMedicao ? c.nivel : 'sem';
  const selo = { critico:'crítico', atencao:'atenção', ok:'ok', sem:'sem medir' }[nivelCard];
  const chips = [];
  if(c.temperatura != null){
    const quente = c.temperatura >= 60;
    chips.push(`<span class="chip ${quente?'alerta':''}">🌡️ <b>${c.temperatura}°C</b></span>`);
  }
  if(c.uptimeDias != null){
    chips.push(`<span class="chip ${c.precisaReiniciar?'alerta':''}">🔁 sem reiniciar <b>${c.uptimeDias}d</b></span>`);
  }
  const discoPrincipal = (c.disco && c.disco.discos && c.disco.discos[0]) || null;
  if(discoPrincipal && discoPrincipal.horasLigado != null){
    const velho = discoPrincipal.horasLigado >= 35000;
    chips.push(`<span class="chip ${velho?'alerta':''}">⏳ disco <b>${anosLigado(discoPrincipal.horasLigado)}</b></span>`);
  }
  if(c.aparelhosRede) chips.push(`<span class="chip">📡 <b>${c.aparelhosRede}</b> na rede</span>`);
  // medição velha muda o que a tela significa: "tudo certo" de 3 dias atrás
  // não é "tudo certo agora". Só aparece quando passa de 12h, pra não virar
  // ruído no dia a dia (o normal é medir a cada 6h)
  if(c.disco && c.disco.em && (Date.now() - c.disco.em) > 12*3600*1000){
    chips.push(`<span class="chip alerta">🕐 medido ${escapeHtml(tempoRelativo(c.disco.em))}</span>`);
  }

  const motivos = (c.motivos||[]).length
    ? `<div class="motivos">${c.motivos.map(m=>`<div class="m-${c.nivel}">⚠️ ${escapeHtml(m)}</div>`).join('')}</div>` : '';

  // o detalhe fica FECHADO: no celular, card curto é o que deixa a lista
  // rolável. Quem precisa do modelo/serial abre.
  const discos = ((c.disco && c.disco.discos) || []).map(d=>{
    const partes = [d.tipo, d.tamanhoGb?`${d.tamanhoGb} GB`:null,
      d.saude!=='desconhecida'?`saúde: ${d.saude}`:null,
      d.errosLeitura?`${d.errosLeitura} erro(s) de leitura`:null,
      d.desgastePct!=null?`${d.desgastePct}% desgaste`:null].filter(Boolean).join(' · ');
    return `<div class="linha-det">• <b>${escapeHtml(d.modelo||'disco')}</b>${partes?` — ${escapeHtml(partes)}`:''}</div>`;
  }).join('');
  const outrosVolumes = ((c.disco && c.disco.volumes) || [])
    .filter(v=>!c.volumeCritico || v.letra !== c.volumeCritico.letra)
    .map(v=>`<div class="linha-det">• <b>${escapeHtml(v.letra)}</b> ${v.livreGb} GB livres de ${v.totalGb} (${v.livrePct}%)</div>`).join('');
  const medidoEm = c.disco && c.disco.em ? `<div class="linha-det">medido ${escapeHtml(tempoRelativo(c.disco.em))}</div>` : '';
  const detalhe = (discos || outrosVolumes || medidoEm)
    ? `<details class="detalhe"><summary>detalhes do disco</summary>${discos}${outrosVolumes}${medidoEm}</details>` : '';

  const semMedicao = !c.temMedicao
    ? `<div class="motivos"><div style="color:var(--muted);">o NOCZenith desse computador ainda não mandou medição — confira se o agente está instalado e atualizado.</div></div>` : '';

  return `<div class="card ${nivelCard}">
    <div class="card-topo">
      <span class="dot ${c.online?'online':'offline'}" title="${c.online?'online':'offline'}"></span>
      <div style="flex:1;min-width:0;">
        <div class="card-nome">${escapeHtml(c.nome)}</div>
        <div class="card-unidade">${escapeHtml(c.unidadeNome||c.codigo)}${c.online?'':' · offline '+escapeHtml(tempoRelativo(c.ultimoHeartbeatEm))}</div>
      </div>
      <span class="selo ${nivelCard}">${selo}</span>
    </div>
    ${barraDisco(c.volumeCritico)}
    ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
    ${motivos}${semMedicao}${detalhe}
  </div>`;
}

function render(){
  renderKpis();
  const cs = ((DADOS && DADOS.computadores) || []).filter(c=>passaFiltro(c) && passaBusca(c));
  document.getElementById('lista').innerHTML = cs.length
    ? cs.map(cardHtml).join('')
    : '<div class="vazio">nenhum computador nesse filtro.</div>';
}

document.getElementById('busca').addEventListener('input', (e) => {
  BUSCA = e.target.value.trim().toLowerCase();
  render();
});

(async function inicio(){
  try{
    const me = await fetch('/api/me').then(r=>r.json());
    const secoes = (me.permissions && me.permissions.sections) || [];
    if(!(me.role === 'master' || me.isAdmin || secoes.includes('suporte'))){
      document.getElementById('sem-acesso').classList.remove('hidden');
      return;
    }
    document.getElementById('raiz').classList.remove('hidden');
    await carregar();
    // 2min: os dados por tras mudam a cada ~1h/~6h, recarregar mais rapido
    // so gastaria bateria do celular sem mostrar nada novo
    setInterval(() => { if(!document.hidden) carregar(); }, 120000);
  }catch(e){ document.getElementById('sem-acesso').classList.remove('hidden'); }
})();
</script>
<script src="/recolher.js"></script>
<script src="/nav-menu.js"></script>
</body>
</html>
