<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Autorizações · NoPulso</title>
<link rel="manifest" href="/manifest.json">
<script src="/tema.js"></script><script src="/digital.js" defer></script>
<link rel="stylesheet" href="/style.css">
<!-- AUTORIZAÇÕES (Master, 23/09/2026): "o Beniboy e o Claude resolvem, eu só
     faço a autorização; ela chega no celular e eu aprovo com a senha ou a
     digital, sempre dando a digital como primeira opção".
     O push de cada pedido abre esta tela no pedido (?id=). O que aparece em
     "detalhes" é montado pelo SERVIDOR a partir do que vai rodar - não é um
     texto do modelo. -->
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c;--accent2:#5cc8ff;--ok:#3ddc97;--warn:#ffbd59;--bad:#ff6b6b;--sans:Arial,sans-serif;--mono:ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg,#0b0d10);color:var(--text,#e7ecf1);font-family:var(--sans,system-ui,sans-serif);padding:0 16px 48px}
header{position:sticky;top:0;z-index:40;background:var(--bg,#0b0d10);border-bottom:1px solid var(--line,#232a33);margin:0 -16px 16px;padding:12px 16px}
.header-top{display:flex;align-items:center;gap:10px}.header-copy{min-width:0}
.eyebrow{font-family:var(--mono,monospace);font-size:10px;letter-spacing:.1em;color:var(--accent);margin-bottom:3px}
.page-title{margin:0;font-size:20px;line-height:1.1}
.hamburger-btn{width:34px;height:34px;border-radius:8px;padding:0;flex:none;background:var(--panel2,#181d24);color:var(--text,#e7ecf1);border:1px solid var(--line,#232a33)}
main{max-width:640px;margin:0 auto}
/* CINCO COLUNAS (Master, 24/09/2026), uma por ESTADO de verdade:
   Pendente, Não rodou, Autorizado, Recusado, Venceu.

   Uma por estado porque o servidor produz cinco (qaAprovacoes.js) - dobrar
   dois deles dentro dos outros fazia a coluna dizer uma coisa e o cartão
   dentro dela dizer outra.

   AS DUAS QUE PEDEM AÇÃO VÊM PRIMEIRO (Pendente, Não rodou). No celular as
   colunas empilham, então a ordem É a prioridade: o Master chega aqui pelo
   push, pra decidir.

   `auto-fit` em vez de um breakpoint por largura: a tela acha sozinha quantas
   colunas cabem - 5 no monitor, 2 ou 3 no notebook, 1 no celular. Cinco
   colunas lado a lado em 390px seria pior que a lista de antes. */
@media(min-width:900px){ main{max-width:1400px} }
.colunas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));align-items:start}
.coluna{min-width:0}
.col-topo{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line,#232a33)}
.col-nome{font:12px var(--mono,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#7d8896);font-weight:600}
.coluna.pendente .col-nome{color:var(--accent)}
.coluna.erro .col-nome{color:var(--warn,#ffbd59)}
.col-conta{font:12px var(--mono,monospace);color:var(--muted,#7d8896);margin-left:auto;flex:none}
.col-nota{font-size:11.5px;color:var(--muted,#7d8896);line-height:1.4;margin:-4px 0 10px}
.col-vazia{color:var(--muted,#7d8896);font-size:13px;padding:8px 0 16px}
/* O RESULTADO DE UMA ACAO QUE ACABOU DE RODAR fica ACIMA das colunas, nao
   dentro da coluna Autorizado. Ele aparece UMA vez e nao fica gravado (pode
   ser uma senha temporaria): mandar ele pra uma coluna que no celular esta
   abaixo da dobra seria perder o unico momento em que da pra ler. */
#agora:not(:empty){margin-bottom:18px}
.muted{color:var(--muted,#7d8896);font-size:13px;line-height:1.45}
h2{font-size:12px;font-family:var(--mono,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#7d8896);margin:22px 0 10px;font-weight:600}
.pedido{background:var(--panel,#12161b);border:1px solid var(--line,#232a33);border-radius:13px;padding:15px;margin-bottom:12px}
.pedido.foco{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.origem{display:inline-block;font:11px var(--mono,monospace);padding:3px 8px;border-radius:20px;background:var(--panel2,#181d24);border:1px solid var(--line,#232a33);color:var(--accent2,#5cc8ff);margin-bottom:8px}
.resumo{font-size:16px;font-weight:700;line-height:1.35;margin:0 0 4px;overflow-wrap:anywhere}
.detalhes{margin:10px 0 0;padding:10px 12px;background:var(--panel2,#181d24);border-radius:9px;display:grid;gap:6px}
.detalhes div{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:8px;font-size:13px}
.detalhes dt{color:var(--muted,#7d8896);font:12px var(--mono,monospace)}
.detalhes dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.erro{color:var(--bad,#ff5c5c);font-size:13px;margin-top:8px}
.acoes{display:grid;gap:8px;margin-top:14px}
button{border:1px solid var(--line,#232a33);background:var(--panel2,#181d24);color:var(--text,#e7ecf1);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:default}
.primario{background:var(--accent);color:#0b0d10;border-color:var(--accent);font-size:15px;padding:14px}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recusar{color:var(--bad,#ff5c5c)}
.senha{display:grid;gap:8px}
.senha input{width:100%;padding:12px;background:var(--panel2,#181d24);color:var(--text,#e7ecf1);border:1px solid var(--line,#232a33);border-radius:10px;font:15px var(--sans,system-ui,sans-serif)}
.senha input:focus{outline:none;border-color:var(--accent)}
.feito{margin-top:10px;font-size:13.5px}
.feito.ok{color:var(--ok,#3ddc97)}
pre.saida{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2,#181d24);border:1px solid var(--line,#232a33);border-radius:9px;padding:10px;font:12px var(--mono,monospace);margin:8px 0 0;max-height:260px;overflow:auto}
.decidido{opacity:.75}
.filtros{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px;margin:14px 0 4px}.filtros select,.filtros input{min-width:0;width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line,#232a33);background:var(--panel2,#181d24);color:var(--text,#e7ecf1);font:13px var(--sans,system-ui,sans-serif)}
.filtro-resumo{font:11.5px var(--mono,monospace);color:var(--muted,#7d8896);margin:7px 0 16px}.linha-tempo{margin:10px 0 0;padding:9px 11px;border-left:2px solid var(--line,#232a33);font-size:11.5px;color:var(--muted,#7d8896);display:grid;gap:5px}.linha-tempo b{color:var(--text,#e7ecf1);font-weight:600}
@media(max-width:520px){.filtros{grid-template-columns:1fr}}
.hidden{display:none!important}
</style>
</head>
<body>
<script src="/nav-menu.js"></script><script src="/recolher.js"></script>
<script>
const authToken=localStorage.getItem('authToken');if(!authToken)location='/';
const fetchOriginal=fetch.bind(window);
window.fetch=(url,opcoes={})=>fetchOriginal(url,{...opcoes,headers:{...(opcoes.headers||{}),...(String(url).startsWith('/api/')?{Authorization:'Bearer '+authToken}:{})}}).then(r=>{if(r.status===401){localStorage.removeItem('authToken');location='/'}return r});
</script>
<header><div class="header-top"><button type="button" class="hamburger-btn" aria-label="Abrir menu" title="Menu">☰</button><div class="header-copy"><div class="eyebrow">NOPULSO · SOLUTIONS TI TECH</div><h1 class="page-title">🔐 Autorizações</h1></div></div></header>
<main>
   <p class="muted" id="intro">O que o Claude, o Beniboy ou um QA Master prepararam e só roda com a sua autorização.</p>
   <div class="filtros" aria-label="Filtrar autorizações">
     <select id="f-origem" onchange="mudarFiltro()"><option value="">Todas as origens</option><option value="cowork">🤖 Claude · Cowork</option><option value="beniboy">💬 Beniboy</option><option value="qa">🧪 QA Master</option></select>
     <input id="f-busca" type="search" autocomplete="off" placeholder="Buscar ação, pessoa, protocolo ou detalhe…" oninput="mudarFiltro()">
   </div>
   <div class="filtro-resumo" id="filtro-resumo"></div>
  <div id="agora"></div>
  <div class="colunas">
    <section class="coluna pendente"><div class="col-topo"><span class="col-nome">Pendente</span><span class="col-conta" id="c-pendente"></span></div><div id="col-pendente"><p class="muted">Carregando…</p></div></section>
    <section class="coluna erro"><div class="col-topo"><span class="col-nome">⚠️ Não rodou</span><span class="col-conta" id="c-erro"></span></div><div id="col-erro"></div></section>
    <section class="coluna"><div class="col-topo"><span class="col-nome">Autorizado</span><span class="col-conta" id="c-aprovado"></span></div><div id="col-aprovado"></div></section>
    <section class="coluna"><div class="col-topo"><span class="col-nome">Recusado</span><span class="col-conta" id="c-rejeitado"></span></div><div id="col-rejeitado"></div></section>
    <section class="coluna"><div class="col-topo"><span class="col-nome">Venceu</span><span class="col-conta" id="c-expirado"></span></div><div id="col-expirado"></div></section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORIGEM={cowork:'🤖 Claude · Cowork',beniboy:'💬 Beniboy',qa:'🧪 QA Master'};
const FOCO=new URLSearchParams(location.search).get('id')||'';
let LISTA=[];
let DIGITAL=false;
const FEITOS=new Map(); // id -> resultado mostrado uma vez (senha temporária inclusive)
let FILTRO_ORIGEM='';let FILTRO_BUSCA='';

function quando(iso){if(!iso)return '';const m=Math.round((Date.now()-Date.parse(iso))/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';const h=Math.round(m/60);if(h<48)return 'há '+h+'h';return new Date(iso).toLocaleDateString('pt-BR')}
function vence(iso){if(!iso)return '';const m=Math.round((Date.parse(iso)-Date.now())/60000);if(m<=0)return ' · venceu';if(m<60)return ' · vence em '+m+' min';return ' · vence em '+Math.round(m/60)+'h'}
function vencido(a){return a.status==='pendente'&&a.expiraEm&&Date.parse(a.expiraEm)<=Date.now()}
// ERRO DEFINITIVO NÃO ESTÁ ABERTO. `erro` normal volta pra mão do Master
// ("pode autorizar de novo"); o definitivo falhou por uma regra que repetir
// não muda - cancelar uma tarefa já concluída, por exemplo. Caso real de
// 24/09: o Master autorizou, falhou, e o cartão ficou preso na tela sem
// nenhuma saída, porque o botão que ele oferecia dava o mesmo erro sempre.
function definitivo(a){return a.status==='erro'&&a.erroDefinitivo===true}
function aberto(a){return (a.status==='pendente'||(a.status==='erro'&&!definitivo(a)))&&!vencido(a)}

function cartao(a){
  const feito=FEITOS.get(a.id);
  const det=(a.detalhes||[]).length?`<dl class="detalhes">${a.detalhes.map(d=>`<div><dt>${esc(d.rotulo)}</dt><dd>${esc(d.valor)}</dd></div>`).join('')}</dl>`:'';
  const eventos=(a.historico&&a.historico.length?a.historico:[{evento:'PEDIDO_CRIADO',em:a.criadoEm,porEmail:a.criadoPorEmail},...(a.decididoEm?[{evento:a.status==='aprovado'?'AUTORIZADO_E_EXECUTADO':a.status==='rejeitado'?'RECUSADO':a.status==='erro'?'ERRO_NA_EXECUCAO':'VENCEU',em:a.decididoEm,porEmail:a.decididoPorEmail,motivo:a.motivoRejeicao,erro:a.erroExecucao}]:[])]);
  const tempo=`<div class="linha-tempo">${eventos.map(e=>`<div><b>${esc(String(e.evento||'').replaceAll('_',' '))}</b> · ${esc(quando(e.em))}${e.porEmail?' · '+esc(e.porEmail):''}${e.motivo?' — '+esc(e.motivo):''}${e.erro?' — '+esc(e.erro):''}</div>`).join('')}</div>`;
  const cabeca=`<span class="origem">${esc(ORIGEM[a.origem]||ORIGEM.qa)}</span><p class="resumo">${esc(a.resumo||a.tipo)}</p><div class="muted">${esc(a.criadoPorEmail||'')} · ${quando(a.criadoEm)}${aberto(a)?vence(a.expiraEm):''}</div>${det}${tempo}`;
  if(feito){
    return `<article class="pedido" id="p-${esc(a.id)}">${cabeca}<div class="feito ok">✅ Autorizado e executado.</div>${feito.saida?`<pre class="saida">${esc(feito.saida)}</pre><button type="button" style="margin-top:8px" onclick="copiar('${esc(a.id)}')">Copiar resultado</button><div class="muted" style="margin-top:6px">Este resultado aparece só agora - não fica gravado.</div>`:''}</article>`;
  }
  if(!aberto(a)){
    const rot={aprovado:'✅ Autorizado',rejeitado:'❌ Recusado',expirado:'⌛ Venceu',pendente:'⌛ Venceu',erro:'⚠️ Não rodou'}[a.status]||a.status;
    // diz POR QUE não adianta tentar de novo, em vez de só sumir com o botão
    const porque=definitivo(a)?`<br>${esc(a.erroExecucao||'')}<br><span class="muted">Autorizar de novo daria o mesmo resultado. Se ainda fizer sentido, peça de novo ao Claude.</span>`:'';
    return `<article class="pedido decidido">${cabeca}<div class="feito">${rot}${a.decididoPorEmail?' · '+esc(a.decididoPorEmail):''}${a.decididoEm?' · '+quando(a.decididoEm):''}${a.motivoRejeicao?'<br>Motivo: '+esc(a.motivoRejeicao):''}${porque}</div></article>`;
  }
  // digital PRIMEIRO; senha é a alternativa. Sem digital neste aparelho, a
  // senha aparece direto (não dá pra esconder a única saída)
  const senhaAberta=!DIGITAL;
  return `<article class="pedido${a.id===FOCO?' foco':''}" id="p-${esc(a.id)}">${cabeca}
    ${a.status==='erro'?`<div class="erro">⚠️ Autorizado antes, mas falhou ao executar: ${esc(String(a.erroExecucao||'').replace(/\.*$/,''))}. Pode autorizar de novo.</div>`:''}
    <div class="acoes">
      ${DIGITAL?`<button type="button" class="primario" id="dig-${esc(a.id)}" onclick="autorizarDigital('${esc(a.id)}')">👆 Autorizar com a digital</button>`:''}
      <div class="senha${senhaAberta?'':' hidden'}" id="sen-${esc(a.id)}">
        <input type="password" id="inp-${esc(a.id)}" autocomplete="new-password" placeholder="sua senha" onkeydown="if(event.key==='Enter')autorizarSenha('${esc(a.id)}')">
        <button type="button" class="${DIGITAL?'':'primario'}" onclick="autorizarSenha('${esc(a.id)}')">Autorizar com a senha</button>
      </div>
      <div class="linha">
        ${DIGITAL?`<button type="button" onclick="mostrarSenha('${esc(a.id)}')">🔑 Usar senha</button>`:''}
        <button type="button" class="recusar"${DIGITAL?'':' style="grid-column:1/-1"'} onclick="recusar('${esc(a.id)}')">Recusar</button>
      </div>
      <div class="erro hidden" id="err-${esc(a.id)}"></div>
    </div>
    ${DIGITAL?'':'<div class="muted" style="margin-top:8px">Pra autorizar com a digital, ative a biometria ao entrar no NoPulso por este celular.</div>'}
  </article>`;
}

// EM QUE COLUNA CADA PEDIDO CAI - UMA POR ESTADO.
//
// O servidor produz CINCO estados (qaAprovacoes.js): pendente, aprovado,
// rejeitado, expirado e erro. Cada um tem a sua coluna, e o nome da coluna é
// a MESMA palavra que o selo do cartão já usava - "⚠️ Não rodou", "❌
// Recusado", "⌛ Venceu" (CLAUDE.md §5: nada de palavra nova pra coisa que já
// tem nome).
//
// A primeira versão disto tinha três colunas, com `expirado` dentro de
// Recusado e `erro` dentro de Pendente. Funcionava, mas a coluna dizia uma
// coisa e o cartão dentro dela dizia outra - e quem bate o olho lê o título
// da coluna, não o selo.
//
// ERRO FICA NA COLUNA DELE mesmo quando ainda dá pra repetir: o cartão
// continua com os botões de autorizar dentro da coluna, e por isso ela vem
// logo depois da Pendente - no celular as colunas empilham, então a ordem é
// a prioridade.
//
// O `pendente` que passou do `expiraEm` conta como Venceu: ele nunca mais vai
// rodar, e deixá-lo em Pendente seria pedir uma decisão que não existe mais.
function coluna(a){
  if(FEITOS.has(a.id))return 'agora';
  if(vencido(a))return 'expirado';
  if(a.status==='pendente')return 'pendente';
  if(a.status==='erro')return 'erro';
  if(a.status==='aprovado')return 'aprovado';
  if(a.status==='expirado')return 'expirado';
  return 'rejeitado';
}

function pintar(){
  const texto=(a)=>[a.resumo,a.tipo,a.criadoPorEmail,...(a.detalhes||[]).flatMap(d=>[d.rotulo,d.valor])].join(' ').toLocaleLowerCase('pt-BR');
  const filtrada=LISTA.filter(a=>(!FILTRO_ORIGEM||a.origem===FILTRO_ORIGEM)&&(!FILTRO_BUSCA||texto(a).includes(FILTRO_BUSCA)));
  const agora=filtrada.filter(a=>FEITOS.has(a.id));
  const nas=k=>filtrada.filter(a=>!FEITOS.has(a.id)&&coluna(a)===k);
  // o pedido que o push abriu vem primeiro; depois, o mais novo
  const porNovo=(x,y)=>(y.id===FOCO)-(x.id===FOCO)||Date.parse(y.criadoEm)-Date.parse(x.criadoEm);
  const porDecisao=(x,y)=>Date.parse(y.decididoEm||y.criadoEm)-Date.parse(x.decididoEm||x.criadoEm);
  const pendentes=nas('pendente').sort(porNovo);
  const erros=nas('erro').sort(porNovo);
  // teto nas colunas de desfecho: a lista do servidor já vem com 300, e a
  // tela não precisa virar histórico
  const aprovados=nas('aprovado').sort(porDecisao).slice(0,15);
  const rejeitados=nas('rejeitado').sort(porDecisao).slice(0,15);
  const expirados=nas('expirado').sort(porDecisao).slice(0,15);

  $('#agora').innerHTML=agora.map(cartao).join('');
  const por=(el,lista,vazio)=>{$(el).innerHTML=lista.map(cartao).join('')||`<p class="col-vazia">${vazio}</p>`};
  por('#col-pendente',pendentes,'Nada esperando autorização agora.');
  por('#col-erro',erros,'Nenhuma falhou ao executar.');
  por('#col-aprovado',aprovados,'Nenhuma autorizada ainda.');
  por('#col-rejeitado',rejeitados,'Nenhuma recusada.');
  por('#col-expirado',expirados,'Nenhuma venceu.');
  const conta=(el,n)=>{$(el).textContent=n?String(n):''};
  conta('#c-pendente',pendentes.length);conta('#c-erro',erros.length);
  conta('#c-aprovado',aprovados.length);conta('#c-rejeitado',rejeitados.length);conta('#c-expirado',expirados.length);
  $('#filtro-resumo').textContent=(FILTRO_ORIGEM||FILTRO_BUSCA)?`${filtrada.length} de ${LISTA.length} autorização(ões) no filtro.`:`${LISTA.length} autorização(ões) no histórico.`;
}

function mudarFiltro(){FILTRO_ORIGEM=$('#f-origem').value;FILTRO_BUSCA=$('#f-busca').value.trim().toLocaleLowerCase('pt-BR');pintar()}

async function carregar(){
  const r=await fetch('/api/qa-aprovacoes');
  // o recado vai pra PRIMEIRA coluna, que e a que a pessoa le primeiro no
  // celular - e as outras duas ficam vazias em vez de mentir "nenhuma"
  const recado=t=>{$('#col-pendente').innerHTML=`<p class="muted">${t}</p>`;['#col-erro','#col-aprovado','#col-rejeitado','#col-expirado'].forEach(k=>{$(k).innerHTML=''});};
  if(r.status===403){recado('Só o Master autoriza estes pedidos.');return}
  if(!r.ok){recado('Não consegui carregar os pedidos.');return}
  LISTA=await r.json();
  pintar();
  if(FOCO){const el=document.getElementById('p-'+FOCO);if(el)el.scrollIntoView({block:'center'})}
}
// Atualiza o painel enquanto fica aberto, sem apagar uma senha que o Master
// esteja digitando para autorizar. O push continua abrindo a tela no pedido.
setInterval(()=>{if(document.visibilityState==='visible'&&!document.activeElement?.matches('input[type="password"]'))carregar()},20000);

function erro(id,msg){const el=$('#err-'+id);if(!el)return alert(msg);el.textContent=msg;el.classList.remove('hidden')}
function mostrarSenha(id){$('#sen-'+id).classList.remove('hidden');$('#inp-'+id).focus()}

async function enviar(id,comprovante){
  const r=await fetch('/api/qa-aprovacoes/'+encodeURIComponent(id)+'/aprovar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:comprovante})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Não consegui autorizar.');
  FEITOS.set(id,{saida:d.resultadoParaMaster||''});
  const a=LISTA.find(x=>x.id===id);if(a)Object.assign(a,{status:'aprovado',decididoEm:new Date().toISOString()});
  pintar();
}
async function autorizarDigital(id){
  const b=$('#dig-'+id);b.disabled=true;b.textContent='Toque no sensor…';
  try{const d=await window.nopulsoDigital.confirmarComDigital();await enviar(id,d.confirmacao)}
  catch(x){
    b.disabled=false;b.textContent='👆 Autorizar com a digital';
    // cancelar o sensor não é erro: a pessoa só desistiu
    if(x&&(x.name==='NotAllowedError'||x.name==='AbortError'))return;
    erro(id,x.message||'Não consegui confirmar a digital. Use a senha.');
  }
}
async function autorizarSenha(id){
  const inp=$('#inp-'+id);if(!inp.value)return erro(id,'Digite sua senha.');
  try{await enviar(id,inp.value)}catch(x){inp.value='';erro(id,x.message)}
}
async function recusar(id){
  const motivo=prompt('Motivo da recusa (opcional - o Claude/Beniboy lê isso pra ajustar o pedido):');
  if(motivo===null)return;
  const r=await fetch('/api/qa-aprovacoes/'+encodeURIComponent(id)+'/rejeitar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({motivo})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)return erro(id,d.error||'Não consegui recusar.');
  await carregar();
}
async function copiar(id){const t=(FEITOS.get(id)||{}).saida||'';try{await navigator.clipboard.writeText(t);alert('Copiado.')}catch(e){prompt('Copie:',t)}}

(async()=>{
  // espera o digital.js (defer) antes de decidir o que é primeiro
  await new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r));
  try{DIGITAL=!!(window.nopulsoDigital&&await window.nopulsoDigital.disponivel())}catch(e){DIGITAL=false}
  await carregar();
  // voltou pro app (tocou no push com a tela já aberta): pedidos novos
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar()});
})();
</script>
