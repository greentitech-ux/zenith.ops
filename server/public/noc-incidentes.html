<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incidentes — NOC-NoPulso</title><link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest-noc.json"><meta name="theme-color" content="#0b0d10"><style>
:root{--bg:#0b0d10;--p:#12161b;--p2:#181d24;--line:#232a33;--t:#e7ecf1;--m:#8994a2;--ok:#3ddc97;--w:#f2b33d;--bad:#ff5c5c;--a:var(--accent,#b8ff3c);--mono:ui-monospace,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:16px 14px 48px;background:var(--bg);color:var(--t);font-family:var(--sans)}header{position:sticky;top:0;z-index:10;margin:-16px -14px 14px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:10px}.hamburger-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--p2);color:var(--t);font-size:16px}.eyebrow{font:10px var(--mono);letter-spacing:.1em;color:var(--a);text-transform:uppercase}h1{margin:3px 0 0;font-size:18px}.tabs,.acoes{display:flex;gap:7px;overflow:auto;margin-top:11px}.tab,.btn{border:1px solid var(--line);border-radius:10px;background:var(--p2);color:var(--m);padding:8px 10px;white-space:nowrap;font:10.5px var(--mono);text-decoration:none}.tab.ativo{background:var(--a);border-color:var(--a);color:#0b0d10;font-weight:700}.btn{color:var(--t);cursor:pointer}.btn:hover{border-color:var(--a)}#atualizado{margin:auto 0 auto auto;color:var(--m);font:10px var(--mono)}.hidden{display:none!important}.vazio{padding:28px 3px;color:var(--m);font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.kpi{padding:11px;background:var(--p);border:1px solid var(--line);border-radius:12px}.kpi b{display:block;font:700 22px var(--mono)}.kpi span{font-size:10px;color:var(--m)}.r{color:var(--bad)}.y{color:var(--w)}.g{color:var(--ok)}.info{font-size:11.5px;color:var(--m);line-height:1.45;margin:0 2px 12px}.lista{display:grid;gap:9px}.i{padding:13px;background:var(--p);border:1px solid var(--line);border-left:4px solid var(--w);border-radius:12px}.i.critico{border-left-color:var(--bad)}.it{display:flex;gap:9px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:var(--w);margin-top:5px;flex:none}.critico .dot{background:var(--bad)}h2{font-size:14px;margin:0}.u,.tempo{font:10.5px var(--mono);color:var(--m);margin-top:3px}.nivel{margin-left:auto;border-radius:12px;padding:4px 8px;font:9.5px var(--mono);color:var(--w);background:#342a18}.critico .nivel{color:var(--bad);background:#3b1c22}.motivo{font-size:12.5px;line-height:1.45;margin:10px 0 0}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}.abrir{color:var(--a);border:1px solid #38521a;border-radius:9px;padding:7px 9px;font:10.5px var(--mono);text-decoration:none}@media(min-width:720px){body{padding:26px 30px 60px}header{margin:-26px -30px 18px;padding:12px 30px}.kpis{max-width:550px}.lista{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
</style><script src="/tema.js"></script></head><body><header><div class="top"><button class="hamburger-btn" id="nav-toggle" aria-label="Menu">☰</button><div><div class="eyebrow">NoPulso · Centro de Operações</div><h1>🚨 Incidentes</h1></div></div><nav class="tabs" aria-label="Navegação NOC"><a class="tab ativo" href="/noc-incidentes">Incidentes</a><a class="tab" href="/noc-maquinas">Máquinas</a><a class="tab" href="/noc-rede">Rede</a><a class="tab" href="/loja-status">NOC completo</a></nav><div class="acoes"><button class="btn" onclick="carregar()">↻ Atualizar</button><button class="btn" id="noc-instalar" onclick="nocMobileInstalar()">📲 Instalar</button><button class="btn" id="noc-push" onclick="nocMobilePush()">🔔 Alertas</button><span id="atualizado"></span></div></header><main id="raiz" class="hidden"><section class="kpis" id="kpis"></section><p class="info">Apenas itens que exigem ação agora. Quando a condição normaliza, ela deixa a lista automaticamente.</p><section class="lista" id="lista"></section></main><div id="sem-acesso" class="hidden vazio">Você não tem acesso a esta página.</div><script>
let token=localStorage.getItem('authToken');if(!token)location.href='/';const raw=fetch.bind(window);window.fetch=(u,o={})=>{if(typeof u==='string'&&u.startsWith('/api/'))o={...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token}};return raw(u,o).then(r=>{if(r.status===401){localStorage.removeItem('authToken');location.href='/'}return r})};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rel=t=>{let n=Math.max(0,Date.now()-(t||Date.now()));return n<6e4?'agora':n<36e5?`há ${Math.round(n/6e4)} min`:`há ${Math.round(n/36e5)} h`};function itens(d){let a=[];for(const c of d.computadores||[]){let base={nome:c.nome,unidade:c.unidadeNome||c.codigo,em:c.ultimoHeartbeatEm};if(!c.online){a.push({...base,nivel:'critico',motivo:'Sem sinal do NOC. Verifique energia, rede ou agente.'});continue}if(!c.temMedicao)a.push({...base,nivel:'atencao',motivo:'Online, mas ainda sem telemetria de disco e RAM.'});for(const m of c.motivos||[])a.push({...base,nivel:c.nivel==='critico'?'critico':'atencao',motivo:m});if(String(c.agenteNoPulsoPrint||'').startsWith('falhou'))a.push({...base,nivel:'atencao',nome:'NoPulsoPrint',motivo:`${c.nome}: ${c.agenteNoPulsoPrint}`})}return a.sort((x,y)=>(x.nivel==='critico'?0:1)-(y.nivel==='critico'?0:1)||(x.em||0)-(y.em||0))}function render(d){let a=itens(d),r=a.filter(x=>x.nivel==='critico').length,y=a.length-r,g=(d.computadores||[]).filter(c=>c.online&&c.nivel==='ok').length;document.querySelector('#kpis').innerHTML=`<div class="kpi"><b class="r">${r}</b><span>críticos</span></div><div class="kpi"><b class="y">${y}</b><span>em atenção</span></div><div class="kpi"><b class="g">${g}</b><span>operacionais</span></div>`;document.querySelector('#lista').innerHTML=a.length?a.map(i=>`<article class="i ${i.nivel}"><div class="it"><i class="dot"></i><div><h2>${e(i.nome)}</h2><div class="u">${e(i.unidade)}</div></div><span class="nivel">${i.nivel}</span></div><p class="motivo">${e(i.motivo)}</p><div class="foot"><span class="tempo">último sinal ${e(rel(i.em))}</span><a class="abrir" href="/loja-status">Abrir NOC →</a></div></article>`).join(''):'<div class="vazio">✓ Nenhum incidente ativo. A frota está dentro das regras monitoradas.</div>';document.querySelector('#atualizado').textContent='atualizado agora'}async function carregar(){try{let d=await fetch('/api/loja-status/maquinas').then(r=>r.json());if(d.error)throw Error(d.error);render(d)}catch(x){document.querySelector('#lista').innerHTML='<div class="vazio">Não foi possível carregar os incidentes.</div>'}}(async()=>{try{let m=await fetch('/api/me').then(r=>r.json()),s=(m.permissions&&m.permissions.sections)||[];if(!(m.role==='master'||m.isAdmin||s.includes('suporte')))throw Error();document.querySelector('#raiz').classList.remove('hidden');carregar();setInterval(()=>!document.hidden&&carregar(),60000)}catch(x){document.querySelector('#sem-acesso').classList.remove('hidden')}})();
</script><script src="/noc-incidentes.js"></script><script src="/noc-mobile.js"></script><script src="/recolher.js"></script><script src="/nav-menu.js"></script></body></html>
