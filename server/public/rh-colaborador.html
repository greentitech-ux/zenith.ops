<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meu cadastro · NoPulso</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#181d24; --line:#232a33;
    --text:#e7ecf1; --muted:#7d8896;
    --ok:#3ddc97; --ok-dim:#1c3a2e;
    --warn:#f2b33d; --warn-dim:#3a2e14;
    --bad:#ff5c5c; --bad-dim:#3a1616;
    --accent:#b8ff3c; --accent2:#5cc8ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;min-width:0;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:16px 12px 40px;max-width:520px;margin-inline:auto;}
  h1{font-size:16px;font-weight:700;margin:0;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .hidden{display:none!important;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 6px;font-family:var(--mono);}
  label:first-child{margin-top:0;}
  select,input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font-size:15px;font-family:var(--sans);}
  select:focus,input:focus{outline:none;border-color:var(--accent);}
  .btn-acao{width:100%;padding:20px;border-radius:12px;border:none;font-size:17px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  .btn-acao.entrada{background:var(--accent);color:#0b0d10;}
  .btn-acao.saida{background:var(--warn);color:#241a00;}
  .badge.atrasado{background:rgba(255,138,0,.18);color:var(--warn);border:1px solid var(--warn);}
  .btn-acao:disabled{opacity:.5;cursor:default;}
  /* cobrança do check-out esquecido: some sozinha quando a pessoa fecha o
     ponto. Pulsa devagar (2s) de propósito - o objetivo é ser impossível de
     não ver, não fazer a tela piscar na cara de quem está trabalhando. */
  .aviso-checkout{background:rgba(255,138,0,.14);border:1px solid var(--warn);color:var(--warn);
    border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.5;
    animation:pulsaAviso 2s ease-in-out infinite;}
  .aviso-checkout b{display:block;font-size:15px;margin-bottom:4px;}
  @keyframes pulsaAviso{0%,100%{opacity:1;}50%{opacity:.72;}}
  @media (prefers-reduced-motion: reduce){ .aviso-checkout{animation:none;} }
  .sucesso{text-align:center;padding:20px 4px;}
  .sucesso .icone{font-size:44px;margin-bottom:8px;}
  .sucesso h2{font-size:18px;margin:0 0 4px;}
  .sucesso p{font-size:13px;color:var(--muted);margin:0;}
  .msg{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:8px;word-break:break-word;}
  .msg.err{background:var(--bad-dim);color:var(--bad);}
  .msg.ok{background:var(--ok-dim);color:var(--ok);}
  .empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px;}
  .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px;}
  .estado{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
  .estado .badge{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .badge.aberto{background:var(--ok-dim);color:var(--ok);}
  .badge.fechado{background:var(--panel2);color:var(--muted);border:1px solid var(--line);}
</style>
<script src="/tema.js"></script>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">NoPulso · RH</div>
    <h1 id="titulo">👤 Meu cadastro</h1>
  </div>
</header>

<div id="sem-token" class="empty hidden">Link inválido ou incompleto. Fale com seu gerente pra receber o link certo.</div>
<div id="nao-encontrado" class="empty hidden">Esse link não é mais válido. Fale com seu gerente pra receber um novo.</div>
<div id="inativo" class="empty hidden"></div>

<div id="root" class="hidden">

<!-- Ponto -->
<div class="panel" id="panel-ponto">
  <div class="estado">
    <div>
      <div style="font-weight:700;font-size:15px;" id="ponto-nome"></div>
      <div class="sub" id="ponto-sub"></div>
    </div>
    <span class="badge" id="ponto-badge"></span>
  </div>
  <div class="aviso-checkout hidden" id="aviso-checkout"></div>
  <button type="button" class="btn-acao" id="btn-ponto" onclick="tirarFotoEEnviar()"></button>
  <div class="msg err hidden" id="ponto-msg"></div>
</div>

<!-- sucesso do ponto (some sozinho) -->
<div class="panel hidden" id="panel-sucesso">
  <div class="sucesso">
    <div class="icone" id="suc-icone">✅</div>
    <h2 id="suc-titulo"></h2>
    <p id="suc-texto"></p>
  </div>
</div>

</div>

<input type="file" id="input-foto" accept="image/*" capture="user" class="hidden">

<script>
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtHora(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('pt-BR', { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' }); }

const TOKEN = new URLSearchParams(location.search).get('token');
let FUNCIONARIO = null;
let CHECKIN_ABERTO = null;
// o servidor manda o limite junto com o estado (ver /api/rh/publico/:token) -
// o 9 aqui é só o que vale se a resposta vier sem ele; a regra é do servidor
let LIMITE_CHECKOUT_HORAS = 9;

function horasAbertoAgora(){
  if(!CHECKIN_ABERTO || !CHECKIN_ABERTO.entrada) return null;
  const ms = Date.now() - new Date(CHECKIN_ABERTO.entrada).getTime();
  if(!Number.isFinite(ms) || ms < 0) return null;
  return ms / 3600000;
}

function renderPonto(){
  document.getElementById('ponto-nome').textContent = FUNCIONARIO.nome;
  document.getElementById('ponto-sub').textContent = FUNCIONARIO.unidade || '';
  const badge = document.getElementById('ponto-badge');
  const btn = document.getElementById('btn-ponto');
  const aviso = document.getElementById('aviso-checkout');
  aviso.classList.add('hidden');
  if(CHECKIN_ABERTO){
    // as horas são recalculadas na tela (e não só as que vieram do servidor)
    // pra continuar contando com a página aberta - senão um celular deixado
    // ligado mostraria pra sempre o valor do momento em que carregou
    const horas = horasAbertoAgora();
    const estourou = horas !== null && horas >= LIMITE_CHECKOUT_HORAS;
    badge.className = estourou ? 'badge atrasado' : 'badge aberto';
    badge.textContent = estourou
      ? `há ${Math.floor(horas)}h sem check-out`
      : `na loja desde ${fmtHora(CHECKIN_ABERTO.entrada)}`;
    btn.textContent = '🚪 Fazer check-out';
    btn.className = 'btn-acao saida';
    if(estourou){
      aviso.innerHTML = `<b>⏰ Faça seu check-out</b>Você entrou às ${fmtHora(CHECKIN_ABERTO.entrada)} e já está `
        + `há <b style="display:inline">${Math.floor(horas)}h</b> com o ponto aberto. `
        + `Toque no botão abaixo pra registrar a saída - precisa da foto e da localização, igual na entrada.`;
      aviso.classList.remove('hidden');
    }
  }else{
    badge.className = 'badge fechado';
    badge.textContent = 'fora';
    btn.textContent = '✅ Fazer check-in';
    btn.className = 'btn-acao entrada';
  }
}

// localizacao e obrigatoria (pedido explicito do usuario, junto com a foto)
// - se negar/nao suportar/estourar o tempo, rejeita a promise pra bloquear
// o registro
function obterLocalizacao(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation){ reject(new Error('Esse dispositivo não suporta localização - não é possível bater ponto por aqui.')); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, precisao: pos.coords.accuracy }),
      () => reject(new Error('Não foi possível obter a localização - permita o acesso à localização e tente de novo.')),
      { timeout: 8000, maximumAge: 60000 }
    );
  });
}

function tirarFotoEEnviar(){
  const input = document.getElementById('input-foto');
  input.value = '';
  input.onchange = () => {
    if(input.files[0]) enviarPonto(input.files[0]);
  };
  input.click();
}

async function enviarPonto(foto){
  const btn = document.getElementById('btn-ponto');
  const msg = document.getElementById('ponto-msg');
  msg.classList.add('hidden');
  btn.disabled = true;
  try{
    const localizacao = await obterLocalizacao();
    const fd = new FormData();
    fd.append('foto', foto);
    fd.append('lat', localizacao.lat);
    fd.append('lng', localizacao.lng);
    fd.append('precisao', localizacao.precisao);
    const ehEntrada = !CHECKIN_ABERTO;
    const url = ehEntrada ? `/api/rh/publico/${TOKEN}/checkin` : `/api/rh/publico/${TOKEN}/checkin/saida`;
    const resp = await fetch(url, { method:'POST', body: fd });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Erro ao registrar.');
    document.getElementById('panel-ponto').classList.add('hidden');
    document.getElementById('panel-sucesso').classList.remove('hidden');
    if(data.status==='pendente_aprovacao'){
      document.getElementById('suc-icone').textContent = '⏳';
      document.getElementById('suc-titulo').textContent = 'Aguardando aprovação';
      document.getElementById('suc-texto').textContent = 'Pedido enviado pro RH - aguarde a aprovação.';
    }else{
      document.getElementById('suc-icone').textContent = ehEntrada ? '✅' : '🚪';
      document.getElementById('suc-titulo').textContent = ehEntrada ? 'Check-in registrado!' : 'Check-out registrado!';
      document.getElementById('suc-texto').textContent = fmtHora(new Date().toISOString());
    }
    await carregarEstado();
    setTimeout(()=>{
      document.getElementById('panel-sucesso').classList.add('hidden');
      document.getElementById('panel-ponto').classList.remove('hidden');
    }, 2500);
  }catch(err){
    msg.textContent = err.message; msg.classList.remove('hidden');
  }finally{
    btn.disabled = false;
  }
}

async function carregarEstado(){
  const resp = await fetch(`/api/rh/publico/${TOKEN}`);
  if(!resp.ok){ document.getElementById('nao-encontrado').classList.remove('hidden'); return false; }
  const data = await resp.json();
  FUNCIONARIO = data;
  CHECKIN_ABERTO = data.checkinAberto || null;
  if(Number(data.limiteCheckoutHoras) > 0) LIMITE_CHECKOUT_HORAS = Number(data.limiteCheckoutHoras);
  return true;
}

async function boot(){
  if(!TOKEN){ document.getElementById('sem-token').classList.remove('hidden'); return; }
  const ok = await carregarEstado();
  if(!ok) return;
  if(FUNCIONARIO.status === 'inativo'){
    const el = document.getElementById('inativo');
    el.textContent = 'Seu cadastro está inativo. Fale com seu gerente.';
    el.classList.remove('hidden');
    return;
  }
  document.getElementById('root').classList.remove('hidden');
  renderPonto();
  // redesenha de minuto em minuto: quem deixa a tela aberta atravessa o
  // limite SEM recarregar nada, e o aviso tem que aparecer sozinho na hora
  // em que estoura - não só no próximo acesso
  setInterval(() => { if(!document.hidden && CHECKIN_ABERTO) renderPonto(); }, 60 * 1000);
  // voltar pro app depois de um tempo em segundo plano também recalcula
  document.addEventListener('visibilitychange', () => { if(!document.hidden && CHECKIN_ABERTO) renderPonto(); });
}

boot();
</script>
</body>
</html>
