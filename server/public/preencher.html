<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preencher formulário · NoPulso</title>
<script src="/tema.js"></script>
<style>
  :root{ --bg:#0b0e12; --panel:#12161b; --panel2:#0d1116; --line:#2a3340; --text:#e7ecf1; --muted:#8fa0b4; --accent:#b8ff3c; --accent2:#5cc8ff; --bad:#ff5c5c; --ok:#3ddc84; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding:16px;}
  .cx{max-width:560px;margin:0 auto;}
  .cab{text-align:center;margin-bottom:14px;}
  .cab .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  .cab h1{font-size:19px;margin:6px 0 2px;}
  .cab .sub{font-size:12.5px;color:var(--muted);}
  .painel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .empresa{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
  .empresa b{font-size:13.5px;}
  .empresa .obs{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;}
  input{width:100%;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}
  .linha{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--panel2);position:relative;}
  .linha .num{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .linha .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;}
  .btn{width:100%;padding:12px;border-radius:9px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-add{background:var(--panel2);color:var(--text);border:1px dashed var(--line);margin-bottom:12px;}
  .btn-ok{background:var(--accent);color:#0b0d10;}
  .btn-ok:disabled{opacity:.6;cursor:default;}
  .total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:10px 2px;border-top:1px solid var(--line);margin-top:6px;}
  .aviso{font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:12px;display:none;}
  .aviso.erro{background:rgba(255,92,92,.12);border:1px solid var(--bad);color:#ffc9c9;display:block;}
  .aviso.ok{background:rgba(61,220,132,.12);border:1px solid var(--ok);color:#c9ffe0;display:block;}
  .fim{text-align:center;padding:26px 12px;}
  .fim .ic{font-size:44px;}
  .fim h2{font-size:17px;margin:10px 0 6px;}
  .fim p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}
</style>
</head>
<body>
<div class="cx">
  <div class="cab">
    <div class="eyebrow">NoPulso</div>
    <h1 id="titulo">Carregando...</h1>
    <div class="sub" id="sub"></div>
  </div>

  <div id="aviso" class="aviso"></div>

  <div id="form-area" style="display:none;">
    <div class="painel">
      <div class="empresa" id="empresa"></div>
      <div id="cabecalho"></div>
    </div>

    <div class="painel" id="itens-painel">
      <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Itens</div>
      <div id="linhas"></div>
      <button type="button" class="btn btn-add" id="btn-add">+ Adicionar linha</button>
      <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    </div>

    <!-- só pro Ass. Boleto (soAnexo): não tem itens, o documento anexado É
         o conteúdo - a mecânica é a mesma dos outros tipos, só troca a
         tabela por um campo de arquivo -->
    <div class="painel" id="anexo-painel" style="display:none;">
      <label id="lbl-anexo" style="margin-top:0;">Boleto ou documento a assinar</label>
      <input type="file" id="f-anexo" accept="image/*,application/pdf" multiple>
    </div>

    <button type="button" class="btn btn-ok" id="btn-enviar">Enviar</button>
    <p style="font-size:11.5px;color:var(--muted);text-align:center;margin:10px 0 0;line-height:1.5;" id="txt-rodape">
      Depois de enviar, o formulário segue para assinatura e vira uma solicitação de pagamento.
    </p>
  </div>

  <div id="fim" class="fim" style="display:none;">
    <div class="ic">✅</div>
    <h2>Recebemos seus dados</h2>
    <p id="fim-txt"></p>
  </div>
</div>

<script>
// O token vem no ?token= (é assim que o botão "Enviar link" monta a URL,
// ver gerarLinkPreenchimento em formularios.html). A ORDEM aqui importa e
// já quebrou uma vez: lendo o caminho primeiro, /preencher.html devolvia a
// string "preencher.html" - que é truthy - e o || nunca chegava na query.
// Resultado: TODO link caía em "link inválido". O caminho fica como plano
// B, e só quando a URL é mesmo do formato /preencher/<token>.
function lerToken(){
  const daQuery = new URLSearchParams(location.search).get('token');
  if (daQuery) return daQuery.trim();
  const partes = location.pathname.split('/').filter(Boolean);
  const ultima = partes[partes.length - 1] || '';
  return /\.html?$/i.test(ultima) ? '' : ultima;
}
const TOKEN = lerToken();
let MODELO = null;
let LINHAS = [{}];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avisar(msg, tipo){ const el=document.getElementById('aviso'); el.className='aviso '+(tipo||'erro'); el.textContent=msg; }
function limparAviso(){ document.getElementById('aviso').className='aviso'; }

// mesmo parse do servidor (parseValor): aceita "1.234,56" e "1234.56"
function parseValor(v){
  const t = String(v==null?'':v).trim().replace(/[R$\s]/g,'');
  if(!t) return 0;
  const norm = t.includes(',') ? t.replace(/\./g,'').replace(',','.') : t;
  const n = Number(norm);
  return Number.isFinite(n) ? n : 0;
}
function fmtMoney(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// <input type="date"> só entende/devolve AAAA-MM-DD (ISO) - o resto do
// sistema (PDF, tabela, formulário em papel) sempre foi DD/MM/AAAA.
// Converte nas duas pontas pra ninguém perceber a troca por baixo do pano.
function isoParaBR(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function brParaIso(br){ const m = String(br||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; }
const valorCampo = (el) => el.type==='date' ? isoParaBR(el.value) : el.value;

function renderCabecalho(){
  document.getElementById('cabecalho').innerHTML = MODELO.cabecalho.map(c=>{
    const bruto = (MODELO.campos||{})[c.key]||'';
    const v = c.data ? brParaIso(bruto) : esc(bruto);
    return `<label for="cab-${esc(c.key)}">${esc(c.label)}</label>
     <input id="cab-${esc(c.key)}" data-key="${esc(c.key)}" class="campo-cab" type="${c.data?'date':'text'}" value="${v}" autocomplete="off">`;
  }).join('');
}

function renderLinhas(){
  const alvo = document.getElementById('linhas');
  alvo.innerHTML = LINHAS.map((l,i)=>`
    <div class="linha" data-i="${i}">
      <div class="num">Item ${i+1}</div>
      ${LINHAS.length>1?`<button type="button" class="rm" data-rm="${i}" title="Remover">✕</button>`:''}
      ${MODELO.colunas.map(c=>`
        <label>${esc(c.label)}</label>
        <input data-linha="${i}" data-col="${esc(c.key)}" type="${c.data?'date':'text'}" value="${c.data ? brParaIso(l[c.key]||'') : esc(l[c.key]||'')}"
          ${c.valor?'inputmode="decimal" placeholder="0,00"':'autocomplete="off"'}>
      `).join('')}
    </div>`).join('');
  atualizarTotal();
}

function atualizarTotal(){
  const colValor = MODELO.colunas.find(c=>c.valor);
  const t = colValor ? LINHAS.reduce((s,l)=>s+parseValor(l[colValor.key]),0) : 0;
  document.getElementById('total').textContent = fmtMoney(t);
}

document.addEventListener('input', (e)=>{
  const t = e.target;
  if(t.dataset.linha!=null){ LINHAS[+t.dataset.linha][t.dataset.col] = valorCampo(t); atualizarTotal(); }
});
document.addEventListener('click', (e)=>{
  const rm = e.target.closest('[data-rm]');
  if(rm){ LINHAS.splice(+rm.dataset.rm,1); renderLinhas(); }
});
document.getElementById('btn-add').addEventListener('click', ()=>{ LINHAS.push({}); renderLinhas(); });

async function carregar(){
  try{
    const r = await fetch(`/api/formularios-publico/preencher/${encodeURIComponent(TOKEN)}`);
    const d = await r.json();
    if(!r.ok){ document.getElementById('titulo').textContent='Link inválido'; avisar(d.error||'Esse link não vale mais.'); return; }
    MODELO = d;
    document.getElementById('titulo').textContent = d.rotulo;
    document.getElementById('sub').textContent = `${d.unidade} · Ticket #${d.numeroTicket}`;
    if(d.jaPreenchido){
      document.getElementById('titulo').textContent = d.rotulo;
      document.getElementById('fim').style.display='block';
      document.getElementById('fim-txt').textContent = 'Esse formulário já foi preenchido e está seguindo o fluxo normal.';
      return;
    }
    document.getElementById('empresa').innerHTML =
      `<b>${esc(d.razaoSocial)}</b> · CNPJ ${esc(d.cnpj)}<span class="obs">preenchido automaticamente, sem edição</span>`;
    renderCabecalho();
    // soAnexo (Ass. Boleto): não tem tabela de itens - o documento anexado
    // É o conteúdo, e o Responsável só recebe o link de assinatura DEPOIS
    // que este envio acontecer (ver formularios.js: montarAssinaturas só
    // roda dentro de salvarPreenchimento)
    document.getElementById('itens-painel').style.display = d.soAnexo ? 'none' : 'block';
    document.getElementById('anexo-painel').style.display = d.soAnexo ? 'block' : 'none';
    if(d.soAnexo){
      document.getElementById('lbl-anexo').textContent = d.anexoObrigatorio
        ? 'Boleto ou documento a assinar (PDF ou imagem) — obrigatório'
        : 'Documento (PDF ou imagem, opcional)';
      document.getElementById('txt-rodape').textContent = 'Depois de enviar, o Responsável recebe o link pra assinar o documento.';
    } else {
      renderLinhas();
    }
    document.getElementById('form-area').style.display='block';
  }catch(e){
    document.getElementById('titulo').textContent='Erro';
    avisar('Não consegui carregar o formulário. Verifique sua conexão e tente de novo.');
  }
}

document.getElementById('btn-enviar').addEventListener('click', async ()=>{
  limparAviso();
  const campos = {};
  document.querySelectorAll('.campo-cab').forEach(i=>{ campos[i.dataset.key]=valorCampo(i); });
  const arquivos = MODELO.soAnexo ? document.getElementById('f-anexo').files : null;
  if(MODELO.soAnexo && MODELO.anexoObrigatorio && (!arquivos || !arquivos.length)){
    avisar('Anexe o boleto (PDF ou imagem) - é ele que vai ser assinado.');
    return;
  }
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    let r;
    if(MODELO.soAnexo){
      // multipart: payload em JSON + anexo(s), mesma convenção da tela da
      // unidade (formularios.html) - sem Content-Type manual pro navegador
      // colocar o boundary
      const fd = new FormData();
      fd.append('payload', JSON.stringify({ campos, linhas: [] }));
      for(const arq of arquivos) fd.append('anexos', arq);
      r = await fetch(`/api/formularios-publico/preencher/${encodeURIComponent(TOKEN)}`, { method:'POST', body: fd });
    } else {
      r = await fetch(`/api/formularios-publico/preencher/${encodeURIComponent(TOKEN)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ campos, linhas: LINHAS }),
      });
    }
    const d = await r.json();
    if(!r.ok){ avisar(d.error||'Não consegui enviar.'); return; }
    document.getElementById('form-area').style.display='none';
    document.getElementById('fim').style.display='block';
    document.getElementById('fim-txt').textContent = MODELO.soAnexo
      ? `Ticket #${MODELO.numeroTicket} · recebemos o documento. O Responsável já pode assinar.`
      : `Ticket #${MODELO.numeroTicket} · seus dados foram enviados e o formulário segue para assinatura.`;
  }catch(e){
    avisar('Não consegui enviar. Verifique sua conexão e tente de novo.');
  }finally{
    btn.disabled = false; btn.textContent = 'Enviar';
  }
});

carregar();
</script>
</body>
</html>
