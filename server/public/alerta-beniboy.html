<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Alerta do Beniboy · Zenith Ops</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7a1414">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:linear-gradient(160deg,#3a0a0a,#7a1414);
    color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:24px;animation:flash 1s ease-in-out infinite;
  }
  .icone{font-size:72px;animation:bounce .6s ease-in-out infinite;}
  h1{font-size:22px;font-weight:800;margin:0;}
  .corpo{font-size:15px;color:#ffd9d9;max-width:340px;}
  .botoes{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  button{border:none;border-radius:10px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;}
  .atender{background:#fff;color:#7a1414;}
  .silenciar{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}
  .aviso-mudo{font-size:12px;color:#ffb3b3;max-width:300px;}
  .hidden{display:none!important;}
  @keyframes flash{0%,100%{background:linear-gradient(160deg,#3a0a0a,#7a1414);}50%{background:linear-gradient(160deg,#7a1414,#b81f1f);}}
  @keyframes bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  @media (prefers-reduced-motion:reduce){ body,.icone{animation:none;} }
</style>
<script src="/tema.js"></script>
</head>
<body>
  <div class="icone" id="icone">🚨</div>
  <h1 id="titulo">Beniboy precisa de você</h1>
  <div class="corpo" id="corpo">O assistente não conseguiu resolver sozinho.</div>
  <div class="aviso-mudo hidden" id="aviso-mudo">Toque em qualquer lugar pra ativar o som do alerta.</div>
  <div class="botoes">
    <button type="button" class="atender" id="btn-atender">🎧 Atender agora</button>
    <button type="button" class="silenciar" id="btn-silenciar">🔕 Silenciar</button>
  </div>
<script src="/alarme-sync.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const chat = params.get('chat') || '';
  const nome = params.get('nome') || '';
  const motivo = params.get('motivo') || '';
  // tipo=seguranca: mesma tela/sirene de alarme, mas pra uma tentativa de
  // invasao no chat de suporte (ver push.notifySegurancaChat), nao pro
  // Beniboy pedindo ajuda - texto e destino do "Atender agora" mudam
  const ehSeguranca = params.get('tipo') === 'seguranca';
  if (ehSeguranca) {
    document.getElementById('icone').textContent = '🛡️';
    document.getElementById('titulo').textContent = 'Alerta de segurança no chat';
  }
  document.getElementById('corpo').textContent = (nome || motivo)
    ? `${nome || 'Visitante'}${motivo ? ' · ' + motivo : ''}`
    : (ehSeguranca ? 'Atividade suspeita detectada no chat de suporte.' : 'O assistente não conseguiu resolver sozinho.');

  let ativo = true;
  let audioCtx = null;
  let sirenTimer = null;
  let vibraTimer = null;

  function tocarTom(delay, freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + delay + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + 0.42);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + 0.45);
  }
  function tocarSirene() {
    if (!audioCtx) return;
    try { tocarTom(0, 1046); tocarTom(0.45, 784); } catch (e) { /* segue so com vibracao/tela */ }
  }
  function iniciarSom() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('aviso-mudo').classList.add('hidden');
      tocarSirene();
      if (!sirenTimer) sirenTimer = setInterval(tocarSirene, 900);
    } catch (e) {
      document.getElementById('aviso-mudo').classList.remove('hidden');
    }
  }
  function pararAlarme() {
    ativo = false;
    if (sirenTimer) { clearInterval(sirenTimer); sirenTimer = null; }
    if (vibraTimer) { clearInterval(vibraTimer); vibraTimer = null; }
    if (navigator.vibrate) navigator.vibrate(0);
  }

  iniciarSom(); // funciona direto se a pagina abriu por um toque (clique na notificacao)
  document.body.addEventListener('click', () => { if (ativo) iniciarSom(); }, { once: false });
  if (navigator.vibrate) {
    navigator.vibrate([400, 200, 400, 200, 400]);
    vibraTimer = setInterval(() => { if (ativo) navigator.vibrate([400, 200, 400, 200, 400]); }, 1600);
  }

  // silenciar/atender aqui também cala as outras abas do mesmo acesso, e
  // vice-versa (ver alarme-sync.js). Esta página costuma ser aberta pelo
  // toque na notificação, com o Zenith já aberto em outra aba atrás dela.
  const propagarSilencio = () => { if (window.ZenithAlarmeSync) window.ZenithAlarmeSync.silenciar(); };
  if (window.ZenithAlarmeSync) {
    window.ZenithAlarmeSync.aoSilenciar(pararAlarme);
    // descobre de quem é esta sessão pra não calar alarme de outra conta
    const tk = localStorage.getItem('authToken');
    if (tk) {
      fetch('/api/me', { headers: { Authorization: 'Bearer ' + tk } })
        .then((r) => (r.ok ? r.json() : null))
        .then((me) => { if (me && me.id) window.ZenithAlarmeSync.identificar(me.id); })
        .catch(() => { /* sem identidade: reage a qualquer aviso do mesmo navegador */ });
    }
  }
  document.getElementById('btn-silenciar').addEventListener('click', () => {
    pararAlarme();
    propagarSilencio();
  });
  document.getElementById('btn-atender').addEventListener('click', () => {
    pararAlarme();
    propagarSilencio();
    // ambos os casos (Beniboy pedindo ajuda ou alerta de seguranca) sao uma
    // conversa especifica do chat de suporte - manda pro Beniboy ja abrindo
    // essa conversa (ver ?chat= em beniboy.html), nunca pro /tecnico.html
    // (isso era um bug: mandava pra tela errada e perdia qual chat era)
    location.href = chat ? ('/beniboy.html?chat=' + encodeURIComponent(chat)) : '/beniboy.html';
  });
</script>
</body>
</html>
