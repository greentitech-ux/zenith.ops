<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Painel de Saídas · NoPulso</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#181d24; --line:#232a33;
    --text:#e7ecf1; --muted:#7d8896;
    --ok:#3ddc97; --ok-dim:#1c3a2e;
    --warn:#f2b33d; --warn-dim:#3a2e14;
    --bad:#ff5c5c; --bad-dim:#3a1616;
    --accent:#b8ff3c; --accent2:#5cc8ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;min-width:0;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:28px 32px 60px;overflow-x:clip;overflow-y:clip;}
  header{position:sticky;top:0;z-index:40;background:var(--bg);margin:-28px -32px 16px;padding:12px 32px 12px;border-bottom:1px solid var(--line);}
  h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media(max-width:640px){ body{padding:16px 14px 40px;} header{margin-left:-14px;margin-right:-14px;margin-top:-16px;padding-left:14px;padding-right:14px;padding-top:12px;padding-bottom:12px;} h1{font-size:17px;} .eyebrow{font-size:8px;} }
  h2{font-size:13.5px;font-weight:700;margin:0 0 4px;}
  .header-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .header-nav{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;}
  a.back,button.back{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-decoration:none;padding:5px 9px;border-radius:16px;border:1px solid var(--line);background:none;cursor:pointer;white-space:nowrap;}
  a.back:hover,button.back:hover{color:var(--text);border-color:var(--accent);}
  .nav-divider{width:1px;align-self:stretch;background:var(--line);margin:2px 2px;}
  .btn-notif{font-size:14px;line-height:1;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .btn-notif:hover{border-color:var(--accent);color:var(--text);}
  .btn-sair{color:var(--bad);}
  .btn-sair:hover{border-color:var(--bad);color:var(--bad);}
  .hidden{display:none!important;}
  .hamburger-btn{position:sticky;top:14px;z-index:997;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .hamburger-btn:hover{border-color:var(--accent);}
  .nav-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:998;}
  .nav-drawer-overlay.hidden{display:none!important;}
  .nav-drawer{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:82vw;background:var(--panel);border-right:1px solid var(--line);z-index:999;padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .nav-drawer.hidden{display:none!important;}
  .nav-drawer a.back,.nav-drawer button.back{display:flex;align-items:center;gap:8px;width:100%;border-radius:8px;text-align:left;padding:9px 10px;font-size:12.5px;box-sizing:border-box;}
  .empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px;font-family:var(--mono);}
  select,input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;font-family:var(--sans);}
  select:focus,input:focus{outline:none;border-color:var(--accent);}
  .filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;}
  .filtros>div{flex:1 1 160px;min-width:140px;max-width:220px;}
  .presets{display:flex;gap:4px;flex-wrap:wrap;}
  .preset-btn{font-family:var(--mono);font-size:10.5px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;}
  .preset-btn:hover{color:var(--text);border-color:var(--accent);}
  .preset-btn.active{color:#0b0d10;background:var(--accent);border-color:var(--accent);font-weight:600;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;font-family:var(--sans);}
  .export-btn{font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;}
  .export-btn:hover{color:var(--text);border-color:var(--accent);}
  .tipo-badge{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  /* auto-fit em vez de contagem fixa: a mesma grade serve pros 4 cards da
     loja e pros 6 de quem ve Entrada/Saldo, sem sobrar coluna vazia */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .kpi .valor{font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .kpi .valor.bad{color:var(--bad);}
  .kpi .valor.ok{color:var(--ok);}
  /* o Saldo e' a leitura principal da tela ("quanto de dinheiro tem em loja"),
     entao ganha borda; a COR continua semantica - vermelho so quando saiu mais
     do que entrou. Verde aqui daria a entender que "muito dinheiro em loja" e'
     bom, e nao e' isso que o numero diz. */
  .kpi.destaque{border-color:var(--accent);}
  .kpi .formula{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;}
  .kpi .rotulo{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .kanban-3col{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:760px){ .kanban-3col{grid-template-columns:1fr 1fr 1fr;} }
  /* sem a coluna Verificadas (loja), as duas que sobram ocupam a largura */
  @media(min-width:760px){ .kanban-3col.sem-verificadas{grid-template-columns:1fr 1fr;} }
  .kanban-col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:70vh;min-height:220px;}
  .kanban-col-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line);flex:none;font-weight:700;font-size:13px;}
  .kanban-col-header .n{font-family:var(--mono);color:var(--muted);font-weight:400;font-size:11.5px;}
  .kanban-cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .kanban-empty{padding:20px 10px;text-align:center;color:var(--muted);font-size:12px;}
  .saida-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;min-width:0;}
  .saida-topo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .saida-desc{font-size:12.5px;font-weight:600;}
  .saida-valor{font-size:15px;font-weight:700;font-family:var(--mono);margin-top:2px;}
  .saida-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}
  .saida-acoes{margin-top:8px;}
  .btn-verificar{font-family:var(--sans);font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;border:none;background:var(--accent);color:#0b0d10;cursor:pointer;}
  .btn-verificar:hover{opacity:.9;}
  .multiselect{position:relative;}
  .multiselect-btn{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;font-family:var(--sans);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .multiselect-btn:hover{border-color:var(--accent);}
  .multiselect-btn:focus{outline:none;border-color:var(--accent);}
  .multiselect-panel{display:none;position:fixed;z-index:1000;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-width:200px;max-height:260px;overflow-y:auto;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .multiselect-panel.open{display:block;}
  .multiselect-panel label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px;font-size:12px;border-radius:5px;cursor:pointer;white-space:nowrap;}
  .multiselect-panel label:hover{background:var(--panel);}
  .multiselect-panel label.all-option{font-weight:600;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:2px;padding-bottom:8px;}
  .multiselect-panel input[type=checkbox]{accent-color:var(--accent);}
</style>
<script src="/tema.js"></script>
</head>
<body>

<header>
  <div class="header-top">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
      <button type="button" class="hamburger-btn" id="btn-menu" onclick="abrirMenu()" aria-label="Abrir menu" title="Menu">☰</button>
      <div style="min-width:0;">
        <div class="eyebrow">NoPulso · Fechamento</div>
        <h1>Painel de Saídas</h1>
      </div>
    </div>
    <div class="header-nav">
      <button class="btn-notif" onclick="carregar()" title="Atualizar">🔄</button>
      <div class="nav-divider"></div>
      <button class="btn-notif btn-sair" onclick="logout()" title="Sair">🚪</button>
    </div>
  </div>
</header>

<div class="nav-drawer-overlay hidden" id="nav-drawer-overlay" onclick="fecharMenu()"></div>
<nav class="nav-drawer hidden" id="nav-drawer"></nav>

<div id="sem-acesso" class="empty hidden">Você não tem acesso a essa tela.</div>

<div id="root" class="hidden">

  <div class="panel">
    <div class="filtros">
      <div>
        <label>Grupo</label>
        <select id="f-grupo" onchange="aoMudarFiltro()">
          <option value="">Todos</option>
          <option value="ARCFOOD">ARCFOOD</option>
          <option value="BRAVO">Grupo Bravo (GBE)</option>
        </select>
      </div>
      <div>
        <label>Loja</label>
        <div class="multiselect" id="ms-unidade">
          <button type="button" class="multiselect-btn" id="ms-unidade-btn">Todas as unidades</button>
          <div class="multiselect-panel" id="ms-unidade-panel"></div>
        </div>
      </div>
      <div>
        <label>De</label>
        <input type="date" id="f-data-de" onchange="aoMudarFiltroData()">
      </div>
      <div>
        <label>Até</label>
        <input type="date" id="f-data-ate" onchange="aoMudarFiltroData()">
      </div>
    </div>
    <div class="presets" id="presets" style="margin-top:10px;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;">
      <button type="button" class="link-btn" onclick="limparFiltros()">Limpar filtros</button>
      <span style="display:flex;gap:6px;">
        <button type="button" class="export-btn" onclick="baixarRelatorio('csv')">📄 Relatório CSV</button>
        <button type="button" class="export-btn" onclick="baixarRelatorio('pdf')">📄 Relatório PDF</button>
      </span>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi hidden" id="card-entrada"><div class="valor ok" id="kpi-entrada">—</div><div class="rotulo">Entrada em dinheiro</div></div>
    <div class="kpi"><div class="valor bad" id="kpi-saidas">—</div><div class="rotulo">Saídas avulsas</div></div>
    <div class="kpi"><div class="valor bad" id="kpi-sangrias">—</div><div class="rotulo">Sangria/Depósito</div></div>
    <div class="kpi destaque hidden" id="card-saldo">
      <div class="valor" id="kpi-saldo">—</div>
      <div class="rotulo">Dinheiro em loja</div>
      <div class="formula">entrada − saídas − sangria</div>
    </div>
    <div class="kpi"><div class="valor" id="kpi-pendentes">—</div><div class="rotulo">Pendentes de verificar</div></div>
    <div class="kpi hidden" id="card-verificadas"><div class="valor ok" id="kpi-verificadas">—</div><div class="rotulo">Verificadas</div></div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
    <h2 style="margin:0;">🧾 Conferência</h2>
    <button type="button" class="export-btn hidden" id="btn-mover-sangrias" onclick="moverTodasSangrias()"></button>
  </div>
  <div class="kanban-3col">
    <div class="kanban-col">
      <div class="kanban-col-header"><span>💰 Sangria/Depósito</span><span class="n" id="n-pendentes-sangria">0</span></div>
      <div class="kanban-cards" id="col-pendentes-sangria"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-header"><span>💸 Saída avulsa</span><span class="n" id="n-pendentes-saida">0</span></div>
      <div class="kanban-cards" id="col-pendentes-saida"></div>
    </div>
    <div class="kanban-col hidden" id="col-verificadas-wrap">
      <div class="kanban-col-header"><span>✅ Verificadas</span><span class="n" id="n-verificadas">0</span></div>
      <div class="kanban-cards" id="col-verificadas"></div>
    </div>
  </div>

</div>

<script>
let AUTH_TOKEN = localStorage.getItem('authToken') || null;
if(!AUTH_TOKEN){ location.href = '/'; }

const _rawFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/') && AUTH_TOKEN) {
    opts = { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + AUTH_TOKEN } };
  }
  return _rawFetch(url, opts).then((res) => { if (res.status === 401) logout(); return res; });
};
function logout(){ localStorage.removeItem('authToken'); location.href = '/'; }

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
const FUSO_BR = 'America/Sao_Paulo';
function fmtData(iso){ if(!iso) return '—'; const [y,m,d] = String(iso).split('-'); return d ? `${d}/${m}/${y}` : iso; }
function fmtDataHora(iso){ if(!iso) return '—'; return new Date(iso).toLocaleString('pt-BR',{timeZone:FUSO_BR}); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoLocal(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
// Date "falso" cujos getters locais ja refletem o horario de Sao Paulo,
// independente do fuso do navegador/servidor (mesmo helper de fechamentos.html)
function agoraBrasilia(){
  const partes = new Intl.DateTimeFormat('en-US', {
    timeZone:FUSO_BR, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false,
  }).formatToParts(new Date());
  const o = {}; partes.forEach(p=>{ if(p.type!=='literal') o[p.type]=p.value; });
  const hora = o.hour==='24' ? '00' : o.hour;
  return new Date(`${o.year}-${o.month}-${o.day}T${hora}:${o.minute}:${o.second}`);
}

function calcularPreset(tipo, refIso){
  const ref = new Date(refIso+'T00:00:00');
  if(tipo==='ontem'){
    const ontem = new Date(ref); ontem.setDate(ontem.getDate()-1);
    return {inicio:isoLocal(ontem), fim:isoLocal(ontem)};
  }
  if(tipo==='7dias'){
    const inicio = new Date(ref); inicio.setDate(inicio.getDate()-6);
    return {inicio:isoLocal(inicio), fim:isoLocal(ref)};
  }
  // mes: mes corrente inteiro (dia 1 ao ultimo dia), mesmo criterio de
  // fechamentos.html - o filtro so restringe o que ja foi lancado, dia
  // futuro dentro do mesmo mes simplesmente nao traz nada
  const inicio = new Date(ref.getFullYear(), ref.getMonth(), 1);
  const fim = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
  return {inicio:isoLocal(inicio), fim:isoLocal(fim)};
}

let ME = null;
let IS_MASTER = false;
let IS_ADMIN = false;
// Entrada/Saldo e a coluna Verificadas sao visao de conferencia (Master ou
// Admin) - a loja ve o que saiu, nao o caixa consolidado
let PODE_CONFERIR = false;
let ENTRADAS = [];
let ITENS = []; // lista bruta do periodo (inicio/fim), sem filtro de loja/grupo - esses dois filtram em memoria (ver renderTudo)
let presetAtivo = 'mes';

function setupPresets(){
  const presets = [ {lbl:'Ontem', tipo:'ontem'}, {lbl:'7 dias', tipo:'7dias'}, {lbl:'Mês', tipo:'mes'} ];
  const cont = document.getElementById('presets');
  cont.innerHTML = presets.map(p=>`<button type="button" class="preset-btn" data-tipo="${p.tipo}">${p.lbl}</button>`).join('');
  cont.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>aplicarPreset(btn.dataset.tipo));
  });
}
function aplicarPreset(tipo){
  presetAtivo = tipo;
  document.querySelectorAll('#presets .preset-btn').forEach(b=>b.classList.toggle('active', b.dataset.tipo===tipo));
  const range = calcularPreset(tipo, isoLocal(agoraBrasilia()));
  document.getElementById('f-data-de').value = range.inicio;
  document.getElementById('f-data-ate').value = range.fim;
  carregar();
}
function aoMudarFiltroData(){
  presetAtivo = null;
  document.querySelectorAll('#presets .preset-btn').forEach(b=>b.classList.remove('active'));
  carregar();
}
// mudar o Grupo tem que atualizar o painel de Loja pro mesmo grupo (só as
// unidades daquela franquia) - senão o filtro de loja continua oferecendo
// unidade de fora do grupo escolhido
function aoMudarFiltro(){ renderUnidadePanel(); renderTudo(); }
function limparFiltros(){
  document.getElementById('f-grupo').value = '';
  SEL_UNIDADE.clear();
  aplicarPreset('mes');
}

let SEL_UNIDADE = new Set();
let renderUnidadePanel = () => {};

// pares [codigo,nome] a partir das unidades que de fato aparecem no periodo
// carregado, filtradas pelo Grupo escolhido - nao ha lista fixa aqui (ver
// fechamentos.html pra ARCFOOD/BRAVO fixos): uma loja sem nenhuma saida no
// periodo nao teria o que filtrar mesmo
function paresUnidadeDoGrupo(){
  const grupo = document.getElementById('f-grupo').value;
  const porCodigo = new Map();
  ITENS.filter(it=>!grupo || it.grupo===grupo)
    .forEach(it=>{ if(it.unidade && !porCodigo.has(it.unidade)) porCodigo.set(it.unidade, it.unidadeNome||it.unidade); });
  return [...porCodigo.entries()].sort((a,b)=>a[1].localeCompare(b[1],'pt-BR'));
}

// multiselect de Loja com checkbox (1, 2, 3 ou todas as unidades de uma vez)
// - mesmo componente ja usado em fechamentos.html (.multiselect/.multiselect-panel)
function setupMultiselectUnidade(){
  const btn = document.getElementById('ms-unidade-btn');
  const panel = document.getElementById('ms-unidade-panel');
  document.body.appendChild(panel);
  function posicionar(){
    const r = btn.getBoundingClientRect();
    panel.style.top = (r.bottom+4)+'px';
    panel.style.left = r.left+'px';
  }
  renderUnidadePanel = function(){
    const pares = paresUnidadeDoGrupo();
    const codigos = pares.map(([cod])=>cod);
    // a loja marcada pode não pertencer mais ao grupo escolhido (o próprio
    // Grupo acabou de mudar) - nesse caso sai da seleção
    for(const v of [...SEL_UNIDADE]) if(!codigos.includes(v)) SEL_UNIDADE.delete(v);
    panel.innerHTML = `
      <label class="all-option"><span>Todas as unidades</span><input type="checkbox" data-all ${SEL_UNIDADE.size===0?'checked':''}></label>
      ${pares.map(([cod,nome])=>`<label><span>${escapeHtml(nome)}</span><input type="checkbox" value="${escapeHtml(cod)}" ${SEL_UNIDADE.has(cod)?'checked':''}></label>`).join('')}
    `;
    panel.querySelector('[data-all]').addEventListener('change', ()=>{ SEL_UNIDADE.clear(); renderUnidadePanel(); renderTudo(); });
    panel.querySelectorAll('input[type=checkbox]:not([data-all])').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked) SEL_UNIDADE.add(cb.value); else SEL_UNIDADE.delete(cb.value);
        renderUnidadePanel(); renderTudo();
      });
    });
    const nomePorCodigo = new Map(pares);
    btn.textContent = SEL_UNIDADE.size===0 ? 'Todas as unidades'
      : SEL_UNIDADE.size===1 ? (nomePorCodigo.get([...SEL_UNIDADE][0]) || [...SEL_UNIDADE][0])
      : `${SEL_UNIDADE.size} unidades selecionadas`;
  };
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const abrindo = !panel.classList.contains('open');
    panel.classList.remove('open');
    if(abrindo){ posicionar(); panel.classList.add('open'); }
  });
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && e.target!==btn) panel.classList.remove('open');
  });
  renderUnidadePanel();
}

async function carregar(){
  const inicio = document.getElementById('f-data-de').value;
  const fim = document.getElementById('f-data-ate').value;
  const params = new URLSearchParams();
  if(inicio) params.set('inicio', inicio);
  if(fim) params.set('fim', fim);
  // a rota passou a devolver {itens, entradas} - "entradas" so vem preenchido
  // pra Master/Admin (o gate e' no servidor, ver /api/saidas-painel)
  const resp = await fetch('/api/saidas-painel?'+params.toString()).then(r=>r.json());
  ITENS = resp.itens || [];
  ENTRADAS = resp.entradas || [];
  renderUnidadePanel();
  renderTudo();
}

// o periodo ja veio filtrado do servidor; grupo e unidade sao filtro de tela
function passaNoFiltro(it, grupo){
  return (!grupo || it.grupo===grupo) && (SEL_UNIDADE.size===0 || SEL_UNIDADE.has(it.unidade));
}
function itensFiltrados(){
  const grupo = document.getElementById('f-grupo').value;
  return ITENS.filter(it => passaNoFiltro(it, grupo));
}
function entradasFiltradas(){
  const grupo = document.getElementById('f-grupo').value;
  return ENTRADAS.filter(e => passaNoFiltro(e, grupo));
}

function cardHtml(it){
  const podeVerificar = PODE_CONFERIR;
  const origemLabel = it.origem==='sangria' ? '💰 Sangria/Depósito' : '💸 Saída avulsa';
  let acao = '';
  if(it.verificada){
    acao = podeVerificar ? `<button type="button" class="link-btn" onclick="toggleVerificar('${it.chave}',false)">↩️ Desfazer</button>` : '';
  } else if(podeVerificar){
    acao = `<button type="button" class="btn-verificar" onclick="toggleVerificar('${it.chave}',true)">✅ Verificar</button>`;
  }
  // saida avulsa -> Sangria/Deposito (e de volta). So o Master, e so pra item
  // que vive dentro do fechamento - Sangria lancada no app ja esta no lugar.
  let mover = '';
  if(IS_MASTER && !it.chave.startsWith('sangria::')){
    mover = it.reclassificada
      ? `<button type="button" class="link-btn" onclick="moverOrigem('${it.chave}',null)">↩️ Voltar pra Saída avulsa</button>`
      : `<button type="button" class="link-btn" onclick="moverOrigem('${it.chave}','sangria')">💰 Mover pra Sangria</button>`;
  }
  return `<div class="saida-card">
    <div class="saida-topo">
      <span class="tipo-badge">${origemLabel}</span>
      ${it.reclassificada ? '<span class="tipo-badge" style="background:#181d24;color:var(--muted);" title="Era saída avulsa, movida à mão pra Sangria">movida</span>' : ''}
      <span class="tipo-badge" style="background:#181d24;color:var(--muted);">${escapeHtml(it.unidadeNome||it.unidade||'—')}</span>
    </div>
    <div class="saida-desc">${escapeHtml(it.descricao)}</div>
    <div class="saida-valor">${fmtMoney(it.valor)}</div>
    <div class="saida-sub">${fmtData(it.data)} · ${escapeHtml(it.criadoPorEmail||'—')}</div>
    ${it.verificada ? `<div class="saida-sub" style="color:var(--ok);">verificada por ${escapeHtml(it.verificadaPorEmail||'—')} em ${fmtDataHora(it.verificadaEm)}</div>` : ''}
    ${acao || mover ? `<div class="saida-acoes">${acao}${mover}</div>` : ''}
  </div>`;
}

function renderTudo(){
  const filtrados = itensFiltrados();
  const pendentes = filtrados.filter(it=>!it.verificada).sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
  const pendentesSangria = pendentes.filter(it=>it.origem==='sangria');
  const pendentesSaida = pendentes.filter(it=>it.origem!=='sangria');
  const verificadas = filtrados.filter(it=>it.verificada).sort((a,b)=>String(b.verificadaEm||'').localeCompare(String(a.verificadaEm||'')));

  const totalSaidas = filtrados.filter(it=>it.origem==='saida').reduce((s,it)=>s+(it.valor||0),0);
  const totalSangrias = filtrados.filter(it=>it.origem==='sangria').reduce((s,it)=>s+(it.valor||0),0);
  document.getElementById('kpi-saidas').textContent = fmtMoney(totalSaidas);
  document.getElementById('kpi-sangrias').textContent = fmtMoney(totalSangrias);
  document.getElementById('kpi-pendentes').textContent = pendentes.length;
  document.getElementById('kpi-verificadas').textContent = verificadas.length;

  // a conta que o Master pediu: o que entrou em dinheiro no periodo menos o
  // que saiu (saida avulsa + sangria/deposito) = quanto de dinheiro sobrou
  // em loja. Vermelho so quando saiu mais do que entrou.
  if(PODE_CONFERIR){
    const totalEntrada = entradasFiltradas().reduce((s,e)=>s+(e.valor||0),0);
    const saldo = totalEntrada - totalSaidas - totalSangrias;
    document.getElementById('kpi-entrada').textContent = fmtMoney(totalEntrada);
    const elSaldo = document.getElementById('kpi-saldo');
    elSaldo.textContent = fmtMoney(saldo);
    elSaldo.classList.toggle('bad', saldo < 0);
  }

  // o botao de mover em lote so existe quando ha o que mover (e so pro Master)
  const btnMover = document.getElementById('btn-mover-sangrias');
  const candidatas = IS_MASTER ? filtrados.filter(pareceSangria).length : 0;
  btnMover.classList.toggle('hidden', !candidatas);
  if(candidatas) btnMover.textContent = `💰 Mover ${candidatas} com "Sangria" na descrição`;

  document.getElementById('n-pendentes-sangria').textContent = pendentesSangria.length;
  document.getElementById('n-pendentes-saida').textContent = pendentesSaida.length;
  document.getElementById('n-verificadas').textContent = verificadas.length;
  document.getElementById('col-pendentes-sangria').innerHTML = pendentesSangria.length
    ? pendentesSangria.map(cardHtml).join('')
    : '<div class="kanban-empty">Nada aguardando conferência. 🎉</div>';
  document.getElementById('col-pendentes-saida').innerHTML = pendentesSaida.length
    ? pendentesSaida.map(cardHtml).join('')
    : '<div class="kanban-empty">Nada aguardando conferência. 🎉</div>';
  document.getElementById('col-verificadas').innerHTML = verificadas.length
    ? verificadas.map(cardHtml).join('')
    : '<div class="kanban-empty">Nenhuma verificada ainda nesse período.</div>';
}

async function moverOrigem(chave, origem){
  try{
    const res = await fetch('/api/saidas-painel/reclassificar', {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chave, origem }),
    });
    if(!res.ok) throw new Error((await res.json()).error||'Erro ao mover.');
    await carregar();
  }catch(e){ alert(e.message); }
}

// atalho pro caso que originou isso: a planilha antiga lancava sangria como
// saida avulsa com "Sangria" na descricao, e sao muitas pra mover uma a uma.
// Move so o que esta no filtro atual - o mesmo que o Master ve na tela.
async function moverTodasSangrias(){
  const quantas = itensFiltrados().filter(pareceSangria).length;
  if(!quantas) return;
  if(!confirm(`Mover ${quantas} saída(s) com "Sangria" na descrição para Sangria/Depósito?\n\nSó vale pro filtro que está na tela. Dá pra desfazer uma a uma depois.`)) return;
  const btn = document.getElementById('btn-mover-sangrias');
  btn.disabled = true;
  try{
    const res = await fetch('/api/saidas-painel/reclassificar-sangrias', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        grupo: document.getElementById('f-grupo').value || '',
        unidades: SEL_UNIDADE.size ? [...SEL_UNIDADE].join(',') : '',
        inicio: document.getElementById('f-data-de').value,
        fim: document.getElementById('f-data-ate').value,
      }),
    });
    if(!res.ok) throw new Error((await res.json()).error||'Erro ao mover.');
    await carregar();
  }catch(e){ alert(e.message); }
  finally{ btn.disabled = false; }
}

// mesma regra do servidor (pareceSangria em saidasPainel.js): sem acento e
// sem caixa, so pra decidir se o botao de mover em lote aparece
function pareceSangria(it){
  return it.origem === 'saida'
    && /sangria/i.test(String(it.descricao||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''));
}

async function toggleVerificar(chave, verificada){
  try{
    const res = await fetch('/api/saidas-painel/verificar', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave, verificada}) });
    if(!res.ok){ const e = await res.json().catch(()=>({})); alert(e.error || 'Falha ao atualizar.'); return; }
    const atualizado = await res.json();
    const alvo = ITENS.find(it=>it.chave===chave);
    if(alvo){ alvo.verificada = atualizado.verificada; alvo.verificadaPorEmail = atualizado.verificadaPorEmail; alvo.verificadaEm = atualizado.verificadaEm; }
    renderTudo();
  }catch(e){ alert('Falha ao atualizar.'); }
}

function baixarRelatorio(formato){
  const grupo = document.getElementById('f-grupo').value;
  const inicio = document.getElementById('f-data-de').value;
  const fim = document.getElementById('f-data-ate').value;
  const params = new URLSearchParams({ token: AUTH_TOKEN });
  if(grupo) params.set('grupo', grupo);
  if(SEL_UNIDADE.size) params.set('unidades', [...SEL_UNIDADE].join(','));
  if(inicio) params.set('inicio', inicio);
  if(fim) params.set('fim', fim);
  window.location.href = `/api/saidas-painel/relatorio.${formato}?${params.toString()}`;
}

async function boot(){
  const res = await fetch('/api/me');
  if(!res.ok){ logout(); return; }
  ME = await res.json();
  IS_MASTER = ME.role==='master';
  IS_ADMIN = !!ME.isAdmin;
  const secoes = IS_MASTER ? [] : (ME.permissions?.sections||[]);
  const temAcesso = IS_MASTER || secoes.includes('lancamento') || secoes.includes('sangria');
  if(!temAcesso){
    document.getElementById('sem-acesso').classList.remove('hidden');
    return;
  }
  document.getElementById('root').classList.remove('hidden');
  PODE_CONFERIR = IS_MASTER || IS_ADMIN;
  if(PODE_CONFERIR){
    document.getElementById('card-entrada').classList.remove('hidden');
    document.getElementById('card-saldo').classList.remove('hidden');
    document.getElementById('card-verificadas').classList.remove('hidden');
    document.getElementById('col-verificadas-wrap').classList.remove('hidden');
  } else {
    document.querySelector('.kanban-3col').classList.add('sem-verificadas');
  }
  setupPresets();
  setupMultiselectUnidade();
  aplicarPreset('mes');
}
boot();
