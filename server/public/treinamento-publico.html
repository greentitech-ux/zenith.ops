<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Treinamento · NoPulso</title><style>
:root{--bg:#0b0d10;--p:#12161b;--l:#29313b;--t:#e7ecf1;--m:#9aa5b3;--a:#b8ff3c;--ok:#3ddc97}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Arial,sans-serif;padding:18px;max-width:620px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}.ey{color:var(--a);font:11px monospace;letter-spacing:.12em}h1{font-size:21px;margin:5px 0}.sub{color:var(--m);line-height:1.5}.mat{display:block;color:var(--t);text-decoration:none;border:1px solid var(--l);padding:12px;border-radius:9px;margin:8px 0}.mat:hover{border-color:var(--a)}input,button{font:inherit}input{width:100%;background:#181d24;border:1px solid var(--l);color:var(--t);padding:11px;border-radius:9px}button{background:var(--a);color:#111;border:0;border-radius:9px;padding:12px;font-weight:bold;width:100%}canvas{background:#fff;border-radius:9px;width:100%;height:155px;touch-action:none;display:block}.hidden{display:none}.erro{color:#ff7a7a}.ok{color:var(--ok)}</style></head><body>
<div id="app"><div class="card sub">Carregando treinamento…</div></div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';let D=null,ctx=null,desenhou=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível abrir este treinamento.');return d}
function tela(){const t=D.treinamento; document.title=t.nome+' · NoPulso'; const mats=(t.materiais||[]).map(m=>`<a class="mat" target="_blank" rel="noopener" href="/api/treinamentos-publico/${encodeURIComponent(token)}/material/${encodeURIComponent(m.id)}">📎 ${esc(m.nome)}</a>`).join('')||'<p class="sub">Nenhum material disponível.</p>';
 document.querySelector('#app').innerHTML=`<div class="card"><div class="ey">${esc(t.franquia)} · ${esc(t.setor)}</div><h1>${esc(t.nome)}</h1><div class="sub">${esc(D.unidadeNome||'')} · Versão ${esc(t.versao)}<br>Participante: <b>${esc(D.participante.nome)}</b></div>${t.descricao?`<p class="sub">${esc(t.descricao)}</p>`:''}</div><div class="card"><b>Materiais</b>${mats}</div>${D.participante.status==='CONCLUIDO'?'<div class="card ok"><b>Treinamento concluído.</b><br>Seu registro foi assinado e guardado.</div>':`<div class="card"><b>Confirmação de participação</b><p class="sub">Leia os materiais, confirme seu nome e assine. Esta assinatura registra sua participação nesta versão do treinamento.</p><label>Nome completo</label><input id="nome" value="${esc(D.participante.nome)}"><label style="display:block;margin-top:10px"><input id="aceite" type="checkbox" style="width:auto"> Confirmo que participei e compreendi o treinamento.</label><p class="sub">Assine no quadro:</p><canvas id="pad"></canvas><button style="margin-top:12px" onclick="concluir()">Assinar e concluir</button></div>`}`;if(D.participante.status!=='CONCLUIDO')pad()}
function pad(){const c=document.querySelector('#pad'),r=c.getBoundingClientRect();c.width=r.width*2;c.height=310;ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';let on=false;const p=e=>{const x=(e.clientX-c.getBoundingClientRect().left)*(c.width/c.getBoundingClientRect().width),y=(e.clientY-c.getBoundingClientRect().top)*(c.height/c.getBoundingClientRect().height);return{x,y}};c.onpointerdown=e=>{on=true;desenhou=true;c.setPointerCapture(e.pointerId);const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!on)return;const q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>on=false}
async function concluir(){if(!document.querySelector('#aceite').checked)return alert('Confirme a participação.');if(!desenhou)return alert('Assine no quadro.');try{await api('/api/treinamentos-publico/'+encodeURIComponent(token)+'/concluir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aceite:true,nomeConfirmado:document.querySelector('#nome').value,assinatura:document.querySelector('#pad').toDataURL('image/png')})});D=await api('/api/treinamentos-publico/'+encodeURIComponent(token));tela()}catch(e){alert(e.message)}}
(async()=>{try{if(!token)throw Error('Link ausente.');D=await api('/api/treinamentos-publico/'+encodeURIComponent(token));tela()}catch(e){document.querySelector('#app').innerHTML='<div class="card erro">'+esc(e.message)+'</div>'}})();
</script></body></html>
