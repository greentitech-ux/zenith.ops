<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinamentos · NoPulso</title><script src="/tema.js"></script><style>:root{--b:#0b0d10;--p:#12161b;--i:#181d24;--l:#29313b;--t:#e7ecf1;--m:#8d99a7;--a:#b8ff3c}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial;padding:14px;max-width:900px;margin:auto}header{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--l);padding-bottom:14px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.sub,label{color:var(--m);font-size:12px;line-height:1.5}label{display:block;margin-top:8px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;color:var(--t);background:var(--i);border:1px solid var(--l);border-radius:8px}textarea{min-height:70px}button{padding:10px;border:0;border-radius:8px;cursor:pointer}.primary{background:var(--a);color:#111;font-weight:bold}.btn{background:var(--i);color:var(--t);border:1px solid var(--l)}.hidden{display:none}.ey{font:10px monospace;color:var(--a);letter-spacing:.12em}.item{padding:10px 0;border-top:1px solid var(--l)}.link{display:block;color:var(--a);word-break:break-all;margin:5px 0}</style></head><body>
<header><button class="btn" id="btn-menu" onclick="abrirMenu()">☰</button><div><div class="ey">NOPULSO · DESENVOLVIMENTO DE PESSOAS</div><h1 style="margin:3px 0">Treinamentos</h1></div></header><div id="erro" class="card sub">Carregando…</div>
<main id="gestao" class="hidden"><section class="card"><b>Novo treinamento</b><div class="grid"><div><label>Nome</label><input id="n" placeholder="Boas práticas de manipulação"></div><div><label>Franquia</label><input id="f" placeholder="Domino's"></div><div><label>Setor</label><input id="s" placeholder="Produção"></div><div><label>Criticidade</label><select id="cr"><option value="normal">Normal</option><option value="obrigatorio">Obrigatório</option><option value="critico">Crítico</option></select></div></div><label>Descrição</label><textarea id="d"></textarea><button class="primary" onclick="novo()">Criar rascunho</button></section>
<section class="card"><b>Materiais e publicação</b><label>Treinamento</label><select id="mc"></select><input id="arq" type="file" accept="video/*,image/*,application/pdf,.doc,.docx,.ppt,.pptx" style="margin-top:8px"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="anexar()">Anexar material</button><button class="primary" onclick="publicar()">Publicar versão</button></div></section>
<section class="card"><b>Aplicar na unidade</b><div class="grid"><div><label>Treinamento</label><select id="ac"></select></div><div><label>Unidade</label><select id="au"></select></div><div><label>Instrutor</label><input id="ai"></div><div><label>Prazo</label><input id="ap" type="date"></div></div><label>Participantes</label><textarea id="ps" placeholder="Um por linha: Nome completo | WhatsApp ou e-mail"></textarea><button class="primary" onclick="aplicar()">Gerar links individuais</button><div id="links" class="sub"></div></section></main><section class="card"><b>Aplicações</b><div id="lista" class="sub"></div></section>
<script>const T=localStorage.getItem('authToken')||'', $=x=>document.getElementById(x);let C=[],U=[];const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o){let r=await fetch(p,Object.assign({headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}},o||{})),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Falha');return d}function forms(){$('mc').innerHTML=C.map(x=>`<option value="${e(x.id)}">${e(x.franquia)} · ${e(x.nome)} v${x.versao} (${x.status})</option>`).join('');$('ac').innerHTML=C.filter(x=>x.status==='PUBLICADO').map(x=>`<option value="${e(x.id)}">${e(x.franquia)} · ${e(x.setor)} · ${e(x.nome)} v${x.versao}</option>`).join('');$('au').innerHTML=U.map(x=>`<option value="${e(x.codigo)}">${e(x.nome)}</option>`).join('')}async function novo(){try{await api('/api/treinamentos/cursos',{method:'POST',body:JSON.stringify({nome:$('n').value,franquia:$('f').value,setor:$('s').value,descricao:$('d').value,criticidade:$('cr').value,status:'RASCUNHO'})});await carregar();alert('Rascunho criado. Anexe materiais e publique.')}catch(x){alert(x.message)}}async function anexar(){let f=$('arq').files[0];if(!f)return alert('Selecione um arquivo.');let fd=new FormData();fd.append('arquivo',f);let r=await fetch('/api/treinamentos/cursos/'+encodeURIComponent($('mc').value)+'/material',{method:'POST',headers:{Authorization:'Bearer '+T},body:fd}),d=await r.json().catch(()=>({}));if(!r.ok)return alert(d.error||'Falha');$('arq').value='';await carregar()}async function publicar(){let x=C.find(x=>x.id===$('mc').value);try{await api('/api/treinamentos/cursos',{method:'POST',body:JSON.stringify({...x,status:'PUBLICADO'})});await carregar()}catch(x){alert(x.message)}}async function aplicar(){let participantes=$('ps').value.split('\n').map(x=>x.split('|')).map(x=>({nome:x[0].trim(),contato:(x[1]||'').trim()})).filter(x=>x.nome);try{let r=await api('/api/treinamentos/aplicacoes',{method:'POST',body:JSON.stringify({treinamentoId:$('ac').value,unidade:$('au').value,instrutor:$('ai').value,prazo:$('ap').value,participantes})});$('links').innerHTML='<br><b>Links individuais:</b>'+r.convites.map(x=>`<div><b>${e(x.nome)}</b><span class="link">${e(x.link)}</span></div>`).join('');await lista()}catch(x){alert(x.message)}}async function lista(){let a=await api('/api/treinamentos/aplicacoes');$('lista').innerHTML=a.length?a.map(x=>`<div class="item"><b>${e(x.nome)}</b> · ${e(x.unidadeNome||x.unidade)}<br>${e(x.treinamento.franquia)} · v${x.treinamento.versao} · ${x.participantes.filter(p=>p.status==='CONCLUIDO').length}/${x.participantes.length} concluíram</div>`).join(''):'Nenhuma aplicação ainda.'}async function carregar(){[C,U]=await Promise.all([api('/api/treinamentos/cursos'),api('/api/treinamentos/unidades')]);forms();await lista()}(async()=>{try{let x=await api('/api/treinamentos/contexto');$('erro').classList.add('hidden');if(x.podeGerir){$('gestao').classList.remove('hidden');await carregar()}else await lista()}catch(x){$('erro').textContent=x.message}})()</script><script src="/recolher.js"></script><script src="/nav-menu.js"></script></body></html>
