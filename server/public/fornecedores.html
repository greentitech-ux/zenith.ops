<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fornecedores · NoPulso</title><script src="/tema.js"></script><link rel="stylesheet" href="/style.css"><style>
main{max-width:1280px;margin:22px auto;padding:0 18px}.bar,.card,.modal-box{background:var(--card,#121820);border:1px solid var(--border,#273444);border-radius:13px;padding:16px}.bar,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h1{margin-right:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:16px}.card h3{margin:0}.muted{color:var(--muted,#9aacbd);font-size:13px}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#1b2937;color:#a8d8ff;font:11px monospace}.pendente{color:#ffd45a}.ativo{color:#64eab0}button{border:1px solid #304154;background:#19222d;color:#fff;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#b5ff2d;color:#102000;border-color:#b5ff2d}.danger{color:#ff9090}select,input,textarea{width:100%;box-sizing:border-box;padding:10px;background:#0b1015;color:#fff;border:1px solid #2c3a49;border-radius:8px}label{display:grid;gap:5px;color:var(--muted,#9aacbd);font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:15px;z-index:30}.modal-box{width:min(820px,100%);max-height:92vh;overflow:auto}.sub{border:1px dashed #415164;padding:12px;border-radius:9px;margin:10px 0}.hidden{display:none}.linkbox{font:12px monospace;overflow-wrap:anywhere;background:#0b1015;padding:10px;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}@media(max-width:700px){main{padding:0 10px}.grid{grid-template-columns:1fr}.bar h1{width:100%}.cards{grid-template-columns:1fr}}
</style></head><body><script src="/nav-menu.js"></script><script src="/recolher.js"></script><script>const authToken=localStorage.getItem('authToken');if(!authToken)location='/';const fetchOriginal=fetch.bind(window);window.fetch=(url,opcoes={})=>fetchOriginal(url,{...opcoes,headers:{...(opcoes.headers||{}),...(String(url).startsWith('/api/')?{Authorization:'Bearer '+authToken}:{})}});</script><main><div class="bar"><h1>🏢 Fornecedores</h1><label>Unidade para o link <select id="unidadeLink"></select></label><button id="gerarLink">🔗 Gerar link do fornecedor</button><button class="primary" id="novo">+ Novo fornecedor</button></div><p class="muted">Cadastro por unidade, com contatos e formas de pagamento repetíveis. Envios do link público ficam pendentes até validação.</p><div class="bar"><label>Filtrar unidade <select id="fUnidade"><option value="">Todas as unidades</option></select></label><label>Status <select id="fStatus"><option value="">Todos</option><option value="ATIVO">Ativos</option><option value="PENDENTE">Pendentes</option></select></label></div><div id="resultado" class="cards"></div></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="row"><h2 id="tituloModal">Novo fornecedor</h2><button onclick="fechar()">✕</button></div><form id="form"><div class="grid"><label>Unidade <select id="unidade" required></select></label><label>Razão social <input id="razaoSocial" required></label><label>Nome fantasia <input id="nomeFantasia"></label><label>CPF/CNPJ <input id="documento" required inputmode="numeric"></label><label>Categoria/serviço <input id="categoria"></label><label class="full">Observação <textarea id="observacao"></textarea></label></div><div class="row"><h3>Contatos</h3><button type="button" onclick="addContato()">+ Contato</button></div><div id="contatos"></div><div class="row"><h3>Pagamento</h3><button type="button" onclick="addPagamento()">+ Forma</button></div><p class="muted">Pix ou transferência; o favorecido deve ter o mesmo CPF/CNPJ do fornecedor.</p><div id="pagamentos"></div><div class="actions"><button class="primary">Salvar fornecedor</button><button type="button" onclick="fechar()">Cancelar</button></div></form></div></div><script>
let contexto={},lista=[],editando=null;const $=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Erro na operação');return j});
function opcoes(sel,valor=''){sel.innerHTML=(contexto.unidades||[]).map(u=>`<option value="${esc(u.codigo)}">${esc(u.nome)}</option>`).join('');if(valor)sel.value=valor}
function addContato(v={}){const d=document.createElement('div');d.className='sub contato';d.innerHTML=`<div class="row"><b>Contato</b><button type="button" class="danger">Remover</button></div><div class="grid"><label>Nome <input data-k="nome" value="${esc(v.nome)}" required></label><label>Cargo <input data-k="cargo" value="${esc(v.cargo)}"></label><label>Telefone <input data-k="telefone" value="${esc(v.telefone)}"></label><label>E-mail <input data-k="email" value="${esc(v.email)}"></label></div>`;d.querySelector('button').onclick=()=>d.remove();$('#contatos').append(d)}
function addPagamento(v={}){const d=document.createElement('div');d.className='sub pagamento';d.innerHTML=`<div class="row"><b>Forma de pagamento</b><button type="button" class="danger">Remover</button></div><div class="grid"><label>Tipo <select data-k="tipo"><option value="pix">Pix</option><option value="transferencia">Transferência bancária</option></select></label><label>Banco <input data-k="banco" value="${esc(v.banco)}"></label><label>Beneficiário <input data-k="beneficiario" value="${esc(v.beneficiario)}" required></label><label>CPF/CNPJ do beneficiário <input data-k="documentoBeneficiario" value="${esc(v.documentoBeneficiario)}" required></label><label class="pix">Chave Pix <input data-k="chavePix" value="${esc(v.chavePix)}"></label><label class="trans">Agência <input data-k="agencia" value="${esc(v.agencia)}"></label><label class="trans">Conta <input data-k="conta" value="${esc(v.conta)}"></label><label class="trans">Tipo de conta <input data-k="tipoConta" value="${esc(v.tipoConta)}"></label></div>`;const s=d.querySelector('select');s.value=v.tipo||'pix';const atualizar=()=>{const t=s.value==='transferencia';d.querySelectorAll('.trans').forEach(x=>x.classList.toggle('hidden',!t));d.querySelector('.pix').classList.toggle('hidden',t);d.querySelector('[data-k="banco"]').required=t;d.querySelector('[data-k="agencia"]').required=t;d.querySelector('[data-k="conta"]').required=t;d.querySelector('[data-k="chavePix"]').required=!t};s.onchange=atualizar;atualizar();d.querySelector('button').onclick=()=>d.remove();$('#pagamentos').append(d)}
function ler(sel){return [...document.querySelectorAll(sel)].map(d=>Object.fromEntries([...d.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()])))}
function mascara(v){const s=String(v||'');return s.length<5?'••••':`•••• ${s.slice(-4)}`}
function desenhar(){const u=$('#fUnidade').value,st=$('#fStatus').value;const dados=lista.filter(x=>(!u||x.unidade===u)&&(!st||x.status===st));$('#resultado').innerHTML=dados.length?dados.map(f=>`<article class="card"><div class="row"><h3>${esc(f.nomeFantasia||f.razaoSocial)}</h3><span class="${f.status==='PENDENTE'?'pendente':'ativo'}">${f.status}</span></div><p class="muted">${esc(f.unidadeNome)} · ${esc(f.categoria||'Sem categoria')}</p><p><span class="tag">${esc(f.documento||'Documento pendente')}</span></p><p class="muted">👤 ${f.contatos.map(c=>esc(c.nome||c.telefone||c.email)).join(' · ')}</p><p class="muted">💳 ${f.pagamentos.map(p=>p.tipo==='pix'?`Pix ${mascara(p.chavePix)}`:`Transferência ${esc(p.banco)} ${mascara(p.conta)}`).join(' · ')||'Sem pagamento informado'}</p><div class="actions"><button onclick="editar('${f.id}')">Editar</button>${f.status==='PENDENTE'?`<button class="primary" onclick="validar('${f.id}')">✓ Validar</button>`:''}</div></article>`).join(''):'<p class="muted">Nenhum fornecedor neste filtro.</p>'}
function abrir(f=null){editando=f;$('#tituloModal').textContent=f?'Editar fornecedor':'Novo fornecedor';opcoes($('#unidade'),f?.unidade);$('#unidade').disabled=!!f;['razaoSocial','nomeFantasia','documento','categoria','observacao'].forEach(k=>$('#'+k).value=f?.[k]||'');$('#contatos').innerHTML='';$('#pagamentos').innerHTML='';(f?.contatos||[{}]).forEach(addContato);(f?.pagamentos||[{}]).forEach(addPagamento);$('#modal').classList.remove('hidden')}function fechar(){$('#modal').classList.add('hidden')}
async function editar(id){abrir(lista.find(x=>x.id===id))}async function validar(id){if(!confirm('Validar este fornecedor para uso da unidade?'))return;try{await api('/api/fornecedores/'+id+'/validar',{method:'POST'});await carregar()}catch(e){alert(e.message)}}
async function carregar(){lista=await api('/api/fornecedores');desenhar()}async function iniciar(){try{contexto=await api('/api/tarefas/contexto');opcoes($('#unidadeLink'));const filtros=$('#fUnidade');filtros.innerHTML='<option value="">Todas as unidades</option>';contexto.unidades.forEach(u=>filtros.add(new Option(u.nome,u.codigo)));await carregar()}catch(e){$('#resultado').textContent=e.message}}
$('#novo').onclick=()=>abrir();$('#fUnidade').onchange=desenhar;$('#fStatus').onchange=desenhar;$('#gerarLink').onclick=async()=>{try{const j=await api('/api/fornecedores/link',{method:'POST',body:JSON.stringify({unidade:$('#unidadeLink').value})});await navigator.clipboard.writeText(j.link);alert('Link copiado. Ele pode ser usado para cadastrar mais de um fornecedor e cada envio ficará pendente de validação.\n\n'+j.link)}catch(e){alert(e.message)}};$('#form').onsubmit=async e=>{e.preventDefault();const dados=Object.fromEntries(['razaoSocial','nomeFantasia','documento','categoria','observacao'].map(k=>[k,$('#'+k).value]));dados.unidade=$('#unidade').value;dados.contatos=ler('.contato');dados.pagamentos=ler('.pagamento');try{await api('/api/fornecedores'+(editando?'/'+editando.id:''),{method:editando?'PUT':'POST',body:JSON.stringify(dados)});fechar();await carregar()}catch(e){alert(e.message)}};iniciar();
</script></body></html>
