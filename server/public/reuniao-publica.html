<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reunião · NoPulso</title>
<style>:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}main{max-width:720px;margin:auto;padding:28px 14px}.brand{color:var(--accent);font:700 11px ui-monospace,monospace;letter-spacing:.12em}.card{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}h1{margin:4px 0 8px;font-size:25px}.meta,.vazio{color:var(--muted);line-height:1.5}.descricao{white-space:pre-wrap;margin:16px 0;padding:12px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px}.entrar,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:11px 15px;background:var(--accent);color:#10130c;font-weight:800;text-decoration:none;cursor:pointer}.comentario{padding:12px 0;border-bottom:1px solid var(--line)}.comentario b{display:block;margin-bottom:4px}.comentario small{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin-top:12px}input,textarea{width:100%;margin-top:6px;padding:11px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;font:inherit}textarea{min-height:100px;resize:vertical}.erro{color:var(--bad)}#FORM[hidden]{display:none}@media(max-width:520px){main{padding:14px 10px}.card{padding:16px}h1{font-size:21px}}</style></head>
<body><main><div class="brand">NOPULSO · REUNIÃO COMPARTILHADA</div><section class="card" id="CARD"><div class="meta">Carregando…</div></section></main>
<script>
const token=new URLSearchParams(location.search).get('convite')||'';const card=document.getElementById('CARD');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=s=>s?String(s).split('-').reverse().join('/'):'Data não informada';const hora=s=>s?new Date(s).toLocaleString('pt-BR') : '';
async function carregar(){try{const r=await fetch('/api/reunioes/publica/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error);card.innerHTML=`<h1>${esc(d.titulo)}</h1><div class="meta">${esc(data(d.data))}${d.hora?' às '+esc(d.hora):''}${d.duracaoMin?' · '+esc(d.duracaoMin)+' min':''}</div>${d.descricao?`<div class="descricao">${esc(d.descricao)}</div>`:''}${d.linkReuniao?`<p><a class="entrar" href="${esc(d.linkReuniao)}" target="_blank" rel="noopener noreferrer">Entrar no Google Meet</a></p>`:''}<h2>Comentários</h2><div id="LISTA">${(d.comentarios||[]).map(c=>`<div class="comentario"><b>${esc(c.porNome)}</b><div>${esc(c.texto)}</div><small>${esc(hora(c.em))}</small></div>`).join('')||'<div class="vazio">Nenhum comentário ainda.</div>'}</div><form id="FORM"><label>Seu nome<input id="NOME" maxlength="80" required></label><label>Comentário<textarea id="TEXTO" maxlength="1000" required></textarea></label><p><button id="ENVIAR">Enviar comentário</button></p><div id="MSG" class="meta"></div></form>`;document.getElementById('FORM').onsubmit=enviar}catch(e){card.innerHTML=`<h1>Link encerrado</h1><p class="erro">${esc(e.message||'Este convite não está mais disponível.')}</p>`}}
async function enviar(ev){ev.preventDefault();const b=document.getElementById('ENVIAR'),msg=document.getElementById('MSG');b.disabled=true;msg.textContent='Enviando…';try{const r=await fetch('/api/reunioes/publica/'+encodeURIComponent(token)+'/comentarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.getElementById('NOME').value,texto:document.getElementById('TEXTO').value})});const d=await r.json();if(!r.ok)throw Error(d.error);await carregar()}catch(e){msg.textContent=e.message||'Não foi possível enviar.';b.disabled=false}}
carregar();
</script></body></html>
