<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Meus atendimentos · NoPulso</title>
  <link rel="icon" href="/beniboy-app-192.png" type="image/png">
  <style>
    :root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#28303a;--text:#e7ecf1;--muted:#98a3b3;--accent:#b8ff3c;--accent2:#5cc8ff;--bad:#ff5c5c;--sans:'Archivo',Arial,sans-serif;}
    *{box-sizing:border-box;min-width:0;}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);}
    main{max-width:960px;margin:auto;padding:24px clamp(16px,4vw,32px);}
    header,.acoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    header{justify-content:space-between;margin-bottom:24px;}h1{font-size:clamp(22px,4vw,30px);margin:0;}
    .sub,.meta{color:var(--muted);font-size:13px;}p{margin:8px 0;}
    .card,.msg{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere;}
    .msg.eu{background:var(--panel2);border-left:3px solid var(--accent);margin-left:10%;}.msg.suporte{margin-right:10%;}.texto{white-space:pre-wrap;}
    button,.botao{display:inline-flex;align-items:center;justify-content:center;min-height:44px;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--text);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;overflow-wrap:anywhere;}
    button:disabled{opacity:.6;cursor:wait;}button[type=submit]{background:var(--accent);color:#0b0d10;}
    .protocolo{width:100%;display:flex;justify-content:space-between;text-align:left;flex-wrap:wrap;gap:8px;margin:12px 0;}
    textarea,input{max-width:100%;width:100%;box-sizing:border-box;margin:8px 0 16px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;}
    textarea{min-height:100px;resize:vertical;}label{display:block;}a{color:var(--accent);}#erro{color:var(--bad);overflow-wrap:anywhere;}
    [hidden]{display:none!important;}@media(max-width:480px){header .acoes{width:100%;}header .botao{flex:1;}.msg.eu{margin-left:4%;}.msg.suporte{margin-right:4%;}}
  </style>
  <script src="/tema.js"></script>
  <script src="/atendimento-navegacao.js" defer></script>
  <script src="/meu-atendimento.js" defer></script>
</head>
<body>
<main>
  <header>
    <div><div class="sub">ATENDIMENTO NOPULSO</div><h1>Meus atendimentos</h1></div>
    <nav class="acoes" aria-label="Navegação entre áreas">
      <a class="botao" data-area-destino="nopulso" hidden>Ir para o NoPulso ↗</a>
      <button id="sair" type="button" hidden>Sair</button>
    </nav>
  </header>
  <p class="sub">Acompanhe seus protocolos abertos e o último encerrado. Os atendimentos de outras pessoas não aparecem aqui.</p>
  <div class="acoes"><button id="voltar" type="button" hidden>← Meus atendimentos</button><a id="entrar" class="botao" href="/atendimento/entrar" hidden>Entrar com usuário e senha</a></div>
  <p id="erro" role="alert" hidden></p>
  <div id="app" aria-live="polite">Carregando…</div>
</main>
</body>
</html>
