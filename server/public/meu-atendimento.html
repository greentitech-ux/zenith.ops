<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu atendimento · Beniboy</title>
<style>body{margin:0;background:#0b0d10;color:#e7ecf1;font:15px Arial,sans-serif}main{max-width:680px;margin:auto;padding:28px 16px}h1{font-size:22px}.sub,.meta{color:#98a3b3;font-size:13px}.card,.msg{border:1px solid #28303a;background:#12161b;border-radius:12px;padding:13px;margin:10px 0}.msg.eu{background:#12303a;margin-left:12%}.msg.suporte{margin-right:12%}button{background:#b8ff3c;border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}textarea,input{width:100%;box-sizing:border-box;margin:8px 0;background:#181d24;color:#fff;border:1px solid #28303a;border-radius:8px;padding:10px}a{color:#b8ff3c}.hidden{display:none}</style>
<main><div class="sub">NOPULSO · CENTRAL BENIBOY</div><h1>Meu atendimento</h1><p class="sub">Acompanhe somente os seus protocolos. A equipe, outros clientes e notas internas não aparecem aqui.</p><div id="app">Carregando…</div></main>
<script>
const app=document.querySelector('#app');const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','>':'&gt;','&':'&amp;'}[c]));
const auth=localStorage.getItem('authToken');const hash=new URLSearchParams(location.hash.slice(1));let atual=null,modo='';
function status(c){return c.status==='FINALIZADO'?(c.statusAtendimento==='RESOLVIDO'?'Resolvido':'Sem solução'):(c.statusAtendimento||'Em andamento').replaceAll('_',' ')}
async function json(url,opt={}){const h=opt.headers||{};if(auth)h.Authorization='Bearer '+auth;const r=await fetch(url,{...opt,headers:h});if(!r.ok)throw new Error('Não foi possível acessar este atendimento.');return r.json()}
function anexo(m,i){if(!m.anexo)return '';let u=modo==='link'?`/api/suporte-chat/${atual.id}/anexo/${i}?token=${encodeURIComponent(hash.get('token'))}`:`/api/meus-atendimentos/${atual.id}/anexo/${i}`;return `<br><a href="${u}">📎 ${esc(m.anexo.nome)}</a>`}
function renderChat(c){atual=c;app.innerHTML=`<div class="card"><b>Protocolo #${c.numeroTicket}</b><div class="meta">${esc(c.assunto||'Atendimento')} · ${status(c)}</div></div><section>${c.mensagens.map((m,i)=>`<div class="msg ${m.de==='visitante'?'eu':'suporte'}"><b>${m.de==='visitante'?'Você':'Suporte'}</b><div>${esc(m.texto)}</div>${anexo(m,i)}<div class="meta">${new Date(m.em).toLocaleString('pt-BR')}</div></div>`).join('')}</section>${c.status==='ABERTO'?`<form id="f"><textarea name="texto" placeholder="Escreva sua resposta"></textarea><input name="anexo" type="file" accept="image/*,application/pdf"><button>Enviar mensagem</button></form>`:'<div class="card">Este é o último atendimento encerrado.</div>'}`;const f=document.querySelector('#f');if(f)f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);try{if(modo==='link')fd.append('token',hash.get('token'));await json(modo==='link'?`/api/suporte-chat/${atual.id}/mensagem`:`/api/meus-atendimentos/${atual.id}/mensagem`,{method:'POST',body:fd});carregarChat(atual.id)}catch(x){alert(x.message)}}}
async function carregarChat(id){try{renderChat(await json(modo==='link'?`/api/meu-atendimento/${id}?token=${encodeURIComponent(hash.get('token'))}`:`/api/meus-atendimentos/${id}`))}catch(e){app.textContent=e.message}}
async function iniciar(){if(hash.get('id')&&hash.get('token')){modo='link';return carregarChat(hash.get('id'))}if(!auth){app.innerHTML='<div class="card">Abra o link secreto enviado no seu atendimento ou entre no NoPulso para ver os seus protocolos.</div>';return}try{const d=await json('/api/meus-atendimentos');const todos=[...d.abertos,...(d.ultimoEncerrado?[d.ultimoEncerrado]:[])];app.innerHTML=todos.length?todos.map(c=>`<button style="display:block;width:100%;text-align:left;margin:8px 0" data-id="${c.id}">#${c.numeroTicket} · ${esc(c.assunto||'Atendimento')}<span class="meta"> — ${status(c)}</span></button>`).join(''):'<div class="card">Nenhum atendimento seu encontrado.</div>';app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{modo='login';carregarChat(b.dataset.id)})}catch(e){app.textContent=e.message}}iniciar();
</script></html>
