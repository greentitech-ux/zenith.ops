<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Dia</title><style>:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}main{max-width:1400px;margin:auto;padding:24px 16px}.hamburger-btn{position:fixed;top:12px;left:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.top{margin-left:42px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{margin:4px 0;font-size:27px}.meta{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.primary{background:var(--accent);color:#111;border:0}.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;margin-top:24px;overflow:auto}.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:260px;padding:11px}.col h2{font-size:13px;margin:2px 0 12px}.task{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;cursor:pointer}.task b{display:block}.empty{color:var(--muted);font-size:12px;padding:14px 2px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:var(--muted);font-size:22px}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 12px}.comment{border-bottom:1px solid var(--line);padding:8px 0}</style><body><button class="hamburger-btn" id="btn-menu">☰</button><main><div class="top"><div><div id="date" class="meta"></div><h1>Meu Dia</h1><div class="meta">Execução integrada aos tickets.</div></div><button class="btn primary" onclick="novo()">＋ Criar tarefa</button></div><div class="board"><section class="col"><h2>Pendentes</h2><div id="P"></div></section><section class="col"><h2>A fazer</h2><div id="F"></div></section><section class="col"><h2>Hoje</h2><div id="H"></div></section><section class="col"><h2>Em andamento</h2><div id="A"></div></section><section class="col"><h2>Concluídas</h2><div id="C"></div></section></div></main><div class="modal" id="M"><div class="dialog"><div class="row"><b id="MH">Tarefa</b><button class="close" onclick="M.classList.remove('show')">×</button></div><div id="NEW"><input id="TITLE" placeholder="Título da tarefa"><textarea id="DESC" rows="4" placeholder="Descrição"></textarea><label class="meta">Data de entrega</label><input id="DUE" type="date"><button class="btn primary" onclick="criar()">Criar tarefa</button></div><div id="DET" hidden><div id="INFO" class="meta"></div><select id="STATUS" onchange="mover()"><option value="PENDENTE">Pendente</option><option value="A_FAZER">A fazer</option><option value="HOJE">Hoje</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select><button class="btn primary" onclick="concluir()">✓ Concluir</button><h3>Comentários</h3><div id="COM"></div><textarea id="TXT" rows="3" placeholder="Escreva uma atualização..."></textarea><button class="btn" onclick="coment()">Adicionar comentário</button></div></div></div><script>
let T=localStorage.getItem('authToken'),L=[],O;if(!T)location='/';const raw=fetch.bind(window);window.fetch=(u,o={})=>raw(u,{...o,headers:{...(o.headers||{}),...(String(u).startsWith('/api/')?{Authorization:'Bearer '+T}:{})}});const e=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const card=x=>`<div class="task" onclick="openT('${x.id}')"><b>${e(x.titulo)}</b><div class="meta">${x.vinculo?.numeroTicket?'Ticket #'+x.vinculo.numeroTicket+' · ':''}${x.unidadeNome||'Pessoal'}${x.concluidaEm?' · '+new Date(x.concluidaEm).toLocaleString('pt-BR'):''}</div></div>`;function put(id,s){document.getElementById(id).innerHTML=s.length?s.map(card).join(''):'<div class="empty">Nenhuma tarefa.</div>'}async function load(){let r=await fetch('/api/tarefas/minhas');L=await r.json();put('P',L.filter(x=>x.status==='PENDENTE'));put('F',L.filter(x=>x.status==='A_FAZER'));put('H',L.filter(x=>x.status==='HOJE'));put('A',L.filter(x=>x.status==='EM_ANDAMENTO'));put('C',L.filter(x=>x.status==='CONCLUIDA'));date.textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())}function novo(){O=null;MH.textContent='Nova tarefa';NEW.hidden=false;DET.hidden=true;M.classList.add('show')}function openT(id){O=L.find(x=>x.id===id);MH.textContent=O.titulo;NEW.hidden=true;DET.hidden=false;INFO.textContent=(O.vinculo?.numeroTicket?'Ticket #'+O.vinculo.numeroTicket+' · ':'')+(O.unidadeNome||'Tarefa pessoal')+(O.concluidaEm?' · concluída em '+new Date(O.concluidaEm).toLocaleString('pt-BR'):'');STATUS.value=O.status;COM.innerHTML=(O.comentarios||[]).map(x=>`<div class="comment"><b>${e(x.porEmail||'Suporte')}</b> · ${new Date(x.em).toLocaleString('pt-BR')}<br>${e(x.texto)}</div>`).join('')||'<div class="empty">Sem comentários.</div>';M.classList.add('show')}async function req(u,b,m='POST'){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function criar(){await req('/api/tarefas',{titulo:TITLE.value,descricao:DESC.value,dataEntrega:DUE.value});M.classList.remove('show');load()}async function mover(){if(STATUS.value==='CONCLUIDA')return concluir();await req('/api/tarefas/'+O.id+'/status',{status:STATUS.value},'PATCH');load()}async function concluir(){await req('/api/tarefas/'+O.id+'/concluir');M.classList.remove('show');load()}async function coment(){await req('/api/tarefas/'+O.id+'/comentarios',{texto:TXT.value});await load();openT(O.id)}load().catch(x=>alert(x.message));
</script><script src="/tema.js"></script><script src="/recolher.js"></script><script src="/nav-menu.js"></script></body></html>
