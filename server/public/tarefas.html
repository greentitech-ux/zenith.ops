<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu Dia · NoPulso</title><script src="/tema.js"></script>
  <style>
    :root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c;--ok:#3ddc97;--warn:#ffbd59;--bad:#ff6b6b;--sans:Arial,sans-serif;--mono:ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px var(--sans)}main{max-width:1540px;margin:auto;padding:24px 16px}.hamburger-btn{position:fixed;top:12px;left:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;z-index:3}.top{margin-left:42px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{margin:4px 0;font-size:27px}.meta{color:var(--muted);font-size:12px;line-height:1.4}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;font:inherit}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#111;border:0}.danger{color:var(--bad)}.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:18px}.filters label{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.filters select{min-width:180px;margin:4px 0 0}.summary{margin-left:auto;font:12px var(--mono);color:var(--muted)}.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;margin-top:18px;overflow:auto;padding-bottom:6px}.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:285px;padding:11px}.col h2{font-size:13px;margin:2px 0 12px}.count{color:var(--muted);font:11px var(--mono)}.task{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;cursor:pointer;transition:border-color .15s}.task:hover{border-color:var(--accent)}.task b{display:block;line-height:1.3}.task .meta{margin-top:5px}.tag{display:inline-block;margin-top:7px;padding:2px 6px;border-radius:999px;background:rgba(184,255,60,.14);color:var(--accent);font:10px var(--mono)}.late{color:var(--bad)}.empty{color:var(--muted);font-size:12px;padding:14px 2px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 12px;font:inherit}textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comment{border-bottom:1px solid var(--line);padding:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.info{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;line-height:1.55}@media(max-width:700px){main{padding:18px 12px}.grid2{grid-template-columns:1fr}.summary{margin-left:0;width:100%}.filters select{min-width:100%}}
  </style>
</head>
<body>
  <button class="hamburger-btn" id="btn-menu" aria-label="Abrir menu">☰</button>
  <main>
    <div class="top"><div><div id="date" class="meta"></div><h1>Meu Dia</h1><div class="meta">Priorize, acompanhe e conclua tarefas sem perder o vínculo com os tickets.</div></div><button class="btn primary" onclick="novo()">＋ Criar tarefa</button></div>
    <div class="filters"><label>Período<select id="PERIODO" onchange="load()"><option value="abertas">Em aberto</option><option value="hoje">Hoje</option><option value="ontem">Ontem</option><option value="semana">Esta semana</option><option value="mes">Este mês</option><option value="futuras">Futuras</option><option value="concluidas">Concluídas</option><option value="todas">Todas</option></select></label><div id="SUMMARY" class="summary"></div></div>
    <div class="board">
      <section class="col"><h2>Pendentes <span id="NP" class="count"></span></h2><div id="P"></div></section>
      <section class="col"><h2>A fazer <span id="NF" class="count"></span></h2><div id="F"></div></section>
      <section class="col"><h2>Hoje <span id="NH" class="count"></span></h2><div id="H"></div></section>
      <section class="col"><h2>Em andamento <span id="NA" class="count"></span></h2><div id="A"></div></section>
      <section class="col"><h2>Futuras <span id="NU" class="count"></span></h2><div id="U"></div></section>
      <section class="col"><h2>Concluídas <span id="NC" class="count"></span></h2><div id="C"></div></section>
    </div>
  </main>
  <div class="modal" id="M"><div class="dialog"><div class="row"><b id="MH">Tarefa</b><button class="close" onclick="fechar()" aria-label="Fechar">×</button></div>
    <div id="NEW"><input id="TITLE" maxlength="200" placeholder="Título da tarefa"><textarea id="DESC" rows="4" maxlength="2000" placeholder="Contexto, próximo passo ou resultado esperado"></textarea><div class="grid2"><label class="meta">Data de início<input id="START" type="date"></label><label class="meta">Data de entrega<input id="DUE" type="date"></label></div><label class="meta">Unidade (opcional)<select id="UNIT"><option value="">Tarefa pessoal</option></select></label><label id="RESPROW" class="meta" hidden>Responsável<select id="RESP"></select></label><button class="btn primary" onclick="criar()">Criar tarefa</button></div>
    <div id="DET" hidden><div id="INFO" class="info"></div><label class="meta">Status<select id="STATUS" onchange="mover()"><option value="PENDENTE">Pendente</option><option value="A_FAZER">A fazer</option><option value="HOJE">Hoje</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select></label><div class="actions"><button id="BTNCON" class="btn primary" onclick="concluir()">✓ Concluir tarefa</button><button id="BTNDL" class="btn danger" onclick="arquivar()" hidden>Remover concluída</button></div><h3>Comentários</h3><div id="COM"></div><textarea id="TXT" rows="3" maxlength="2000" placeholder="Registre uma atualização para o histórico..."></textarea><button class="btn" onclick="coment()">Adicionar comentário</button></div>
  </div></div>
<script>
let T=localStorage.getItem('authToken'),L=[],O,CTX={unidades:[]};if(!T)location='/';const raw=fetch.bind(window);window.fetch=(u,o={})=>raw(u,{...o,headers:{...(o.headers||{}),...(String(u).startsWith('/api/')?{Authorization:'Bearer '+T}:{})}});const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{const z=new Date(d),p=n=>String(n).padStart(2,'0');return z.getFullYear()+'-'+p(z.getMonth()+1)+'-'+p(z.getDate())};const hoje=()=>iso(new Date());const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'';
function faixa(t){if(t.status==='CONCLUIDA')return'C';if(t.status==='EM_ANDAMENTO')return'A';const prazo=t.dataEntrega||'';if(prazo&&prazo<hoje())return'P';if(t.status==='PENDENTE')return'P';if(prazo===hoje()||t.status==='HOJE')return'H';if((prazo&&prazo>hoje())||(t.dataInicio&&t.dataInicio>hoje()))return'U';return'F'}
function dataRef(t){return String(t.concluidaEm||t.dataEntrega||t.dataInicio||t.criadaEm||'').slice(0,10)}
function noPeriodo(t){const p=$('PERIODO').value,ref=dataRef(t),h=hoje(),d=new Date(h+'T12:00:00');if(p==='abertas')return t.status!=='CONCLUIDA';if(p==='concluidas')return t.status==='CONCLUIDA';if(p==='todas')return true;if(p==='hoje')return ref===h;if(p==='ontem'){d.setDate(d.getDate()-1);return ref===iso(d)}if(p==='futuras')return (t.dataEntrega||t.dataInicio||'')>h;if(p==='semana'){const ini=new Date(h+'T12:00:00');ini.setDate(ini.getDate()-((ini.getDay()+6)%7));const fim=new Date(ini);fim.setDate(fim.getDate()+6);return ref>=iso(ini)&&ref<=iso(fim)}if(p==='mes')return ref.slice(0,7)===h.slice(0,7);return true}
function card(x){const f=faixa(x),prazo=x.dataEntrega?` · entrega ${x.dataEntrega.split('-').reverse().join('/')}`:'';const origem=x.vinculo?.numeroTicket?'Ticket #'+x.vinculo.numeroTicket+' · ':'';return`<div class="task" onclick="openT('${x.id}')"><b>${e(x.titulo)}</b><div class="meta">${origem}${e(x.unidadeNome||'Pessoal')}${prazo}</div><div class="meta">Criada por ${e(x.criadoPorNome||'Usuário')}</div>${f==='P'?'<span class="tag late">prazo pendente</span>':''}</div>`}
function put(id,n,s){$(id).innerHTML=s.length?s.map(card).join(''):'<div class="empty">Nenhuma tarefa.</div>';$('N'+n).textContent=s.length?'('+s.length+')':''}
async function contexto(){const r=await fetch('/api/tarefas/contexto');CTX=await r.json();$('UNIT').innerHTML='<option value="">Tarefa pessoal</option>'+((CTX.unidades)||[]).map(u=>`<option value="${e(u.codigo)}">${e(u.nome)}</option>`).join('');$('RESP').innerHTML=((CTX.responsaveis)||[]).map(u=>`<option value="${e(u.id)}">${e(u.nome)}</option>`).join('');$('RESPROW').hidden=!CTX.podeAtribuir}
async function load(){let r=await fetch('/api/tarefas/minhas');let d=await r.json();if(!r.ok)throw Error(d.error);L=d;const vis=L.filter(noPeriodo),gr=k=>vis.filter(x=>faixa(x)===k);put('P','P',gr('P'));put('F','F',gr('F'));put('H','H',gr('H'));put('A','A',gr('A'));put('U','U',gr('U'));put('C','C',gr('C'));$('SUMMARY').textContent=vis.length+' tarefa(s) no filtro';$('date').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())}
function novo(){O=null;$('MH').textContent='Nova tarefa';$('NEW').hidden=false;$('DET').hidden=true;$('TITLE').value='';$('DESC').value='';$('START').value=hoje();$('DUE').value='';$('UNIT').value='';$('M').classList.add('show')}
function fechar(){$('M').classList.remove('show')}
function openT(id){O=L.find(x=>x.id===id);if(!O)return;$('MH').textContent=O.titulo;$('NEW').hidden=true;$('DET').hidden=false;const ticket=O.vinculo?.numeroTicket?'Ticket #'+O.vinculo.numeroTicket+' · ':'';const feito=O.concluidaEm?'<br>Concluída por <b>'+e(O.concluidaPorNome||'Usuário')+'</b> em '+fmt(O.concluidaEm):'';$('INFO').innerHTML=ticket+'<span class="nome-unidade">'+e(O.unidadeNome||'Tarefa pessoal')+'</span><br>Criada por <b>'+e(O.criadoPorNome||'Usuário')+'</b> em '+fmt(O.criadaEm)+(O.dataInicio?'<br>Início: '+e(O.dataInicio.split('-').reverse().join('/')):'')+(O.dataEntrega?'<br>Entrega: '+e(O.dataEntrega.split('-').reverse().join('/')):'')+feito;$('STATUS').value=O.status;$('BTNCON').hidden=O.status==='CONCLUIDA';$('BTNDL').hidden=O.status!=='CONCLUIDA';$('COM').innerHTML=(O.comentarios||[]).map(x=>`<div class="comment"><b>${e(x.porNome||'Usuário')}</b> · ${fmt(x.em)}<br>${e(x.texto)}</div>`).join('')||'<div class="empty">Sem comentários.</div>';$('TXT').value='';$('M').classList.add('show')}
async function req(u,b,m='POST'){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir a ação.');return d}
async function criar(){if(!$('TITLE').value.trim())return alert('Informe o título da tarefa.');await req('/api/tarefas',{titulo:$('TITLE').value,descricao:$('DESC').value,dataInicio:$('START').value,dataEntrega:$('DUE').value,unidade:$('UNIT').value,responsavelId:$('RESP').value});fechar();load()}
async function mover(){if($('STATUS').value==='CONCLUIDA')return concluir();await req('/api/tarefas/'+O.id+'/status',{status:$('STATUS').value},'PATCH');await load();openT(O.id)}
async function concluir(){if(!confirm('Confirmar a finalização desta tarefa? Se necessário, você poderá reabri-la depois.'))return;await req('/api/tarefas/'+O.id+'/concluir');fechar();load()}
async function arquivar(){if(!confirm('Remover esta tarefa concluída da sua lista? O histórico ficará preservado para auditoria.'))return;await req('/api/tarefas/'+O.id,undefined,'DELETE');fechar();load()}
async function coment(){if(!$('TXT').value.trim())return;await req('/api/tarefas/'+O.id+'/comentarios',{texto:$('TXT').value});await load();openT(O.id)}
Promise.all([contexto(),load()]).catch(x=>alert(x.message));
</script><script src="/recolher.js"></script><script src="/nav-menu.js"></script>
</body></html>
