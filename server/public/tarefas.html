<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Dia · NoPulso</title><style>:root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c;--accent2:#5cc8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:25px 16px}.hamburger-btn{position:fixed;top:12px;left:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.top{margin-left:42px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.meta{color:var(--muted);font-size:12px}h1{margin:5px 0;font-size:27px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.primary{background:var(--accent);color:#111;border:0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.col{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-height:250px;padding:12px}.col h2{font-size:13px;margin:2px 0 12px}.task{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.task:hover{border-color:var(--accent2)}.task b{display:block}.empty{color:var(--muted);font-size:12px;padding:16px 3px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:1000}.modal.show{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:var(--muted);font-size:23px}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 12px}.comment{padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:720px){.board{grid-template-columns:1fr}}</style><body><button class="hamburger-btn" id="btn-menu">☰</button><main><div class="top"><div><div class="meta" id="date"></div><h1>Meu Dia</h1><div class="meta">Organize, acompanhe e conclua suas tarefas.</div></div><button class="btn primary" onclick="nova()">＋ Criar tarefa</button></div><div class="board"><section class="col"><h2>Hoje</h2><div id="p"></div></section><section class="col"><h2>Em andamento</h2><div id="a"></div></section><section class="col"><h2>Concluídas</h2><div id="c"></div></section></div></main><div class="modal" id="modal"><div class="dialog"><div class="row"><b id="mh">Tarefa</b><button class="close" onclick="fechar()">×</button></div><div id="form"><input id="mt" placeholder="Nome da tarefa"><textarea id="md" rows="4" placeholder="Descrição ou próximo passo"></textarea><button class="btn primary" onclick="salvar()">Criar tarefa</button></div><div id="detail" hidden><div class="meta" id="info"></div><select id="ms" onchange="status()"><option value="PENDENTE">Hoje</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select><button class="btn primary" onclick="concluir()">✓ Marcar como concluída</button><h3>Comentários</h3><div id="comments"></div><textarea id="comment" rows="3" placeholder="Escreva uma atualização..."></textarea><button class="btn" onclick="comentar()">Adicionar comentário</button></div></div></div><script>
let T=localStorage.getItem('authToken'),L=[],O;if(!T)location='/';let f=fetch.bind(window);fetch=(u,o={})=>f(u,{...o,headers:{...(o.headers||{}),...(String(u).startsWith('/api/')?{Authorization:'Bearer '+T}:{})}});let e=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function card(x){return `<div class="task" onclick="abrir('${x.id}')"><b>${e(x.titulo)}</b><div class="meta">${x.vinculo?.numeroTicket?'Ticket #'+x.vinculo.numeroTicket+' · ':''}${x.unidadeNome||'Tarefa pessoal'}</div></div>`}function put(i,x){document.getElementById(i).innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nenhuma tarefa aqui.</div>'}async function load(){let r=await fetch('/api/tarefas/minhas');L=await r.json();put('p',L.filter(x=>x.status==='PENDENTE'));put('a',L.filter(x=>x.status==='EM_ANDAMENTO'));put('c',L.filter(x=>x.status==='CONCLUIDA'));date.textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())}function nova(){O=null;mh.textContent='Nova tarefa';form.hidden=false;detail.hidden=true;modal.classList.add('show')}function abrir(id){O=L.find(x=>x.id===id);mh.textContent=O.titulo;form.hidden=true;detail.hidden=false;info.textContent=(O.vinculo?.numeroTicket?'Ticket #'+O.vinculo.numeroTicket+' · ':'')+(O.unidadeNome||'Tarefa pessoal');ms.value=O.status;comments.innerHTML=(O.comentarios||[]).map(x=>`<div class="comment"><b>${e(x.porEmail||'Suporte')}</b><br>${e(x.texto)}</div>`).join('')||'<div class="empty">Sem comentários.</div>';modal.classList.add('show')}function fechar(){modal.classList.remove('show')}async function post(u,b,m='POST'){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function salvar(){await post('/api/tarefas',{titulo:mt.value,descricao:md.value});fechar();load()}async function status(){if(ms.value==='CONCLUIDA')return concluir();await post('/api/tarefas/'+O.id+'/status',{status:ms.value},'PATCH');load()}async function concluir(){if(!confirm('Concluir esta tarefa?'))return;await post('/api/tarefas/'+O.id+'/concluir');fechar();load()}async function comentar(){await post('/api/tarefas/'+O.id+'/comentarios',{texto:comment.value});await load();abrir(O.id)}load().catch(x=>alert(x.message));
</script><script src="/tema.js"></script><script src="/recolher.js"></script><script src="/nav-menu.js"></script></body></html>
