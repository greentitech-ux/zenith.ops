<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu Dia · NoPulso</title><script src="/tema.js"></script>
  <style>
    :root{--bg:#0b0d10;--panel:#12161b;--panel2:#181d24;--line:#27313b;--text:#e7ecf1;--muted:#8c99a7;--accent:#b8ff3c;--ok:#3ddc97;--warn:#ffbd59;--bad:#ff6b6b;--sans:Arial,sans-serif;--mono:ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px var(--sans)}main{max-width:1540px;margin:auto;padding:24px 16px}.hamburger-btn{position:fixed;top:12px;left:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;z-index:3}.top{margin-left:42px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{margin:4px 0;font-size:27px}.meta{color:var(--muted);font-size:12px;line-height:1.4}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;font:inherit}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#111;border:0}.danger{color:var(--bad)}.filters{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(110deg,var(--panel),#11171d);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px}.filter-field{display:grid;gap:5px;min-width:230px}.filter-label{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.filters select{margin:0;height:39px;padding:8px 34px 8px 10px}.summary{margin-left:auto;border-left:1px solid var(--line);padding-left:16px;font:12px var(--mono);color:var(--muted);white-space:nowrap}.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;margin-top:18px;overflow:auto;padding-bottom:6px}.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:285px;padding:11px}.col h2{font-size:13px;margin:2px 0 12px}.col>div{max-height:510px;overflow-y:auto;padding-right:3px}.count{color:var(--muted);font:11px var(--mono)}.task{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;cursor:pointer;transition:border-color .15s}.task:hover{border-color:var(--accent)}.task b{display:block;line-height:1.3;overflow-wrap:anywhere}.task .meta{margin-top:5px;overflow-wrap:anywhere}.task-top{display:flex;gap:7px;align-items:start}.task-check{width:auto;margin:2px 0 0;flex:none;accent-color:var(--accent)}.tag{display:inline-block;margin-top:7px;padding:2px 6px;border-radius:999px;background:rgba(184,255,60,.14);color:var(--accent);font:10px var(--mono)}.late{color:var(--bad)}.empty{color:var(--muted);font-size:12px;padding:14px 2px}.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.bulk.show{display:flex}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 12px;font:inherit}textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comment{border-bottom:1px solid var(--line);padding:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.info{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;line-height:1.55}.anexos{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.anexos a{color:var(--accent);font-size:12px}.anexo-item{display:inline-flex;align-items:center;gap:0}.anexo-item .btn{border-top-right-radius:0;border-bottom-right-radius:0}.anexo-x{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding:9px 10px;font-weight:900}.anexo-nome{border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;padding:9px 12px;font-size:12px;background:var(--panel2)}.link-ticket{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}.link-ticket:hover{border-bottom-style:solid}.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:12px;margin:10px 0;cursor:pointer}@media(max-width:700px){main{padding:18px 12px}.grid2{grid-template-columns:1fr}.summary{margin-left:0;border-left:0;border-top:1px solid var(--line);padding:10px 0 0;width:100%}.filter-field{width:100%}}
  </style>
</head>
<body>
  <button class="hamburger-btn" id="btn-menu" aria-label="Abrir menu">☰</button>
  <main>
    <div class="top"><div><div id="date" class="meta"></div><h1>Meu Dia</h1><div class="meta">Priorize, acompanhe e conclua tarefas sem perder o vínculo com os tickets.</div></div><button id="CREATE" class="btn primary" onclick="novo()">＋ Criar tarefa</button></div>
    <div class="filters"><div class="filter-field"><span class="filter-label">Período</span><select id="PERIODO" onchange="load()"><option value="abertas">Em aberto</option><option value="hoje">Hoje</option><option value="ontem">Ontem</option><option value="semana">Esta semana</option><option value="mes">Este mês</option><option value="futuras">Futuras</option><option value="concluidas">Concluídas</option><option value="todas">Todas</option></select></div><div id="SUMMARY" class="summary"></div></div>
    <div id="BULK" class="bulk"><span id="SEL" class="meta"></span><button class="btn" onclick="lote('EM_ANDAMENTO')">Em andamento</button><button class="btn primary" onclick="lote('CONCLUIDA')">Concluir selecionadas</button><button class="btn" onclick="limparSelecao()">Limpar</button></div><div class="board">
      <section class="col"><h2>Pendentes <span id="NP" class="count"></span></h2><div id="P"></div></section>
      <section class="col"><h2>A fazer <span id="NF" class="count"></span></h2><div id="F"></div></section>
      <section class="col"><h2>Hoje <span id="NH" class="count"></span></h2><div id="H"></div></section>
      <section class="col"><h2>Em andamento <span id="NA" class="count"></span></h2><div id="A"></div></section>
      <section class="col"><h2>Futuras <span id="NU" class="count"></span></h2><div id="U"></div></section>
      <section class="col"><h2>Concluídas <span id="NC" class="count"></span></h2><div id="C"></div></section>
    </div>
  </main>
  <div class="modal" id="M"><div class="dialog"><div class="row"><b id="MH">Tarefa</b><button class="close" onclick="fechar()" aria-label="Fechar">×</button></div>
    <div id="NEW"><input id="TITLE" maxlength="200" placeholder="Título da tarefa"><textarea id="DESC" rows="4" maxlength="2000" placeholder="Contexto, próximo passo ou resultado esperado"></textarea><div class="grid2"><label class="meta">Data de início<input id="START" type="date"></label><label class="meta">Previsão de conclusão<input id="DUE" type="date"></label></div><label class="meta">Unidade (opcional)<select id="UNIT" onchange="atualizarResponsaveis()"><option value="">Tarefa pessoal</option></select></label><label id="RESPROW" class="meta" hidden>Responsável<select id="RESP"></select></label><label id="DROPNEW" class="drop">📎 Anexar print ou PDF (opcional) · clique, arraste ou cole com Ctrl+V<input id="FILENEW" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" multiple hidden></label><div id="ANXNEW" class="anexos"></div><button class="btn primary" onclick="criar()">Criar tarefa</button></div>
    <div id="DET" hidden><div id="INFO" class="info"></div><div class="grid2"><label class="meta">Data de início<input id="DINI" type="date" onchange="salvarDatas()"></label><label class="meta">Previsão de conclusão<input id="DFIM" type="date" onchange="salvarDatas()"></label></div><label class="meta">Status<select id="STATUS" onchange="mover()"><option value="PENDENTE">Pendente</option><option value="A_FAZER">A fazer</option><option value="HOJE">Hoje</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select></label><div class="actions"><button id="BTNCON" class="btn primary" onclick="concluir()">✓ Concluir tarefa</button><button id="BTNDL" class="btn danger" onclick="arquivar()" hidden>Remover concluída</button></div><h3>Anexos</h3><div id="ANX" class="anexos"></div><label id="DROP" class="drop">📎 Anexar print ou PDF · clique, arraste ou cole com Ctrl+V<input id="FILE" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" hidden></label><h3>Comentários</h3><div id="COM"></div><textarea id="TXT" rows="3" maxlength="2000" placeholder="Registre uma atualização para o histórico..."></textarea><button class="btn" onclick="coment()">Adicionar comentário</button></div>
  </div></div>
<script>
let T=localStorage.getItem('authToken'),L=[],O,CTX={unidades:[]},S=new Set;if(!T)location='/';const raw=fetch.bind(window);window.fetch=(u,o={})=>raw(u,{...o,headers:{...(o.headers||{}),...(String(u).startsWith('/api/')?{Authorization:'Bearer '+T}:{})}});const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{const z=new Date(d),p=n=>String(n).padStart(2,'0');return z.getFullYear()+'-'+p(z.getMonth()+1)+'-'+p(z.getDate())};const hoje=()=>iso(new Date());const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'';
function faixa(t){if(t.status==='CONCLUIDA')return'C';if(t.status==='EM_ANDAMENTO')return'A';const prazo=t.dataEntrega||'';if(prazo&&prazo<hoje())return'P';if(t.status==='PENDENTE')return'P';if(prazo===hoje()||t.status==='HOJE')return'H';if((prazo&&prazo>hoje())||(t.dataInicio&&t.dataInicio>hoje()))return'U';return'F'}
function dataRef(t){return String(t.concluidaEm||t.dataEntrega||t.dataInicio||t.criadaEm||'').slice(0,10)}
function noPeriodo(t){const p=$('PERIODO').value,ref=dataRef(t),h=hoje(),d=new Date(h+'T12:00:00');if(p==='abertas')return t.status!=='CONCLUIDA';if(p==='concluidas')return t.status==='CONCLUIDA';if(p==='todas')return true;if(p==='hoje')return ref===h;if(p==='ontem'){d.setDate(d.getDate()-1);return ref===iso(d)}if(p==='futuras')return (t.dataEntrega||t.dataInicio||'')>h;if(p==='semana'){const ini=new Date(h+'T12:00:00');ini.setDate(ini.getDate()-((ini.getDay()+6)%7));const fim=new Date(ini);fim.setDate(fim.getDate()+6);return ref>=iso(ini)&&ref<=iso(fim)}if(p==='mes')return ref.slice(0,7)===h.slice(0,7);return true}
function tituloVisivel(x){const t=String(x?.titulo||x||'Tarefa');return /^Login bloqueado:\s*\S+@\S+$/i.test(t)?'Login bloqueado':t}
function card(x){const f=faixa(x),prazo=x.dataEntrega?` · previsão ${x.dataEntrega.split('-').reverse().join('/')}`:'';const origem=x.vinculo?.numeroTicket?linkTicket(x.vinculo.numeroTicket)+' · ':'';return`<div class="task" onclick="openT('${x.id}')"><div class="task-top"><input class="task-check" onclick="event.stopPropagation()" onchange="selecionar('${x.id}',this.checked)" type="checkbox" ${S.has(x.id)?'checked':''}><b>${e(tituloVisivel(x))}</b></div><div class="meta">${origem}${e(x.unidadeNome||'Pessoal')}${prazo}</div><div class="meta">Criada por ${e(x.criadoPorNome||'Usuário')} · atribuída a ${e(x.responsavelNome||'Usuário')}</div>${f==='P'?'<span class="tag late">previsão vencida</span>':''}</div>`}
// o numero do ticket leva ate a solicitacao na Central (mesmo destino que
// compras.html usa) - a Central acha o card pelo numero e ja abre o detalhe
function linkTicket(numero){return `<a class="link-ticket" href="/central-historico.html?ticket=${encodeURIComponent(numero)}" onclick="event.stopPropagation()">Ticket #${e(numero)}</a>`}
function put(id,n,s){$(id).innerHTML=s.length?s.map(card).join(''):'<div class="empty">Nenhuma tarefa.</div>';$('N'+n).textContent=s.length?'('+s.length+')':''}
function atualizarResponsaveis(){const unidade=$('UNIT').value;$('RESP').innerHTML=((CTX.responsaveis)||[]).filter(u=>!unidade||(u.unidades||[]).includes(unidade)).map(u=>`<option value="${e(u.id)}">${e(u.nome)}</option>`).join('')||'<option value="">Nenhum usuário disponível</option>'}async function contexto(){const r=await fetch('/api/tarefas/contexto');CTX=await r.json();$('UNIT').innerHTML='<option value="">Tarefa pessoal</option>'+((CTX.unidades)||[]).map(u=>`<option value="${e(u.codigo)}">${e(u.nome)}</option>`).join('');atualizarResponsaveis();$('RESPROW').hidden=!CTX.podeAtribuir;$('CREATE').hidden=!CTX.podeCriar}
async function load(){let r=await fetch('/api/tarefas/minhas');let d=await r.json();if(!r.ok)throw Error(d.error);L=d;const vis=L.filter(noPeriodo),gr=k=>vis.filter(x=>faixa(x)===k);put('P','P',gr('P'));put('F','F',gr('F'));put('H','H',gr('H'));put('A','A',gr('A'));put('U','U',gr('U'));put('C','C',gr('C'));$('SUMMARY').textContent=vis.length+' tarefa(s) no filtro';$('date').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())}
function novo(){O=null;$('MH').textContent='Nova tarefa';$('NEW').hidden=false;$('DET').hidden=true;$('TITLE').value='';$('DESC').value='';$('START').value=hoje();$('DUE').value='';$('UNIT').value='';PEND=[];pintarPendentes();atualizarResponsaveis();$('M').classList.add('show')}
function fechar(){$('M').classList.remove('show')}
function openT(id){O=L.find(x=>x.id===id);if(!O)return;$('MH').textContent=tituloVisivel(O);$('NEW').hidden=true;$('DET').hidden=false;const ticket=O.vinculo?.numeroTicket?linkTicket(O.vinculo.numeroTicket)+' · ':'';const feito=O.concluidaEm?'<br>Concluída por <b>'+e(O.concluidaPorNome||'Usuário')+'</b> em '+fmt(O.concluidaEm):'';$('INFO').innerHTML=ticket+'<span class="nome-unidade">'+e(O.unidadeNome||'Tarefa pessoal')+'</span><br>Criada por <b>'+e(O.criadoPorNome||'Usuário')+'</b> em '+fmt(O.criadaEm)+feito;$('DINI').value=O.dataInicio||'';$('DFIM').value=O.dataEntrega||'';$('DINI').disabled=$('DFIM').disabled=O.status==='CONCLUIDA';$('STATUS').value=O.status;$('BTNCON').hidden=O.status==='CONCLUIDA';$('BTNDL').hidden=O.status!=='CONCLUIDA';$('ANX').innerHTML=(O.anexos||[]).map((a,i)=>`<span class="anexo-item"><button class="btn" onclick="verAnexo(${i})">📎 ${e(a.nome||'anexo')}</button>${a.id?`<button class="btn danger anexo-x" title="Remover anexo" onclick="tirarAnexo('${e(a.id)}',${JSON.stringify(e(a.nome||'anexo'))})">×</button>`:''}</span>`).join('')||'<span class="empty">Sem anexos.</span>';$('COM').innerHTML=(O.comentarios||[]).map(x=>`<div class="comment"><b>${e(x.porNome||'Usuário')}</b> · ${fmt(x.em)}<br>${e(x.texto)}</div>`).join('')||'<div class="empty">Sem comentários.</div>';$('TXT').value='';$('M').classList.add('show')}
async function req(u,b,m='POST'){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir a ação.');return d}
// a tarefa so ganha id depois de criada, entao o anexo escolhido no formulario
// fica na memoria e sobe logo em seguida, um POST por arquivo
async function criar(){if(!$('TITLE').value.trim())return alert('Informe o título da tarefa.');const nova=await req('/api/tarefas',{titulo:$('TITLE').value,descricao:$('DESC').value,dataInicio:$('START').value,dataEntrega:$('DUE').value,unidade:$('UNIT').value,responsavelId:$('RESP').value});const falhas=[];for(const f of PEND){try{await subirAnexo(nova.id,f)}catch(x){falhas.push(e(f.name)+': '+x.message)}}PEND=[];pintarPendentes();fechar();await load();if(falhas.length)alert('Tarefa criada, mas '+falhas.length+' anexo(s) não subiram:\n'+falhas.join('\n'))}
async function mover(){if($('STATUS').value==='CONCLUIDA')return concluir();await req('/api/tarefas/'+O.id+'/status',{status:$('STATUS').value},'PATCH');await load();openT(O.id)}
async function concluir(){if(!confirm('Confirmar a finalização desta tarefa? Se necessário, você poderá reabri-la depois.'))return;await req('/api/tarefas/'+O.id+'/concluir');fechar();load()}
async function arquivar(){if(!confirm('Remover esta tarefa concluída da sua lista? O histórico ficará preservado para auditoria.'))return;await req('/api/tarefas/'+O.id,undefined,'DELETE');fechar();load()}
async function salvarDatas(){if(!O)return;try{await req('/api/tarefas/'+O.id+'/datas',{dataInicio:$('DINI').value,dataEntrega:$('DFIM').value},'PATCH');await load();openT(O.id)}catch(x){alert(x.message);openT(O.id)}}
async function tirarAnexo(anexoId,nome){if(!confirm('Remover o anexo "'+nome+'"? O arquivo é apagado e não dá para desfazer.'))return;try{await req('/api/tarefas/'+O.id+'/anexos/'+encodeURIComponent(anexoId),undefined,'DELETE');await load();openT(O.id)}catch(x){alert(x.message)}}
async function coment(){if(!$('TXT').value.trim())return;await req('/api/tarefas/'+O.id+'/comentarios',{texto:$('TXT').value});await load();openT(O.id)}
async function verAnexo(i){const r=await fetch('/api/tarefas/'+O.id+'/anexos/'+i);if(!r.ok)throw Error('Não foi possível abrir o anexo.');const u=URL.createObjectURL(await r.blob());window.open(u,'_blank')}
function selecionar(id,marcado){marcado?S.add(id):S.delete(id);$('BULK').classList.toggle('show',S.size>0);$('SEL').textContent=S.size+' selecionada(s)'}function limparSelecao(){S.clear();$('BULK').classList.remove('show');load()}async function lote(status){if(!S.size)return;if(status==='CONCLUIDA'&&!confirm('Concluir as tarefas selecionadas?'))return;const r=await req('/api/tarefas/status-lote',{ids:[...S],status},'PATCH');const falhas=r.resultado.filter(x=>!x.ok);S.clear();$('BULK').classList.remove('show');await load();if(falhas.length)alert(falhas.length+' tarefa(s) não puderam ser alteradas.')}
let PEND=[];const LIMITE_ANEXO=10*1024*1024;
async function subirAnexo(id,file){const f=new FormData();f.append('anexo',file,file.name||'print.png');const r=await fetch('/api/tarefas/'+id+'/anexos',{method:'POST',body:f}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível enviar o anexo.');return d}
async function anexar(file){if(!O||!file)return;await subirAnexo(O.id,file);await load();openT(O.id)}
function pintarPendentes(){$('ANXNEW').innerHTML=PEND.map((f,i)=>`<span class="anexo-item"><span class="anexo-nome">📎 ${e(f.name||'print.png')}</span><button type="button" class="btn danger anexo-x" title="Remover anexo" onclick="tirarPendente(${i})">×</button></span>`).join('')}
function tirarPendente(i){PEND.splice(i,1);pintarPendentes()}
function guardarPendentes(lista){for(const f of [...(lista||[])]){if(PEND.length>=5)return alert('Máximo de 5 anexos por tarefa nova.');if(f.size>LIMITE_ANEXO)return alert('O arquivo "'+f.name+'" tem '+(f.size/1048576).toFixed(1)+' MB. O limite é 10 MB.');PEND.push(f)}pintarPendentes()}
$('FILE').addEventListener('change',()=>anexar($('FILE').files[0]).catch(x=>alert(x.message)));$('DROP').addEventListener('dragover',e=>e.preventDefault());$('DROP').addEventListener('drop',e=>{e.preventDefault();anexar(e.dataTransfer.files[0]).catch(x=>alert(x.message))});
$('FILENEW').addEventListener('change',()=>{guardarPendentes($('FILENEW').files);$('FILENEW').value=''});$('DROPNEW').addEventListener('dragover',e=>e.preventDefault());$('DROPNEW').addEventListener('drop',e=>{e.preventDefault();guardarPendentes(e.dataTransfer.files)});
// Ctrl+V cai no formulario aberto: tarefa nova guarda na fila, tarefa ja
// existente sobe na hora
document.addEventListener('paste',ev=>{if(!$('M').classList.contains('show'))return;const f=[...(ev.clipboardData?.files||[])][0];if(!f)return;ev.preventDefault();if(!$('NEW').hidden)return guardarPendentes([f]);if(O)anexar(f).catch(x=>alert(x.message))});
Promise.all([contexto(),load()]).catch(x=>alert(x.message));
</script><script src="/recolher.js"></script><script src="/nav-menu.js"></script>
</body></html>
