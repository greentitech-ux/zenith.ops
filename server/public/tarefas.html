11px}.col h2{font-size:13px;margin:2px 0 12px}.col>div{max-height:510px;overflow-y:auto;padding-right:3px}.board,.col>div,.dialog,.checklist{scrollbar-width:thin;scrollbar-color:transparent transparent}.board:hover,.col:hover>div,.dialog:hover,.checklist:hover{scrollbar-color:var(--line) transparent}.board::-webkit-scrollbar,.col>div::-webkit-scrollbar,.dialog::-webkit-scrollbar,.checklist::-webkit-scrollbar{width:6px;height:6px}.board::-webkit-scrollbar-track,.col>div::-webkit-scrollbar-track,.dialog::-webkit-scrollbar-track,.checklist::-webkit-scrollbar-track{background:transparent}.board::-webkit-scrollbar-thumb,.col>div::-webkit-scrollbar-thumb,.dialog::-webkit-scrollbar-thumb,.checklist::-webkit-scrollbar-thumb{background:transparent;border-radius:999px}.board:hover::-webkit-scrollbar-thumb,.col:hover>div::-webkit-scrollbar-thumb,.dialog:hover::-webkit-scrollbar-thumb,.checklist:hover::-webkit-scrollbar-thumb{background:var(--line)}.board::-webkit-scrollbar-thumb:hover,.col>div::-webkit-scrollbar-thumb:hover,.dialog::-webkit-scrollbar-thumb:hover,.checklist::-webkit-scrollbar-thumb:hover{background:var(--muted)}.count{color:var(--muted);font:11px var(--mono)}.task{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;cursor:pointer;transition:border-color .15s}.task:hover{border-color:var(--accent)}.task b{display:block;line-height:1.3;overflow-wrap:anywhere}.task .meta{margin-top:5px;overflow-wrap:anywhere}.task-top{display:flex;gap:7px;align-items:start}.task-check{width:auto;margin:2px 0 0;flex:none;accent-color:var(--accent)}.tag{display:inline-block;margin-top:7px;padding:2px 6px;border-radius:999px;background:rgba(184,255,60,.14);color:var(--accent);font:10px var(--mono)}.late{color:var(--bad)}.empty{color:var(--muted);font-size:12px;padding:14px 2px}.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.bulk.show{display:flex}.presets{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.preset-btn{font-family:var(--mono);font-size:10.5px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}.preset-btn:hover{color:var(--text);border-color:var(--accent)}.preset-btn.active{color:#0b0d10;background:var(--accent);border-color:var(--accent);font-weight:600}.task-check{display:none}body.sel-on .task-check{display:inline-block}.ficha{border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;display:grid;gap:7px}.ficha-linha{display:flex;justify-content:space-between;gap:14px;font-size:12px;line-height:1.4}.ficha-linha span{color:var(--muted);flex:none}.ficha-linha b{text-align:right;overflow-wrap:anywhere}.checklist{max-height:132px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 12px;display:grid;gap:6px}.checklist label{display:flex;gap:8px;align-items:center;font-size:12px;cursor:pointer}.checklist input{width:auto;margin:0;accent-color:var(--accent)}.link-btn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}.link-btn:hover{color:var(--accent)}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}input,textarea,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 12px;font:inherit}textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comment{border-bottom:1px solid var(--line);padding:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.info{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;line-height:1.55}.anexos{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.anexos a{color:var(--accent);font-size:12px}.anexo-item{display:inline-flex;align-items:center;gap:0}.anexo-item .btn{border-top-right-radius:0;border-bottom-right-radius:0}.anexo-x{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding:9px 10px;font-weight:900}.anexo-nome{border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;padding:9px 12px;font-size:12px;background:var(--panel2)}.link-ticket{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}.link-ticket:hover{border-bottom-style:solid}.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:12px;margin:10px 0;cursor:pointer}@media(max-width:1180px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filter-dates{grid-column:span 2}.summary{border-left:0;border-top:1px solid var(--line);padding:9px 0 0}}@media(max-width:700px){main{padding:18px 12px}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.filter-dates{grid-column:1/-1}.summary{grid-column:1/-1;width:100%}}@media(max-width:390px){.filters{grid-template-columns:1fr}.filter-dates{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}}

<body>
  <button class="hamburger-btn" id="btn-menu" aria-label="Abrir menu">☰</button>
  <main>
    <div class="top"><div><div id="date" class="meta"></div><h1>Meu Dia</h1><div class="meta">Priorize, acompanhe e conclua tarefas sem perder o vínculo com os tickets.</div></div><span style="display:flex;gap:8px;flex-wrap:wrap"><button id="SELMODE" class="btn" onclick="alternarSelecao()">☑ Selecionar</button><button id="CREATE" class="btn primary" onclick="novo()">＋ Criar tarefa</button></span></div>
    <div class="filters"><div class="filter-field"><span class="filter-label">Situação</span><select id="F-SIT" onchange="render()"><option value="abertas">Em aberto</option><option value="pendentes">Pendentes</option><option value="concluidas">Concluídas</option><option value="todas">Todas</option></select></div><div class="filter-field"><span class="filter-label">Tipo</span><select id="F-TIPO" onchange="render()"><option value="">Todos</option></select></div><div class="filter-field"><span class="filter-label">Grupo</span><select id="F-GRUPO" onchange="aoMudarGrupo()"><option value="">Todos</option></select></div><div class="filter-field"><span class="filter-label">Unidade</span><select id="F-UNI" onchange="render()"><option value="">Todas</option></select></div><div class="filter-dates" role="group" aria-label="Período"><label class="filter-field"><span class="filter-label">De</span><input type="date" id="F-DE" onchange="aoMudarData()"></label><label class="filter-field"><span class="filter-label">Até</span><input type="date" id="F-ATE" onchange="aoMudarData()"></label></div><div id="SUMMARY" class="summary"></div></div>
    <div class="presets" id="PRESETS"></div><div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><button type="button" class="link-btn" onclick="limparFiltros()">Limpar filtros</button><button type="button" class="link-btn" onclick="pdfDaLista(false)">👁 Ver relatório do filtro</button><button type="button" class="link-btn" onclick="pdfDaLista(true)">⬇ Baixar relatório</button></div>
    <div id="BULK" class="bulk"><span id="SEL" class="meta"></span><button class="btn" onclick="lote('EM_ANDAMENTO')">Em andamento</button><button class="btn primary" onclick="lote('CONCLUIDA')">Concluir selecionadas</button><button class="btn" onclick="limparSelecao()">Limpar</button></div><div class="board">
      <section class="col"><h2>Pendentes <span id="NP" class="count"></span></h2><div id="P"></div></section>
      <section class="col"><h2>A fazer <span id="NF" class="count"></span></h2><div id="F"></div></section>
      <section class="col"><h2>Hoje <span id="NH" class="count"></span></h2><div id="H"></div></section>
      <section class="col"><h2>Em andamento <span id="NA" class="count"></span></h2><div id="A"></div></section>
      <section class="col"><h2>Futuras <span id="NU" class="count"></span></h2><div id="U"></div></section>
      <section class="col"><h2>Concluídas <span id="NC" class="count"></span></h2><div id="C"></div></section>
    </div>
  </main>
  <div class="modal" id="M"><div class="dialog"><div class="row"><b id="MH">Tarefa</b><button class="close" onclick="fechar()" aria-label="Fechar">×</button></div>
    <div id="NEW"><input id="TITLE" maxlength="200" placeholder="Título da tarefa"><textarea id="DESC" rows="4" maxlength="2000" placeholder="Contexto, próximo passo ou resultado esperado"></textarea><div class="grid2"><label class="meta">Data de início<input id="START" type="date"></label><label class="meta">Previsão de conclusão<input id="DUE" type="date"></label></div><label class="meta">Unidade (opcional)<select id="UNIT" onchange="atualizarResponsaveis()"><option value="">Tarefa pessoal</option></select></label><label id="RESPROW" class="meta" hidden>Responsável<select id="RESP" onchange="montarColabs()"></select></label><label class="meta" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="OCOR" style="width:auto;margin:0;accent-color:var(--accent)"> Registrar como <b>ocorrência</b> (situação que já aconteceu, vira PDF de registro)</label><div id="COLABROW" class="meta" hidden>Quem participa (comenta, anexa e muda o status)<div id="COLAB" class="checklist"></div></div><label id="DROPNEW" class="drop">📎 Anexar print ou PDF (opcional) · clique, arraste ou cole com Ctrl+V<input id="FILENEW" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" multiple hidden></label><div id="ANXNEW" class="anexos"></div><button class="btn primary" onclick="criar()">Criar tarefa</button></div>
    <div id="DET" hidden><div id="INFO" class="info"></div><div id="FICHA"></div><div class="grid2"><label class="meta">Data de início<input id="DINI" type="date" onchange="salvarDatas()"></label><label class="meta">Previsão de conclusão<input id="DFIM" type="date" onchange="salvarDatas()"></label></div><label class="meta">Status<select id="STATUS" onchange="mover()"><option value="PENDENTE">Pendente</option><option value="A_FAZER">A fazer</option><option value="HOJE">Hoje</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select></label><div class="actions"><button id="BTNCON" class="btn primary" onclick="concluir()">✓ Concluir tarefa</button><button id="BTNSOL" class="btn" onclick="virarSolicitacao()" hidden>🧾 Converter em solicitação</button><button id="BTNFOR" class="btn" onclick="virarFormulario()" hidden>📄 Criar formulário</button><button class="btn" onclick="pdfDaTarefa(false)">👁 Ver PDF</button><button class="btn" onclick="pdfDaTarefa(true)">⬇ Baixar PDF</button><button id="BTNDL" class="btn danger" onclick="arquivar()" hidden>Remover concluída</button></div><div id="GEROU" class="meta"></div><div id="EQUIPE" class="meta"></div><h3>Anexos</h3><div id="ANX" class="anexos"></div><label id="DROP" class="drop">📎 Anexar print ou PDF · clique, arraste ou cole com Ctrl+V<input id="FILE" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" hidden></label><h3>Comentários</h3><div id="COM"></div><textarea id="TXT" rows="3" maxlength="2000" placeholder="Registre uma atualização para o histórico..."></textarea><button class="btn" onclick="coment()">Adicionar comentário</button></div>
  </div></div>
  <div class="modal" id="PWD" style="z-index:10"><div class="dialog" style="width:min(420px,100%)"><div class="row"><b>Confirmar conclusão</b><button class="close" onclick="fecharSenha()" aria-label="Fechar">×</button></div>
    <div id="PWDTXT" class="meta"></div><label class="meta">Sua senha<input id="PWDIN" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')confirmarSenha()"></label><div id="PWDERR" class="meta" style="color:var(--bad)"></div><button class="btn primary" onclick="confirmarSenha()">Confirmar e concluir</button>
  </div></div>
<script>
let T=localStorage.getItem('authToken'),L=[],O,CTX={unidades:[]},S=new Set;if(!T)location='/';const raw=fetch.bind(window);window.fetch=(u,o={})=>raw(u,{...o,headers:{...(o.headers||{}),...(String(u).startsWith('/api/')?{Authorization:'Bearer '+T}:{})}});const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{const z=new Date(d),p=n=>String(n).padStart(2,'0');return z.getFullYear()+'-'+p(z.getMonth()+1)+'-'+p(z.getDate())};const FUSO_BR='America/Sao_Paulo';
// Date "falso" cujos getters locais ja refletem o horario de Sao Paulo (mesmo
// helper de saidas.html/fechamentos.html): num navegador fora do fuso, "Hoje"
// caia no dia errado
function agoraBrasilia(){const partes=new Intl.DateTimeFormat('en-US',{timeZone:FUSO_BR,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());const o={};partes.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});const h=o.hour==='24'?'00':o.hour;return new Date(`${o.year}-${o.month}-${o.day}T${h}:${o.minute}:${o.second}`)}
const hoje=()=>iso(agoraBrasilia());const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'';
function faixa(t){if(t.status==='CONCLUIDA')return'C';if(t.status==='EM_ANDAMENTO')return'A';const prazo=t.dataEntrega||'';if(prazo&&prazo<hoje())return'P';if(t.status==='PENDENTE')return'P';if(prazo===hoje()||t.status==='HOJE')return'H';if((prazo&&prazo>hoje())||(t.dataInicio&&t.dataInicio>hoje()))return'U';return'F'}
function dataRef(t){return String(t.concluidaEm||t.dataEntrega||t.dataInicio||t.criadaEm||'').slice(0,10)}
// preset vazio = sem recorte de data (é como a tela abria antes: "Em aberto"
// mostrava tudo, independente de quando a tarefa era)
let presetAtivo='tudo';
const PRESETS=[['tudo','Tudo'],['hoje','Hoje'],['ontem','Ontem'],['semana','Semana'],['mes','Mês']];
function calcularPreset(tipo,refIso){const ref=new Date(refIso+'T12:00:00');
  if(tipo==='hoje')return{inicio:refIso,fim:refIso};
  if(tipo==='ontem'){const o=new Date(ref);o.setDate(o.getDate()-1);return{inicio:iso(o),fim:iso(o)}}
  if(tipo==='semana'){const i=new Date(ref);i.setDate(i.getDate()-((i.getDay()+6)%7));const f=new Date(i);f.setDate(f.getDate()+6);return{inicio:iso(i),fim:iso(f)}}
  if(tipo==='mes')return{inicio:iso(new Date(ref.getFullYear(),ref.getMonth(),1)),fim:iso(new Date(ref.getFullYear(),ref.getMonth()+1,0))};
  return{inicio:'',fim:''}}
function montarPresets(){$('PRESETS').innerHTML=PRESETS.map(([t,l])=>`<button type="button" class="preset-btn${t===presetAtivo?' active':''}" data-tipo="${t}">${l}</button>`).join('');$('PRESETS').querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>aplicarPreset(b.dataset.tipo)))}
function aplicarPreset(tipo){presetAtivo=tipo;document.querySelectorAll('#PRESETS .preset-btn').forEach(b=>b.classList.toggle('active',b.dataset.tipo===tipo));const r=calcularPreset(tipo,hoje());$('F-DE').value=r.inicio;$('F-ATE').value=r.fim;render()}
// mexer no De/Até à mão desmarca o preset - senão a tela mostraria "Mês" aceso
// com um intervalo que não é o mês
function aoMudarData(){presetAtivo=null;document.querySelectorAll('#PRESETS .preset-btn').forEach(b=>b.classList.remove('active'));render()}
function aoMudarGrupo(){montarUnidades();render()}
function limparFiltros(){$('F-SIT').value='abertas';$('F-GRUPO').value='';$('F-TIPO').value='';montarUnidades();aplicarPreset('tudo')}
function montarUnidades(){const g=$('F-GRUPO').value,atual=$('F-UNI').value;const lista=((CTX.unidades)||[]).filter(u=>!g||u.grupo===g);$('F-UNI').innerHTML='<option value="">Todas</option><option value="__pessoal">Tarefa pessoal (sem unidade)</option>'+lista.map(u=>`<option value="${e(u.codigo)}">${e(u.nome)}</option>`).join('');$('F-UNI').value=lista.some(u=>u.codigo===atual)||atual==='__pessoal'?atual:''}
function passaSituacao(t){const v=$('F-SIT').value;if(v==='abertas')return t.status!=='CONCLUIDA';if(v==='pendentes')return faixa(t)==='P';if(v==='concluidas')return t.status==='CONCLUIDA';return true}
// tipo do ticket que gerou a tarefa (ver TIPO_TICKET) - tarefa avulsa nao tem
const tipoDaTarefa=t=>String((t.vinculo&&(t.vinculo.ticketTipo||t.vinculo.tipo))||'');
function passaTipo(t){const v=$('F-TIPO').value;if(!v)return true;if(v==='__ocorrencia')return !!t.ehOcorrencia;if(v==='__sem')return !t.vinculo;return tipoDaTarefa(t)===v}
function passaData(t){const de=$('F-DE').value,ate=$('F-ATE').value;if(!de&&!ate)return true;const ref=dataRef(t);if(!ref)return false;return(!de||ref>=de)&&(!ate||ref<=ate)}
function passaUnidade(t){const u=$('F-UNI').value,g=$('F-GRUPO').value;if(u==='__pessoal')return !t.unidade;if(u)return t.unidade===u;if(g)return((CTX.unidades)||[]).some(x=>x.codigo===t.unidade&&x.grupo===g);return true}
function noFiltro(t){return passaSituacao(t)&&passaData(t)&&passaUnidade(t)&&passaTipo(t)}
// o seletor lista so os tipos que EXISTEM na lista carregada, mesmo criterio do
// filtro de loja em saidas.html: oferecer "Desvio de estoque" quando nao ha
// nenhuma so faz clicar e nao achar nada
function montarTipos(){const atual=$('F-TIPO').value;const vistos=new Map();L.forEach(t=>{const k=tipoDaTarefa(t);if(k&&TIPO_TICKET[k])vistos.set(k,TIPO_TICKET[k])});const avulsas=L.some(t=>!t.vinculo);const ocorrencias=L.some(t=>t.ehOcorrencia);const opcoes=[...vistos].sort((a,b)=>a[1].localeCompare(b[1],'pt-BR'));$('F-TIPO').innerHTML='<option value="">Todos</option>'+(ocorrencias?'<option value="__ocorrencia">Ocorrência (registro)</option>':'')+(avulsas?'<option value="__sem">Sem ticket (tarefa avulsa)</option>':'')+opcoes.map(([k,v])=>`<option value="${e(k)}">${e(v)}</option>`).join('');$('F-TIPO').value=vistos.has(atual)||(atual==='__sem'&&avulsas)||(atual==='__ocorrencia'&&ocorrencias)?atual:''}
function tituloVisivel(x){const t=String(x?.titulo||x||'Tarefa');return /^Login bloqueado:\s*\S+@\S+$/i.test(t)?'Login bloqueado':t}
function numeroDaTarefa(t){return t.numeroTicket??t.vinculo?.numeroTicket??null}
function protocoloDaTarefa(t){const numero=numeroDaTarefa(t);if(numero==null)return'';const virou=!!t.solicitacaoId||(t.gerou||[]).some(g=>g.tipo==='solicitacao'&&String(g.numeroTicket)===String(numero));return virou||t.vinculo?.id?linkTicket(numero):`<span class="tag">🎫 #${e(numero)}</span>`}
function card(x){const f=faixa(x),prazo=x.dataEntrega?` · previsão ${x.dataEntrega.split('-').reverse().join('/')}`:'';const origem=protocoloDaTarefa(x)?protocoloDaTarefa(x)+' · ':'';const tipoT=rotuloTicket(x.vinculo);return`<div class="task" onclick="openT('${x.id}')"><div class="task-top"><input class="task-check" onclick="event.stopPropagation()" onchange="selecionar('${x.id}',this.checked)" type="checkbox" ${S.has(x.id)?'checked':''}><b>${e(tituloVisivel(x))}</b></div><div class="meta">${origem}${tipoT?e(tipoT)+' · ':''}${e(x.unidadeNome||'Pessoal')}${prazo}</div><div class="meta">Criada por ${e(x.criadoPorNome||'Usuário')} · atribuída a ${e(x.responsavelNome||'Usuário')}</div>${x.ehOcorrencia?'<span class="tag">ocorrência</span> ':''}${f==='P'?'<span class="tag late">previsão vencida</span>':''}</div>`}
// o numero do ticket leva ate a solicitacao na Central (mesmo destino que
// compras.html usa) - a Central acha o card pelo numero e ja abre o detalhe
// Rótulo do tipo do ticket. São os MESMOS labels de TIPOS_INFO em
// central-historico.html - o testeRotas.js compara os dois e reprova se
// divergirem, pra esta tela não inventar um nome próprio pro que a Central
// já chama de outro jeito.
const TIPO_TICKET={'estorno':'Estorno','ajuste-fechamento':'Ajuste de fechamento','compra':'Compra','manutencao':'Manutenção','suporte-ti':'Suporte de TI','pagamento':'Pagamento','nota':'Nota','quebra-caixa':'Quebra de caixa','desvio-estoque':'Desvio de estoque','acesso-pessoa':'Acesso de pessoa','adiantamento':'Adiantamento'};
const rotuloTicket=v=>TIPO_TICKET[String((v&&(v.ticketTipo||v.tipo))||'')]||'';
function linkTicket(numero){return `<a class="link-ticket" href="/central-historico.html?ticket=${encodeURIComponent(numero)}" onclick="event.stopPropagation()">Ticket #${e(numero)}</a>`}
// O nome do anexo NAO pode entrar no onclick: vinha como JSON.stringify(...),
// que emite aspas DUPLAS dentro de um atributo delimitado por aspas duplas - o
// atributo fechava no meio e o onclick virava `tirarAnexo('id',`, erro de
// sintaxe e clique morto. Só o id (hexadecimal, sem aspas possíveis) vai pro
// HTML; o nome sai de O.anexos na hora de confirmar.
function botaoAnexo(a,i){return `<span class="anexo-item"><button class="btn" onclick="verAnexo(${i})">📎 ${e(a.nome||'anexo')}</button>${a.id?`<button class="btn danger anexo-x" title="Remover anexo" onclick="tirarAnexo('${e(a.id)}')">×</button>`:''}</span>`}
function put(id,n,s){$(id).innerHTML=s.length?s.map(card).join(''):'<div class="empty">Nenhuma tarefa.</div>';$('N'+n).textContent=s.length?'('+s.length+')':''}
function elegiveis(unidade){return((CTX.responsaveis)||[]).filter(u=>!unidade||(u.unidades||[]).includes(unidade))}
function atualizarResponsaveis(){const unidade=$('UNIT').value;$('RESP').innerHTML=elegiveis(unidade).map(u=>`<option value="${e(u.id)}">${e(u.nome)}</option>`).join('')||'<option value="">Nenhum usuário disponível</option>';montarColabs()}
// quem participa sai da MESMA lista do responsável (a rota valida de novo no
// servidor) - menos o próprio responsável, que já é o dono
function montarColabs(){const dono=$('RESP').value,marcados=new Set([...$('COLAB').querySelectorAll('input:checked')].map(i=>i.value));const lista=elegiveis($('UNIT').value).filter(u=>u.id!==dono);$('COLAB').innerHTML=lista.map(u=>`<label><input type="checkbox" value="${e(u.id)}"${marcados.has(u.id)?' checked':''}>${e(u.nome)}</label>`).join('')||'<span class="empty">Nenhum outro usuário nessa unidade.</span>';$('COLABROW').hidden=!CTX.podeAtribuir||!lista.length}
const colabsMarcados=()=>[...$('COLAB').querySelectorAll('input:checked')].map(i=>i.value)
async function contexto(){const r=await fetch('/api/tarefas/contexto');CTX=await r.json();CTX.eu=CTX.eu||'';$('UNIT').innerHTML='<option value="">Tarefa pessoal</option>'+((CTX.unidades)||[]).map(u=>`<option value="${e(u.codigo)}">${e(u.nome)}</option>`).join('');$('F-GRUPO').innerHTML='<option value="">Todos</option>'+((CTX.redes)||[]).map(g=>`<option value="${e(g.id)}">${e(g.nome)}</option>`).join('');montarUnidades();atualizarResponsaveis();$('RESPROW').hidden=!CTX.podeAtribuir;$('CREATE').hidden=!CTX.podeCriar}
function render(){const vis=L.filter(noFiltro),gr=k=>vis.filter(x=>faixa(x)===k);put('P','P',gr('P'));put('F','F',gr('F'));put('H','H',gr('H'));put('A','A',gr('A'));put('U','U',gr('U'));put('C','C',gr('C'));$('SUMMARY').textContent=vis.length+' tarefa(s) no filtro';$('date').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(agoraBrasilia())}
async function load(){let r=await fetch('/api/tarefas/minhas');let d=await r.json();if(!r.ok)throw Error(d.error);L=d;montarTipos();render()}
function novo(){O=null;$('MH').textContent='Nova tarefa';$('NEW').hidden=false;$('DET').hidden=true;$('TITLE').value='';$('DESC').value='';$('START').value=hoje();$('DUE').value='';$('UNIT').value='';$('OCOR').checked=false;PEND=[];pintarPendentes();$('COLAB').innerHTML='';atualizarResponsaveis();$('M').classList.add('show')}
function fechar(){$('M').classList.remove('show')}
function openT(id){O=L.find(x=>x.id===id);if(!O)return;$('MH').textContent=(O.ehOcorrencia?'📌 ':'')+tituloVisivel(O);$('NEW').hidden=true;$('DET').hidden=false;const ticket=protocoloDaTarefa(O)?protocoloDaTarefa(O)+' · ':'';const tipoT=rotuloTicket(O.vinculo);const feito=O.concluidaEm?'<br>Concluída por <b>'+e(O.concluidaPorNome||'Usuário')+'</b> em '+fmt(O.concluidaEm):'';$('INFO').innerHTML=ticket+(tipoT?'<b>'+e(tipoT)+'</b> · ':'')+'<span class="nome-unidade">'+e(O.unidadeNome||'Tarefa pessoal')+'</span><br>Criada por <b>'+e(O.criadoPorNome||'Usuário')+'</b> em '+fmt(O.criadaEm)+feito;$('DINI').value=O.dataInicio||'';$('DFIM').value=O.dataEntrega||'';$('DINI').disabled=$('DFIM').disabled=O.status==='CONCLUIDA'||!O.podeGerir;pintarEquipe();$('STATUS').value=O.status;$('BTNCON').hidden=O.status==='CONCLUIDA';$('BTNDL').hidden=O.status!=='CONCLUIDA';$('BTNSOL').hidden=!CTX.podeSolicitacao||O.status==='CONCLUIDA'||!!O.solicitacaoId||!!O.vinculo?.id;$('BTNFOR').hidden=!CTX.podeFormulario||O.status==='CONCLUIDA';pintarGerou();$('ANX').innerHTML=(O.anexos||[]).map(botaoAnexo).join('')||'<span class="empty">Sem anexos.</span>';$('COM').innerHTML=(O.comentarios||[]).map(x=>`<div class="comment"><b>${e(x.porNome||'Usuário')}</b> · ${fmt(x.em)}<br>${e(x.texto)}</div>`).join('')||'<div class="empty">Sem comentários.</div>';$('TXT').value='';$('M').classList.add('show');carregarFicha(O.id)}
// O dado do ticket (cliente, valor, forma de pagamento) NÃO é copiado pra
// dentro da tarefa: é lido do ticket quando o detalhe abre - 1 documento, só
// quando alguém abre. Cópia criaria uma segunda versão que envelhece assim que
// o ticket muda. Vem depois da janela abrir, pra não segurar o clique.
async function carregarFicha(id){$('FICHA').innerHTML='';if(!O||!O.vinculo)return;try{const r=await fetch('/api/tarefas/'+id+'/ticket');if(!r.ok)return;const d=await r.json();if(!O||O.id!==id||!(d.campos||[]).length)return;$('FICHA').innerHTML='<div class="ficha">'+d.campos.map(c=>`<div class="ficha-linha"><span>${e(c.rotulo)}</span><b>${e(c.valor)}</b></div>`).join('')+'</div>'}catch(x){}}
async function req(u,b,m='POST'){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir a ação.');return d}
// a tarefa so ganha id depois de criada, entao o anexo escolhido no formulario
// fica na memoria e sobe logo em seguida, um POST por arquivo
async function criar(){if(!$('TITLE').value.trim())return alert('Informe o título da tarefa.');const nova=await req('/api/tarefas',{titulo:$('TITLE').value,descricao:$('DESC').value,dataInicio:$('START').value,dataEntrega:$('DUE').value,unidade:$('UNIT').value,responsavelId:$('RESP').value,colaboradoresIds:colabsMarcados(),ehOcorrencia:$('OCOR').checked});const falhas=[];for(const f of PEND){try{await subirAnexo(nova.id,f)}catch(x){falhas.push(e(f.name)+': '+x.message)}}PEND=[];pintarPendentes();fechar();await load();if(falhas.length)alert('Tarefa criada, mas '+falhas.length+' anexo(s) não subiram:\n'+falhas.join('\n'))}
async function mover(){if($('STATUS').value==='CONCLUIDA')return concluir();await req('/api/tarefas/'+O.id+'/status',{status:$('STATUS').value},'PATCH');await load();openT(O.id)}
async function concluir(){const senha=await pedirSenha('Finalizar "'+tituloVisivel(O)+'". Sua senha registra quem concluiu; dá pra reabrir depois se precisar.');if(!senha)return openT(O.id);try{await req('/api/tarefas/'+O.id+'/concluir',{password:senha});fechar();load()}catch(x){alert(x.message);openT(O.id)}}
async function arquivar(){if(!confirm('Remover esta tarefa concluída da sua lista? O histórico ficará preservado para auditoria.'))return;await req('/api/tarefas/'+O.id,undefined,'DELETE');fechar();load()}
// prazo e "quem participa" são do dono da tarefa; participante comenta,
// anexa e move o status (ver podeParticipar em tarefas.js)
// distribuir é diferente de executar: quem distribui (Master, Admin, gerente)
// e o próprio responsável trocam o responsável e chamam participantes
const podeDistribuir=()=>!!CTX.podeAtribuir||(!!O&&O.responsavelId===(CTX.eu||''));
function pintarEquipe(){const eq=O.colaboradores||[];const nomes=eq.length?eq.map(x=>e(x.nome)).join(', '):'ninguém além do responsável';const editar=O.podeGerir&&podeDistribuir()?` · <button type="button" class="link-btn" onclick="abrirEquipe()">alterar</button>`:'';const trocar=O.podeGerir&&podeDistribuir()&&O.status!=='CONCLUIDA'?` · <button type="button" class="link-btn" onclick="abrirResponsavel()">trocar</button>`:'';$('EQUIPE').innerHTML=`<b>Responsável:</b> ${e(O.responsavelNome||'Usuário')}${trocar}<br><b>Participam:</b> ${nomes}${editar}`+(O.podeGerir?'':'<br><span class="empty">Você participa desta tarefa: pode comentar, anexar e mudar o status. Prazo, participantes e remoção ficam com o responsável.</span>')}
function abrirResponsavel(){const lista=elegiveis(O.unidade||'');if(!lista.length)return alert('Não há usuário com acesso a essa unidade.');$('EQUIPE').innerHTML=`<b>Quem fica responsável</b><select id="NOVORESP">${lista.map(u=>`<option value="${e(u.id)}"${u.id===O.responsavelId?' selected':''}>${e(u.nome)}</option>`).join('')}</select><button type="button" class="btn" onclick="salvarResponsavel()">Salvar responsável</button>`}
async function salvarResponsavel(){try{await req('/api/tarefas/'+O.id+'/responsavel',{responsavelId:$('NOVORESP').value},'PATCH');await load();openT(O.id)}catch(x){alert(x.message);openT(O.id)}}
function abrirEquipe(){const atuais=new Set((O.colaboradores||[]).map(x=>x.id));const lista=elegiveis(O.unidade||'').filter(u=>u.id!==O.responsavelId);if(!lista.length)return alert('Não há outro usuário com acesso a essa unidade.');$('EQUIPE').innerHTML=`<b>Quem participa</b><div class="checklist">${lista.map(u=>`<label><input type="checkbox" data-eq value="${e(u.id)}"${atuais.has(u.id)?' checked':''}>${e(u.nome)}</label>`).join('')}</div><button type="button" class="btn" onclick="salvarEquipe()">Salvar participantes</button>`}
async function salvarEquipe(){const ids=[...$('EQUIPE').querySelectorAll('input[data-eq]:checked')].map(i=>i.value);try{await req('/api/tarefas/'+O.id+'/colaboradores',{colaboradoresIds:ids},'PATCH');await load();openT(O.id)}catch(x){alert(x.message)}}
// Concluir é o registro de que a pessoa fez o serviço, e a máquina da loja é
// compartilhada: a senha diz QUEM está finalizando. Mesma reautenticação do
// estorno e da sangria (auth.verifyPassword). Campo mascarado próprio, não
// prompt() - o prompt do navegador mostra o que se digita.
let RESOLVE_SENHA=null;
function pedirSenha(texto){$('PWDTXT').textContent=texto;$('PWDIN').value='';$('PWDERR').textContent='';$('PWD').classList.add('show');setTimeout(()=>$('PWDIN').focus(),30);return new Promise(r=>{RESOLVE_SENHA=r})}
function fecharSenha(){$('PWD').classList.remove('show');const r=RESOLVE_SENHA;RESOLVE_SENHA=null;if(r)r(null)}
function confirmarSenha(){const v=$('PWDIN').value;if(!v){$('PWDERR').textContent='Digite sua senha.';return}$('PWD').classList.remove('show');const r=RESOLVE_SENHA;RESOLVE_SENHA=null;if(r)r(v)}
// A tarefa não vira ticket/formulário aqui dentro: leva o contexto pra tela
// que já sabe validar cada tipo (Central e Formulários), e aquela tela avisa
// de volta o que nasceu. Recriar os dois formulários aqui seria uma segunda
// versão das mesmas regras, que envelhece sozinha.
function contexto2(destino){const p=new URLSearchParams({tarefa:O.id,titulo:tituloVisivel(O)});if(O.unidade)p.set('unidade',O.unidade);if(O.descricao)p.set('descricao',O.descricao);return destino+(destino.includes('?')?'&':'?')+p.toString()}
function virarSolicitacao(){location.href=contexto2('/central.html?nova=1')}
function virarFormulario(){location.href=contexto2('/formularios.html')}
function pintarGerou(){const g=O.gerou||[];$('GEROU').innerHTML=!g.length?'':'<b>Gerou:</b> '+g.map(x=>x.tipo==='formulario'
  ?`<a class="link-ticket" href="/formularios.html">📄 ${e(x.rotulo||'Formulário')}</a>`
  :`<a class="link-ticket" href="/central-historico.html?ticket=${encodeURIComponent(x.numeroTicket||'')}">🧾 Ticket #${e(x.numeroTicket||'')}${x.rotulo?' · '+e(x.rotulo):''}</a>`).join(' · ')}
// Os dois PDFs abrem em ABA (blob) em vez de baixar direto: documento que vai
// virar registro se confere antes de guardar. "Baixar" força o arquivo. Passa
// por fetch porque o Authorization só existe no wrapper de fetch - abrir a URL
// direto no navegador daria 401.
async function baixarPdf(url, opcoes, baixar, nomeArquivo){
  const r = await fetch(url, opcoes);
  if(!r.ok){ let m='Não foi possível gerar o PDF.'; try{ m=(await r.json()).error||m }catch(x){} throw Error(m) }
  const u = URL.createObjectURL(await r.blob());
  if(baixar){ const a=document.createElement('a'); a.href=u; a.download=nomeArquivo; document.body.appendChild(a); a.click(); a.remove() }
  else if(!window.open(u,'_blank')) alert('O navegador bloqueou a aba do PDF. Libere os pop-ups desta página ou use "Baixar PDF".');
  setTimeout(()=>URL.revokeObjectURL(u), 60000);
}
function pdfDaTarefa(baixar){const nome=(O.ehOcorrencia?'ocorrencia':'tarefa')+'-'+O.id.slice(0,12)+'.pdf';baixarPdf('/api/tarefas/'+O.id+'/pdf'+(baixar?'?baixar=1':''),{},baixar,nome).catch(x=>alert(x.message))}
// o relatório é do QUE ESTÁ NA TELA: manda os ids do filtro atual e a
// descrição do filtro pro cabeçalho, pra o número do PDF bater com o da tela
function descricaoDoFiltro(){const nome=id=>{const el=$(id);return el.options[el.selectedIndex]?el.options[el.selectedIndex].text:''};const p=[nome('F-SIT')];const g=$('F-GRUPO').value?nome('F-GRUPO'):'';if(g)p.push('grupo '+g);const u=$('F-UNI').value?nome('F-UNI'):'';if(u)p.push(u);const t=$('F-TIPO').value?nome('F-TIPO'):'';if(t)p.push(t);const de=$('F-DE').value,ate=$('F-ATE').value;if(de||ate)p.push(`${de?de.split('-').reverse().join('/'):'início'} a ${ate?ate.split('-').reverse().join('/'):'hoje'}`);return p.join(' · ')}
function pdfDaLista(baixar){const ids=L.filter(noFiltro).map(t=>t.id);if(!ids.length)return alert('Nenhuma tarefa no filtro para gerar o relatório.');baixarPdf('/api/tarefas/relatorio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,filtro:descricaoDoFiltro()})},baixar,'meu-dia-relatorio.pdf').catch(x=>alert(x.message))}
async function salvarDatas(){if(!O)return;try{await req('/api/tarefas/'+O.id+'/datas',{dataInicio:$('DINI').value,dataEntrega:$('DFIM').value},'PATCH');await load();openT(O.id)}catch(x){alert(x.message);openT(O.id)}}
async function tirarAnexo(anexoId){const a=(O.anexos||[]).find(x=>x.id===anexoId);if(!confirm('Remover o anexo "'+((a&&a.nome)||'anexo')+'"? O arquivo é apagado e não dá para desfazer.'))return;try{await req('/api/tarefas/'+O.id+'/anexos/'+encodeURIComponent(anexoId),undefined,'DELETE');await load();openT(O.id)}catch(x){alert(x.message)}}
async function coment(){if(!$('TXT').value.trim())return;await req('/api/tarefas/'+O.id+'/comentarios',{texto:$('TXT').value});await load();openT(O.id)}
async function verAnexo(i){const r=await fetch('/api/tarefas/'+O.id+'/anexos/'+i);if(!r.ok)throw Error('Não foi possível abrir o anexo.');const u=URL.createObjectURL(await r.blob());window.open(u,'_blank')}
let MODO_SEL=false;
function alternarSelecao(){MODO_SEL=!MODO_SEL;if(!MODO_SEL)S.clear();document.body.classList.toggle('sel-on',MODO_SEL);$('BULK').classList.toggle('show',MODO_SEL);$('SELMODE').classList.toggle('primary',MODO_SEL);$('SELMODE').textContent=MODO_SEL?'✕ Sair da seleção':'☑ Selecionar';$('SEL').textContent=S.size+' selecionada(s)';render()}
function selecionar(id,marcado){marcado?S.add(id):S.delete(id);$('SEL').textContent=S.size+' selecionada(s)'}function limparSelecao(){S.clear();$('SEL').textContent='0 selecionada(s)';render()}async function lote(status){if(!S.size)return;let senha=null;if(status==='CONCLUIDA'){senha=await pedirSenha('Finalizar '+S.size+' tarefa(s) selecionada(s). Sua senha registra quem concluiu.');if(!senha)return}const r=await req('/api/tarefas/status-lote',{ids:[...S],status,password:senha},'PATCH');const falhas=r.resultado.filter(x=>!x.ok);S.clear();$('SEL').textContent='0 selecionada(s)';await load();if(falhas.length)alert(falhas.length+' tarefa(s) não puderam ser alteradas.')}
let PEND=[];const LIMITE_ANEXO=10*1024*1024;
async function subirAnexo(id,file){const f=new FormData();f.append('anexo',file,file.name||'print.png');const r=await fetch('/api/tarefas/'+id+'/anexos',{method:'POST',body:f}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível enviar o anexo.');return d}
async function anexar(file){if(!O||!file)return;await subirAnexo(O.id,file);await load();openT(O.id)}
function pintarPendentes(){$('ANXNEW').innerHTML=PEND.map((f,i)=>`<span class="anexo-item"><span class="anexo-nome">📎 ${e(f.name||'print.png')}</span><button type="button" class="btn danger anexo-x" title="Remover anexo" onclick="tirarPendente(${i})">×</button></span>`).join('')}
function tirarPendente(i){PEND.splice(i,1);pintarPendentes()}
function guardarPendentes(lista){for(const f of [...(lista||[])]){if(PEND.length>=5)return alert('Máximo de 5 anexos por tarefa nova.');if(f.size>LIMITE_ANEXO)return alert('O arquivo "'+f.name+'" tem '+(f.size/1048576).toFixed(1)+' MB. O limite é 10 MB.');PEND.push(f)}pintarPendentes()}
$('FILE').addEventListener('change',()=>anexar($('FILE').files[0]).catch(x=>alert(x.message)));$('DROP').addEventListener('dragover',e=>e.preventDefault());$('DROP').addEventListener('drop',e=>{e.preventDefault();anexar(e.dataTransfer.files[0]).catch(x=>alert(x.message))});
$('FILENEW').addEventListener('change',()=>{guardarPendentes($('FILENEW').files);$('FILENEW').value=''});$('DROPNEW').addEventListener('dragover',e=>e.preventDefault());$('DROPNEW').addEventListener('drop',e=>{e.preventDefault();guardarPendentes(e.dataTransfer.files)});
// Ctrl+V cai no formulario aberto: tarefa nova guarda na fila, tarefa ja
// existente sobe na hora
document.addEventListener('paste',ev=>{if(!$('M').classList.contains('show'))return;const f=[...(ev.clipboardData?.files||[])][0];if(!f)return;ev.preventDefault();if(!$('NEW').hidden)return guardarPendentes([f]);if(O)anexar(f).catch(x=>alert(x.message))});
