# Compila o agente Android.
#
# POR QUE EXISTE (este repositorio nao tem CI de proposito - ver CLAUDE.md §7,
# "sem CI, esse teste e a unica rede"): o servidor continua sem CI, e o
# testeRotas.js segue sendo a rede dele. Isto NAO toca no servidor - so roda
# quando algo em android/ muda. Existe porque o APK precisa de duas coisas que
# nao da pra fazer na mao:
#   1. um compilador de Kotlin/Android, que nao roda na maquina de quem escreve;
#   2. uma CHAVE DE ASSINATURA estavel, guardada fora do repositorio.
name: Agente Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/agente-android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sem o secret da chave sai um APK de DEBUG: instala num aparelho pra
      # experimentar, mas nao serve pra rede de lojas - cada build teria uma
      # chave diferente, e ai uma versao nao atualiza sobre a outra.
      - name: Preparar a chave de assinatura
        env:
          CHAVE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHAVE_B64" ]; then
            echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/chave.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/chave.jks" >> "$GITHUB_ENV"
            echo "Chave encontrada: o APK sai assinado para distribuicao."
          else
            echo "Sem ANDROID_KEYSTORE_BASE64: o APK sai com chave de debug,"
            echo "so para teste em um aparelho. Nao distribua este arquivo."
          fi

      - name: Compilar
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: nopulso-agente
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
